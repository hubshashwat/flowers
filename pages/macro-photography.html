<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Photography | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Focusing lens...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Macro Photography</h1>
            <p>Extreme close-up view of pollen grains and petal fibers with depth-of-field</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x080509,
                cameraPos: [0, 0.65, 2.2],
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 1.1,
                    maxDistance: 4.5,
                    autoRotate: true,
                    autoRotateSpeed: 0.3
                }
            });

            camera.fov = 38;
            camera.updateProjectionMatrix();

            // Studio Environment & Lighting
            FlowerUtils.createStudioEnvironment(renderer, 'warm_sunset');

            const ambientLight = new THREE.AmbientLight(0x201424, 1.2);
            scene.add(ambientLight);

            // Soft Macro Studio Key Light
            const macroKeyLight = new THREE.DirectionalLight(0xfff2e6, 2.6);
            macroKeyLight.position.set(2, 4, 2.5);
            scene.add(macroKeyLight);

            const softFillLight = new THREE.DirectionalLight(0xffaacc, 1.6);
            softFillLight.position.set(-3, 2, 1);
            scene.add(softFillLight);

            const rimLight = new THREE.DirectionalLight(0xffeedd, 2.2);
            rimLight.position.set(0, 3, -2.5);
            scene.add(rimLight);

            // Dark Pedestal
            const pedestal = FlowerUtils.createPedestal({
                radius: 1.85,
                height: 0.16,
                y: -0.78,
                color: 0x0e0812,
                metalness: 0.95,
                roughness: 0.12,
                rimColor: 0xff6688
            });
            scene.add(pedestal);

            // Shallow Depth-of-Field Bokeh Particles
            const bokehCount = 60;
            const bokehGeom = new THREE.BufferGeometry();
            const bokehPos = new Float32Array(bokehCount * 3);
            const bokehData = [];

            for (let i = 0; i < bokehCount; i++) {
                const x = (Math.random() - 0.5) * 3.0;
                const y = Math.random() * 2.0 - 0.2;
                const z = (Math.random() - 0.5) * 3.0;
                bokehPos[i * 3] = x;
                bokehPos[i * 3 + 1] = y;
                bokehPos[i * 3 + 2] = z;

                bokehData.push({
                    x, y, z,
                    speed: 0.3 + Math.random() * 0.6,
                    phase: Math.random() * Math.PI * 2
                });
            }
            bokehGeom.setAttribute('position', new THREE.BufferAttribute(bokehPos, 3));
            const bokehMat = new THREE.PointsMaterial({
                color: 0xffeedd,
                size: 0.05,
                transparent: true,
                opacity: 0.45,
                blending: THREE.AdditiveBlending
            });
            const bokehPoints = new THREE.Points(bokehGeom, bokehMat);
            scene.add(bokehPoints);

            // Flower Group
            const flower = new THREE.Group();
            flower.position.y = 0.35;
            scene.add(flower);

            // Velvet Hibiscus/Peony Petals
            const outerMat = new THREE.MeshPhysicalMaterial({
                color: 0xd62858,
                emissive: 0x4a0a1a,
                emissiveIntensity: 0.4,
                roughness: 0.28,
                metalness: 0.1,
                clearcoat: 0.9,
                clearcoatRoughness: 0.18,
                side: THREE.DoubleSide
            });

            const innerMat = new THREE.MeshPhysicalMaterial({
                color: 0xf04878,
                emissive: 0x5a1024,
                emissiveIntensity: 0.45,
                roughness: 0.22,
                metalness: 0.1,
                clearcoat: 1.0,
                side: THREE.DoubleSide
            });

            // 2 Tiers of Organic Petals
            const tiers = [
                { count: 10, length: 1.3, width: 0.48, curl: 0.85, wave: 0.26, angle: 0.85, y: 0.0, mat: outerMat },
                { count: 8,  length: 1.0, width: 0.4,  curl: 0.65, wave: 0.2,  angle: 0.6,  y: 0.08, mat: innerMat }
            ];

            const allPetals = [];

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsL: 28,
                    segmentsW: 20
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);
                    const mesh = new THREE.Mesh(geom, tier.mat);
                    mesh.position.y = tier.y;
                    mesh.rotation.y = angle;
                    mesh.rotation.x = tier.angle;
                    mesh.userData = {
                        origRotX: tier.angle,
                        angle,
                        freq: 1.6 + tIdx * 0.4
                    };
                    flower.add(mesh);
                    allPetals.push(mesh);
                }
            });

            // Glistening Optical Dewdrops scattered on petals
            const dewPositions = [
                [0.22, 0.24, 0.25],
                [-0.28, 0.26, 0.18],
                [0.15, 0.22, -0.3],
                [-0.18, 0.25, -0.22],
                [0.35, 0.2, -0.12]
            ];
            dewPositions.forEach(pos => {
                const drop = FlowerUtils.createDewdrop({ radius: 0.032 + Math.random() * 0.02 });
                drop.position.set(...pos);
                flower.add(drop);
            });

            // Extreme Detail Stamen Cluster: 48 Filaments with Golden Anther Pollen
            FlowerUtils.createStamenCluster(flower, {
                count: 48,
                radius: 0.16,
                height: 0.38,
                spread: 0.42,
                stemColor: 0xffeeaa,
                antherColor: 0xffcc00,
                y: 0.15
            });

            // 120 Microscopic Pollen Grains clustering near center
            const pollenCount = 120;
            const pollenGeom = new THREE.SphereGeometry(0.016, 12, 12);
            const pollenMat = new THREE.MeshPhysicalMaterial({
                color: 0xffe600,
                emissive: 0xaa8800,
                emissiveIntensity: 0.6,
                roughness: 0.35,
                metalness: 0.2,
                clearcoat: 0.6
            });
            const pollenInstanced = new THREE.InstancedMesh(pollenGeom, pollenMat, pollenCount);
            const dummy = new THREE.Object3D();

            for (let i = 0; i < pollenCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const r = 0.04 + Math.random() * 0.15;
                const y = 0.18 + Math.random() * 0.22;
                dummy.position.set(Math.cos(theta) * r, y, Math.sin(theta) * r);
                const s = 0.6 + Math.random() * 0.8;
                dummy.scale.set(s, s, s);
                dummy.updateMatrix();
                pollenInstanced.setMatrixAt(i, dummy.matrix);
            }
            pollenInstanced.instanceMatrix.needsUpdate = true;
            flower.add(pollenInstanced);

            // Glowing Heart Core
            const core = FlowerUtils.createGlowingCore(flower, {
                radius: 0.22,
                color: 0xffaa00,
                innerColor: 0xffffff,
                y: 0.18
            });

            // Stem
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0.05, 0),
                new THREE.Vector3(0.03, -0.28, 0.02),
                new THREE.Vector3(-0.02, -0.55, -0.01),
                new THREE.Vector3(0, -0.78, 0)
            ]);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.032, 12, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x1a3418,
                emissive: 0x081608,
                emissiveIntensity: 0.4,
                roughness: 0.35,
                clearcoat: 0.8
            });
            const stemMesh = new THREE.Mesh(stemGeom, stemMat);
            flower.add(stemMesh);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Gentle floating breath
                flower.position.y = 0.35 + Math.sin(elapsed * 1.5) * 0.03;

                // Petal breathing
                for (let i = 0; i < allPetals.length; i++) {
                    const p = allPetals[i];
                    const wave = Math.sin(elapsed * p.userData.freq + p.userData.angle) * 0.03;
                    p.rotation.x = p.userData.origRotX + wave;
                }

                // Bokeh floating
                const pos = bokehGeom.attributes.position.array;
                for (let i = 0; i < bokehCount; i++) {
                    const d = bokehData[i];
                    pos[i * 3 + 1] = d.y + Math.sin(elapsed * d.speed + d.phase) * 0.15;
                }
                bokehGeom.attributes.position.needsUpdate = true;

                core.pulse(elapsed, 1.8);
                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
