<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Zen Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Finding peace...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Minimal Zen</h1>
            <p>Single white flower, extreme simplicity, focus on calm motion and light</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x050608,
                cameraPos: [0, 1.4, 3.8],
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.0,
                    maxDistance: 7.0,
                    autoRotate: true,
                    autoRotateSpeed: 0.25
                }
            });

            // Studio Environment & Lighting
            FlowerUtils.createStudioEnvironment(renderer, 'crystal_ice');

            const ambientLight = new THREE.AmbientLight(0x141820, 1.2);
            scene.add(ambientLight);

            const softKeyLight = new THREE.DirectionalLight(0xfff8f0, 2.2);
            softKeyLight.position.set(3, 6, 3);
            scene.add(softKeyLight);

            const coolFillLight = new THREE.DirectionalLight(0xd0e8ff, 1.4);
            coolFillLight.position.set(-3, 2, -3);
            scene.add(coolFillLight);

            // Luxury Dark Basalt River Stone Pedestal with Water Ripple Ring
            const pedestal = FlowerUtils.createPedestal({
                radius: 1.85,
                height: 0.14,
                y: -0.78,
                color: 0x080a0c,
                metalness: 0.9,
                roughness: 0.18,
                rimColor: 0x90b8d0
            });
            scene.add(pedestal);

            // Minimal Atmosphere Motes
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 80,
                color: 0xd8eeff,
                size: 0.022,
                spread: 4.5,
                ySpread: 3.0
            });

            // Flower Group
            const flower = new THREE.Group();
            flower.position.y = 0.35;
            scene.add(flower);

            // Porcelain White Translucent Petal Material
            const petalMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                emissive: 0x222630,
                emissiveIntensity: 0.2,
                roughness: 0.15,
                metalness: 0.05,
                transmission: 0.45,
                ior: 1.52,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                sheen: new THREE.Color(0xffffff),
                side: THREE.DoubleSide
            });

            // 2 Tiers of Organic Zen Petals (7 outer, 5 inner)
            const tiers = [
                { count: 7, length: 1.12, width: 0.44, curl: 0.75, wave: 0.22, angle: 0.78, y: 0.0 },
                { count: 5, length: 0.86, width: 0.38, curl: 0.55, wave: 0.18, angle: 0.52, y: 0.06 }
            ];

            const allPetals = [];

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsL: 24,
                    segmentsW: 16
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.45);
                    const mesh = new THREE.Mesh(geom, petalMat);
                    mesh.position.y = tier.y;
                    mesh.rotation.y = angle;
                    mesh.rotation.x = tier.angle;
                    mesh.userData = {
                        origRotX: tier.angle,
                        angle,
                        freq: 1.4 + tIdx * 0.4
                    };
                    flower.add(mesh);
                    allPetals.push(mesh);
                }
            });

            // Pure Optical Dewdrop resting on outer petal
            const dewdrop = FlowerUtils.createDewdrop({ radius: 0.038 });
            dewdrop.position.set(0.38, 0.18, 0.2);
            flower.add(dewdrop);

            // Delicate Minimalist Golden Pistil & Stamens
            const core = FlowerUtils.createGlowingCore(flower, {
                radius: 0.18,
                color: 0xffe899,
                innerColor: 0xffffff,
                y: 0.18
            });

            FlowerUtils.createStamenCluster(flower, {
                count: 28,
                radius: 0.11,
                height: 0.28,
                spread: 0.32,
                stemColor: 0x998855,
                antherColor: 0xffea88,
                y: 0.15
            });

            // Slender Bamboo-Green Stem
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0.05, 0),
                new THREE.Vector3(0.02, -0.28, 0.015),
                new THREE.Vector3(-0.015, -0.55, -0.01),
                new THREE.Vector3(0, -0.78, 0)
            ]);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.022, 12, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x223820,
                emissive: 0x081608,
                emissiveIntensity: 0.3,
                roughness: 0.35,
                metalness: 0.3,
                clearcoat: 0.8
            });
            const stemMesh = new THREE.Mesh(stemGeom, stemMat);
            flower.add(stemMesh);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Extremely peaceful meditative breathing
                flower.position.y = 0.35 + Math.sin(elapsed * 1.1) * 0.025;

                for (let i = 0; i < allPetals.length; i++) {
                    const p = allPetals[i];
                    const wave = Math.sin(elapsed * p.userData.freq + p.userData.angle) * 0.02;
                    p.rotation.x = p.userData.origRotX + wave;
                }

                core.pulse(elapsed, 1.2);
                atmosphere.update();
                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
