<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translucent Petals | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Filtering light...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Translucent Petals</h1>
            <p>Light passes through delicate petals with beautiful backlight effects</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock, controls } = FlowerUtils.initScene(container, {
                background: 0x08060a,
                environmentTheme: 'warm_sunset',
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.2,
                    maxDistance: 6.5,
                    autoRotate: true,
                    autoRotateSpeed: 0.35
                }
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.45, 0);

            // Cinematic warm backlit studio lighting
            const ambient = new THREE.AmbientLight(0xfff0ea, 0.45);
            scene.add(ambient);

            // Strong warm backlight for translucent rim illumination
            const backLight = new THREE.DirectionalLight(0xffecd2, 2.4);
            backLight.position.set(0, 3, -3.5);
            scene.add(backLight);

            const keyLight = new THREE.DirectionalLight(0xffe4d6, 1.6);
            keyLight.position.set(3, 5, 2.5);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xffccd7, 1.0);
            fillLight.position.set(-3, 2.5, 2);
            scene.add(fillLight);

            // Pedestal & warm floating atmosphere
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.7,
                color: 0x0c0910,
                roughness: 0.18,
                metalness: 0.7,
                y: -0.8
            });

            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 100,
                color: 0xffd9c7,
                spread: 4.5,
                size: 0.03
            });

            // Flower group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Subsurface Scattering Translucent Material
            function createTranslucentMat(tint = 0xffe4e8, thickness = 0.55) {
                return new THREE.MeshPhysicalMaterial({
                    color: new THREE.Color(tint),
                    metalness: 0.02,
                    roughness: 0.22,
                    transmission: 0.82,
                    thickness: thickness,
                    ior: 1.48,
                    clearcoat: 0.3,
                    clearcoatRoughness: 0.15,
                    side: THREE.DoubleSide
                });
            }

            const petals = [];

            // Outer layer: Grand unfurling translucent petals
            const outerCount = 8;
            for (let i = 0; i < outerCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.55, 1.2, {
                    curl: 0.22,
                    cup: 0.2,
                    flare: 0.32,
                    ruffle: 0.03,
                    uSegments: 24,
                    vSegments: 32
                });
                const mat = createTranslucentMat(0xffd5dc, 0.65);
                const petal = new THREE.Mesh(geom, mat);

                const angle = (i / outerCount) * Math.PI * 2;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.55;
                petal.position.y = 0.44;
                petal.userData = { phase: i * 0.4, baseRotX: petal.rotation.x };

                // Add optical dewdrops on some outer petals
                if (i % 2 === 0) {
                    const drop = FlowerUtils.createDewdrop(0.028);
                    drop.position.set((Math.random() - 0.5) * 0.15, 0.45, 0.04);
                    petal.add(drop);
                }

                flowerGroup.add(petal);
                petals.push(petal);
            }

            // Middle layer: Cupped petals with peach blush
            const midCount = 8;
            for (let i = 0; i < midCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.44, 0.95, {
                    curl: 0.32,
                    cup: 0.26,
                    flare: 0.18,
                    ruffle: 0.02,
                    uSegments: 20,
                    vSegments: 28
                });
                const mat = createTranslucentMat(0xffe8df, 0.55);
                const petal = new THREE.Mesh(geom, mat);

                const angle = (i / midCount) * Math.PI * 2 + Math.PI / outerCount;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.35;
                petal.position.y = 0.47;
                petal.userData = { phase: i * 0.5 + 2, baseRotX: petal.rotation.x };

                flowerGroup.add(petal);
                petals.push(petal);
            }

            // Inner layer: Soft bud petals
            const innerCount = 6;
            for (let i = 0; i < innerCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.32, 0.7, {
                    curl: 0.4,
                    cup: 0.3,
                    flare: 0.08,
                    ruffle: 0.01,
                    uSegments: 18,
                    vSegments: 24
                });
                const mat = createTranslucentMat(0xfff2ea, 0.45);
                const petal = new THREE.Mesh(geom, mat);

                const angle = (i / innerCount) * Math.PI * 2 + 0.3;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.18;
                petal.position.y = 0.5;
                petal.userData = { phase: i * 0.6 + 4, baseRotX: petal.rotation.x };

                flowerGroup.add(petal);
                petals.push(petal);
            }

            // Delicate glowing stamen cluster in the center
            const stamens = FlowerUtils.createStamenCluster({
                count: 28,
                radius: 0.11,
                height: 0.28,
                filamentColor: 0xffeedd,
                pollenColor: 0xffa502,
                pollenEmissive: 0xcc6600
            });
            stamens.position.y = 0.5;
            flowerGroup.add(stamens);

            // Center glow light for internal backlighting
            const coreLight = new THREE.PointLight(0xffa07a, 1.6, 3);
            coreLight.position.y = 0.52;
            flowerGroup.add(coreLight);

            // Curved translucent jade green stem
            const stemPoints = [
                new THREE.Vector3(0, 0.44, 0),
                new THREE.Vector3(0.02, 0.2, 0.01),
                new THREE.Vector3(-0.015, -0.1, -0.01),
                new THREE.Vector3(0.01, -0.45, 0.005),
                new THREE.Vector3(0, -0.78, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.034, 16, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x3d7042,
                roughness: 0.3,
                metalness: 0.05,
                transmission: 0.3,
                thickness: 0.4,
                clearcoat: 0.3
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            flowerGroup.add(stem);

            // Translucent leaves
            [-0.08, -0.4].forEach((y, i) => {
                const leafGeom = FlowerUtils.createCurvedPetalGeometry(0.24, 0.65, {
                    curl: 0.35,
                    cup: 0.15,
                    flare: 0.2
                });
                const leaf = new THREE.Mesh(leafGeom, stemMat);
                leaf.position.set(i % 2 === 0 ? 0.02 : -0.02, y, 0);
                leaf.rotation.set(0.3, i % 2 === 0 ? 1.1 : -1.1, i % 2 === 0 ? 0.45 : -0.45);
                flowerGroup.add(leaf);
            });

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Gentle natural breathing
                petals.forEach(p => {
                    const breathe = Math.sin(elapsed * 0.7 + p.userData.phase) * 0.018;
                    p.rotation.x = p.userData.baseRotX + breathe;
                });

                // Subtle internal backlight glow
                coreLight.intensity = 1.4 + Math.sin(elapsed * 2) * 0.3;

                atmosphere.update(elapsed, delta);
                if (controls) controls.update(delta);

                renderer.render(scene, camera);
            }

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
