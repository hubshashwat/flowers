<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Computing recursive fractal iterations...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Fractal Flower</h1>
            <p>Self-similar recursive crystalline petals branching into infinite geometric sub-structures across dimensional scales</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x090610,
                antialias: true
            });

            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.45,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x201035, 0.7);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xfdf4ff, 2.2);
            sunLight.position.set(5, 8, 4);
            scene.add(sunLight);

            const purpleRim = new THREE.DirectionalLight(0xc084fc, 1.8);
            purpleRim.position.set(-4, -2, -3);
            scene.add(purpleRim);

            // Sacred Geometry Pedestal
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x100a1c,
                rimColor: 0xc084fc,
                marble: true
            });

            // Fractal crystal dust atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 110,
                color: 0xd8b4fe,
                size: 0.035,
                spread: 6.5,
                driftSpeed: 0.2
            });

            // Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Materials by recursion depth
            const depthMats = [
                new THREE.MeshPhysicalMaterial({ color: 0xec4899, roughness: 0.15, transmission: 0.5, thickness: 0.5, clearcoat: 1.0, side: THREE.DoubleSide }),
                new THREE.MeshPhysicalMaterial({ color: 0xa855f7, roughness: 0.18, transmission: 0.55, thickness: 0.45, clearcoat: 1.0, side: THREE.DoubleSide }),
                new THREE.MeshPhysicalMaterial({ color: 0x6366f1, roughness: 0.2, transmission: 0.6, thickness: 0.4, clearcoat: 1.0, side: THREE.DoubleSide })
            ];

            // Stem
            const stemPoints = [
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.04, -0.1, 0.02),
                new THREE.Vector3(-0.03, -0.6, -0.02),
                new THREE.Vector3(0.01, -1.25, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.038, 12, false);
            const stemMat = new THREE.MeshStandardMaterial({
                color: 0x3b0764,
                metalness: 0.85,
                roughness: 0.25
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            flowerGroup.add(stem);

            // Shared Petal Geometry
            const basePetalGeom = FlowerUtils.createCurvedPetalGeometry({
                length: 1.0,
                width: 0.42,
                curl: 0.6,
                wave: 0.2,
                segmentsW: 10,
                segmentsL: 16
            });

            // Recursive Branching Generator
            const fractalPetals = [];

            function buildFractalBranch(parentGroup, depth, maxDepth, scale, angle, tierIdx) {
                if (depth >= maxDepth) return;

                const pivot = new THREE.Group();
                pivot.rotation.y = angle;

                const mesh = new THREE.Mesh(basePetalGeom, depthMats[depth]);
                mesh.scale.setScalar(scale);
                mesh.rotation.x = 0.85 - depth * 0.2;
                pivot.add(mesh);
                parentGroup.add(pivot);

                fractalPetals.push({
                    mesh,
                    depth,
                    baseRotX: mesh.rotation.x,
                    phase: angle + depth
                });

                // Spawn child recursive petals at the tip of this petal
                if (depth < maxDepth - 1) {
                    const childScale = scale * 0.45;
                    const childCount = 3;
                    const tipNode = new THREE.Group();
                    tipNode.position.set(0, 0.85 * scale, 0);
                    mesh.add(tipNode);

                    for (let c = 0; c < childCount; c++) {
                        const cAngle = ((c - 1) * 0.55);
                        buildFractalBranch(tipNode, depth + 1, maxDepth, childScale, cAngle, tierIdx);
                    }
                }
            }

            // Primary Petal Ring (8-fold symmetry)
            const mainCount = 8;
            const mainRing = new THREE.Group();
            mainRing.position.y = 0.38;
            flowerGroup.add(mainRing);

            for (let i = 0; i < mainCount; i++) {
                const angle = (i / mainCount) * Math.PI * 2;
                buildFractalBranch(mainRing, 0, 3, 1.15, angle, 0);
            }

            // Secondary Inner Ring (6-fold symmetry)
            const innerRing = new THREE.Group();
            innerRing.position.y = 0.44;
            flowerGroup.add(innerRing);

            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 + 0.3;
                buildFractalBranch(innerRing, 0, 2, 0.85, angle, 1);
            }

            // Center Stamen Cluster
            const stamenCluster = FlowerUtils.createStamenCluster({
                count: 32,
                height: 0.30,
                spread: 0.14,
                antherColor: 0xf472b6,
                filamentColor: 0xe879f9
            });
            stamenCluster.position.y = 0.48;
            flowerGroup.add(stamenCluster);

            // Glowing Singularity Core
            const core = FlowerUtils.createGlowingCore({
                radius: 0.14,
                color: 0xc084fc,
                glowColor: 0xa855f7,
                emissiveIntensity: 2.2
            });
            core.position.y = 0.52;
            flowerGroup.add(core);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Harmonic recursive oscillation across fractal depth levels
                fractalPetals.forEach(p => {
                    const wave = Math.sin(elapsed * (2.0 + p.depth * 1.5) + p.phase) * (0.04 / (p.depth + 1));
                    p.mesh.rotation.x = p.baseRotX + wave;
                });

                mainRing.rotation.y = elapsed * 0.1;
                innerRing.rotation.y = -elapsed * 0.15;

                flowerGroup.position.y = Math.sin(elapsed * 0.8) * 0.02;

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
