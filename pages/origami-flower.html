<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origami Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Folding Japanese Washi paper...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Origami Flower</h1>
            <p>Crisp Japanese Washi paper petals with gold-leaf mountain creases unfolding in meditative geometric tranquility</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x0f0a0d,
                antialias: true
            });

            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.45,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x2d1822, 0.7);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xfff1f2, 2.2);
            sunLight.position.set(5, 8, 4);
            scene.add(sunLight);

            const roseRim = new THREE.DirectionalLight(0xf43f5e, 1.8);
            roseRim.position.set(-4, -2, -3);
            scene.add(roseRim);

            // Washi Bamboo Pedestal with Gold Rim
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x140e12,
                rimColor: 0xd4af37,
                marble: true
            });

            // Golden paper flakes atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 110,
                color: 0xfed7aa,
                size: 0.035,
                spread: 6.5,
                driftSpeed: 0.2
            });

            // Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Translucent Washi Paper Materials
            const washiOuterMat = new THREE.MeshPhysicalMaterial({
                color: 0xf43f5e,
                roughness: 0.85,
                metalness: 0.02,
                transmission: 0.4,
                thickness: 0.4,
                side: THREE.DoubleSide
            });

            const washiInnerMat = new THREE.MeshPhysicalMaterial({
                color: 0xfda4af,
                roughness: 0.88,
                metalness: 0.02,
                transmission: 0.45,
                thickness: 0.35,
                side: THREE.DoubleSide
            });

            const goldCreaseMat = new THREE.LineBasicMaterial({
                color: 0xd4af37,
                linewidth: 2
            });

            // Folded Origami Paper Stem
            const stemPoints = [
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.04, -0.1, 0.02),
                new THREE.Vector3(-0.03, -0.6, -0.02),
                new THREE.Vector3(0.01, -1.25, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 24, 0.035, 6, false); // 6-sided faceted fold!
            const stemMat = new THREE.MeshStandardMaterial({
                color: 0x2e5c38,
                roughness: 0.8,
                metalness: 0.05
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            flowerGroup.add(stem);

            // Origami Leaf Fold
            const leafShape = new THREE.Shape();
            leafShape.moveTo(0, 0);
            leafShape.lineTo(0.12, 0.35);
            leafShape.lineTo(0, 0.65);
            leafShape.lineTo(-0.12, 0.35);
            leafShape.closePath();
            const leafGeom = new THREE.ShapeGeometry(leafShape);
            const leafMesh = new THREE.Mesh(leafGeom, stemMat);
            leafMesh.position.set(0.03, -0.4, 0.02);
            leafMesh.rotation.set(0.8, 0.4, 0.6);
            flowerGroup.add(leafMesh);

            // Function to build an authentic 3D Origami folded petal
            function createFacetedOrigamiPetal(length, width, mat) {
                const group = new THREE.Group();

                // Left facet
                const leftGeom = new THREE.BufferGeometry();
                const leftVerts = new Float32Array([
                    0, 0, 0,
                    -width * 0.5, length * 0.5, width * 0.2,
                    0, length, 0
                ]);
                leftGeom.setAttribute('position', new THREE.BufferAttribute(leftVerts, 3));
                leftGeom.computeVertexNormals();
                const leftMesh = new THREE.Mesh(leftGeom, mat);
                group.add(leftMesh);

                // Right facet
                const rightGeom = new THREE.BufferGeometry();
                const rightVerts = new Float32Array([
                    0, 0, 0,
                    0, length, 0,
                    width * 0.5, length * 0.5, width * 0.2
                ]);
                rightGeom.setAttribute('position', new THREE.BufferAttribute(rightVerts, 3));
                rightGeom.computeVertexNormals();
                const rightMesh = new THREE.Mesh(rightGeom, mat);
                group.add(rightMesh);

                // Central Gold Mountain Crease Line
                const creasePoints = [
                    new THREE.Vector3(0, 0, 0.002),
                    new THREE.Vector3(0, length, 0.002)
                ];
                const creaseGeom = new THREE.BufferGeometry().setFromPoints(creasePoints);
                const creaseLine = new THREE.Line(creaseGeom, goldCreaseMat);
                group.add(creaseLine);

                return group;
            }

            // Petal Tiers
            const tiers = [
                { count: 10, length: 1.25, width: 0.50, y: 0.38, rotX: 0.95, mat: washiOuterMat },
                { count: 8,  length: 1.05, width: 0.42, y: 0.42, rotX: 0.72, mat: washiOuterMat },
                { count: 6,  length: 0.85, width: 0.35, y: 0.46, rotX: 0.48, mat: washiInnerMat }
            ];

            const petalMeshes = [];

            tiers.forEach((tier, tIdx) => {
                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);
                    const pivot = new THREE.Group();
                    pivot.position.set(0, tier.y, 0);
                    pivot.rotation.y = angle;

                    const petal = createFacetedOrigamiPetal(tier.length, tier.width, tier.mat);
                    petal.rotation.x = tier.rotX;

                    pivot.add(petal);
                    flowerGroup.add(pivot);

                    petalMeshes.push({
                        petal,
                        pivot,
                        tier: tIdx,
                        baseRotX: tier.rotX,
                        phase: i * 0.5 + tIdx * 1.4
                    });
                }
            });

            // Center Folded Paper Polyhedron & Stamens
            const polyGeom = new THREE.IcosahedronGeometry(0.12, 0);
            const polyMat = new THREE.MeshStandardMaterial({
                color: 0xfbbf24,
                roughness: 0.7,
                metalness: 0.1
            });
            const poly = new THREE.Mesh(polyGeom, polyMat);
            poly.position.y = 0.50;
            flowerGroup.add(poly);

            // Stamen Cluster
            const stamenCluster = FlowerUtils.createStamenCluster({
                count: 30,
                height: 0.28,
                spread: 0.12,
                antherColor: 0xd4af37,
                filamentColor: 0xfef3c7
            });
            stamenCluster.position.y = 0.48;
            flowerGroup.add(stamenCluster);

            // Core
            const core = FlowerUtils.createGlowingCore({
                radius: 0.13,
                color: 0xfbbf24,
                glowColor: 0xf59e0b,
                emissiveIntensity: 1.8
            });
            core.position.y = 0.52;
            flowerGroup.add(core);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Gentle folding and unfolding breath
                petalMeshes.forEach(p => {
                    const foldCycle = Math.sin(elapsed * 1.6 + p.phase) * 0.035;
                    p.petal.rotation.x = p.baseRotX + foldCycle;
                });

                poly.rotation.y = elapsed * 0.3;
                poly.rotation.x = elapsed * 0.2;

                flowerGroup.position.y = Math.sin(elapsed * 0.8) * 0.02;
                flowerGroup.rotation.y = elapsed * 0.1;

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
