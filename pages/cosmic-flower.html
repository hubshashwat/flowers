<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Creating cosmos...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Cosmic Flower</h1>
            <p>Nebula petals glowing among the stars, pulsing with cosmic energy</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock, controls } = FlowerUtils.initScene(container, {
                background: 0x030209,
                environmentTheme: 'cyberpunk',
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.2,
                    maxDistance: 6.5,
                    autoRotate: true,
                    autoRotateSpeed: 0.35
                }
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.45, 0);

            // Celestial starfield
            const starCount = 1200;
            const starGeom = new THREE.BufferGeometry();
            const starPositions = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 25 + Math.random() * 25;
                starPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                starPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                starPositions[i * 3 + 2] = r * Math.cos(phi);
            }
            starGeom.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starMat = new THREE.PointsMaterial({
                size: 0.08,
                color: 0xdfd5ff,
                transparent: true,
                opacity: 0.8
            });
            const stars = new THREE.Points(starGeom, starMat);
            scene.add(stars);

            // Studio lighting for cosmic bloom
            const ambient = new THREE.AmbientLight(0x180b2a, 0.5);
            scene.add(ambient);

            const stellarKey = new THREE.DirectionalLight(0xffe6f7, 2.0);
            stellarKey.position.set(3, 5, 3);
            scene.add(stellarKey);

            const magentaFill = new THREE.DirectionalLight(0xe056fd, 1.4);
            magentaFill.position.set(-3, 3, 2);
            scene.add(magentaFill);

            const cyanRim = new THREE.PointLight(0x00f0ff, 2.2, 8);
            cyanRim.position.set(0, 3, -2.5);
            scene.add(cyanRim);

            // Dark astral pedestal
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.7,
                color: 0x070410,
                roughness: 0.12,
                metalness: 0.85,
                y: -0.8
            });

            // Luminous celestial accretion rings
            const ringGeom = new THREE.RingGeometry(1.2, 1.32, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x9b59b6,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.6
            });
            const ring = new THREE.Mesh(ringGeom, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = -0.79;
            scene.add(ring);

            // Cosmic stardust atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 120,
                color: 0xc77dff,
                spread: 4.5,
                size: 0.03,
                speed: 0.25
            });

            // Flower group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Nebula Petal Materials
            function createNebulaMat(baseColor = 0x240046, emissiveColor = 0x9d4edd, intensity = 1.4) {
                return new THREE.MeshPhysicalMaterial({
                    color: new THREE.Color(baseColor),
                    emissive: new THREE.Color(emissiveColor),
                    emissiveIntensity: intensity,
                    roughness: 0.22,
                    metalness: 0.1,
                    clearcoat: 0.8,
                    clearcoatRoughness: 0.15,
                    side: THREE.DoubleSide
                });
            }

            const outerNebulaMat = createNebulaMat(0x10002b, 0x7b2cbf, 1.3);
            const midNebulaMat = createNebulaMat(0x240046, 0xc77dff, 1.6);
            const innerNebulaMat = createNebulaMat(0x3c096c, 0x00f0ff, 2.0);

            const petals = [];

            // Outer layer: Grand celestial wings
            const outerCount = 8;
            for (let i = 0; i < outerCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.55, 1.25, {
                    curl: 0.3,
                    cup: 0.22,
                    flare: 0.32,
                    ruffle: 0.03,
                    uSegments: 24,
                    vSegments: 32
                });
                const petal = new THREE.Mesh(geom, outerNebulaMat);

                const angle = (i / outerCount) * Math.PI * 2;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.52;
                petal.position.y = 0.44;
                petal.userData = { phase: i * 0.4, baseRotX: petal.rotation.x };
                flowerGroup.add(petal);
                petals.push(petal);
            }

            // Middle layer: Swirling nebula blades
            const midCount = 8;
            for (let i = 0; i < midCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.42, 0.95, {
                    curl: 0.38,
                    cup: 0.26,
                    flare: 0.2,
                    ruffle: 0.02,
                    uSegments: 20,
                    vSegments: 28
                });
                const petal = new THREE.Mesh(geom, midNebulaMat);

                const angle = (i / midCount) * Math.PI * 2 + Math.PI / outerCount;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.32;
                petal.position.y = 0.47;
                petal.userData = { phase: i * 0.5 + 2, baseRotX: petal.rotation.x };
                flowerGroup.add(petal);
                petals.push(petal);
            }

            // Inner layer: Star-core petals
            const innerCount = 6;
            for (let i = 0; i < innerCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.3, 0.7, {
                    curl: 0.42,
                    cup: 0.3,
                    flare: 0.12,
                    ruffle: 0.01,
                    uSegments: 18,
                    vSegments: 24
                });
                const petal = new THREE.Mesh(geom, innerNebulaMat);

                const angle = (i / innerCount) * Math.PI * 2 + 0.3;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.16;
                petal.position.y = 0.5;
                petal.userData = { phase: i * 0.6 + 4, baseRotX: petal.rotation.x };
                flowerGroup.add(petal);
                petals.push(petal);
            }

            // Supernova glowing pulsar core
            const cosmicCore = FlowerUtils.createGlowingCore({
                radius: 0.15,
                innerColor: 0xffffff,
                glowColor: 0x00f0ff,
                emissiveIntensity: 2.6
            });
            cosmicCore.group.position.y = 0.52;
            flowerGroup.add(cosmicCore.group);

            // Pulsar stamen filaments
            const stamens = FlowerUtils.createStamenCluster({
                count: 24,
                radius: 0.12,
                height: 0.32,
                filamentColor: 0x9d4edd,
                pollenColor: 0x00f0ff,
                pollenEmissive: 0x00f0ff
            });
            stamens.position.y = 0.5;
            flowerGroup.add(stamens);

            // Dark astral stem
            const stemPoints = [
                new THREE.Vector3(0, 0.44, 0),
                new THREE.Vector3(0.02, 0.2, 0.01),
                new THREE.Vector3(-0.015, -0.1, -0.01),
                new THREE.Vector3(0.01, -0.45, 0.005),
                new THREE.Vector3(0, -0.78, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.035, 16, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x0e071c,
                emissive: 0x240046,
                emissiveIntensity: 0.4,
                roughness: 0.3,
                metalness: 0.7,
                clearcoat: 0.5
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            flowerGroup.add(stem);

            // Astral nebula leaves
            [-0.08, -0.4].forEach((y, i) => {
                const leafGeom = FlowerUtils.createCurvedPetalGeometry(0.24, 0.65, {
                    curl: 0.35,
                    cup: 0.15,
                    flare: 0.25
                });
                const leaf = new THREE.Mesh(leafGeom, midNebulaMat);
                leaf.position.set(i % 2 === 0 ? 0.02 : -0.02, y, 0);
                leaf.rotation.set(0.28, i % 2 === 0 ? 1.15 : -1.15, i % 2 === 0 ? 0.45 : -0.45);
                flowerGroup.add(leaf);
            });

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Gentle cosmic breathing
                petals.forEach(p => {
                    const wave = Math.sin(elapsed * 0.8 + p.userData.phase) * 0.018;
                    p.rotation.x = p.userData.baseRotX + wave;
                });

                stars.rotation.y = elapsed * 0.01;
                ring.rotation.z = elapsed * 0.2;
                cosmicCore.update(elapsed);
                atmosphere.update(elapsed, delta);
                if (controls) controls.update(delta);

                renderer.render(scene, camera);
            }

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
