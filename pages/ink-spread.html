<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink-Spread Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Grinding pine-soot ink...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Ink-Spread Flower</h1>
            <p>Sculptural carbon soot ink petals emerging with capillary rice-paper diffusion, gold leaf foil flecks, and cinnabar seal highlights</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x090709,
                antialias: true
            });

            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.45,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x22141a, 0.7);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xfff1f2, 2.2);
            sunLight.position.set(5, 8, 4);
            scene.add(sunLight);

            const cinnabarRim = new THREE.DirectionalLight(0xe11d48, 1.8);
            cinnabarRim.position.set(-4, -2, -3);
            scene.add(cinnabarRim);

            // Inkstone Pedestal with Cinnabar Red Rim
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x0e080b,
                rimColor: 0xe11d48,
                marble: true
            });

            // Ink mist & cinnabar particles
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 110,
                color: 0xfca5a5,
                size: 0.035,
                spread: 6.5,
                driftSpeed: 0.2
            });

            // Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Carbon Soot Ink Physical Material
            const carbonInkMat = new THREE.MeshPhysicalMaterial({
                color: 0x181014,
                roughness: 0.25,
                metalness: 0.1,
                clearcoat: 0.9,
                clearcoatRoughness: 0.15,
                side: THREE.DoubleSide
            });

            const goldLeafMat = new THREE.MeshStandardMaterial({
                color: 0xd4af37,
                metalness: 0.95,
                roughness: 0.18
            });

            // Calligraphic Stem
            const stemPoints = [
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.04, -0.1, 0.02),
                new THREE.Vector3(-0.03, -0.6, -0.02),
                new THREE.Vector3(0.01, -1.25, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.038, 12, false);
            const stem = new THREE.Mesh(stemGeom, carbonInkMat);
            flowerGroup.add(stem);

            // Spreading capillary ink tendrils around base of stem
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const points = [];
                for (let s = 0; s <= 12; s++) {
                    const t = s / 12;
                    const r = 0.05 + t * 0.45;
                    const x = Math.cos(angle + Math.sin(t * 4) * 0.2) * r;
                    const z = Math.sin(angle + Math.sin(t * 4) * 0.2) * r;
                    points.push(new THREE.Vector3(x, 0.28 - t * 0.25, z));
                }
                const tendrilCurve = new THREE.CatmullRomCurve3(points);
                const tendrilGeom = new THREE.TubeGeometry(tendrilCurve, 16, 0.008 * (1 - 0.5), 6, false);
                const tendril = new THREE.Mesh(tendrilGeom, carbonInkMat);
                flowerGroup.add(tendril);
            }

            // Petals
            const tiers = [
                { count: 9, length: 1.25, width: 0.50, curl: 0.65, wave: 0.25, y: 0.38, rotX: 0.95 },
                { count: 8, length: 1.05, width: 0.44, curl: 0.55, wave: 0.22, y: 0.42, rotX: 0.72 },
                { count: 6, length: 0.85, width: 0.38, curl: 0.45, wave: 0.18, y: 0.46, rotX: 0.48 }
            ];

            const petalMeshes = [];

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsW: 14,
                    segmentsL: 24
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);
                    const pivot = new THREE.Group();
                    pivot.position.set(0, tier.y, 0);
                    pivot.rotation.y = angle;

                    const mesh = new THREE.Mesh(geom, carbonInkMat);
                    mesh.rotation.x = tier.rotX;

                    // Gold leaf flecks on outer petals
                    if (tIdx === 0 && i % 2 === 0) {
                        const fleckGeom = new THREE.PlaneGeometry(0.04, 0.06);
                        const fleck = new THREE.Mesh(fleckGeom, goldLeafMat);
                        fleck.position.set(0, tier.length * 0.6, 0.015);
                        fleck.rotation.z = Math.random() * Math.PI;
                        mesh.add(fleck);
                    }

                    pivot.add(mesh);
                    flowerGroup.add(pivot);

                    petalMeshes.push({
                        mesh,
                        pivot,
                        tier: tIdx,
                        baseRotX: tier.rotX,
                        phase: i * 0.5 + tIdx * 1.2
                    });
                }
            });

            // Center Stamen Cluster with Cinnabar Anthers
            const stamenCluster = FlowerUtils.createStamenCluster({
                count: 32,
                height: 0.32,
                spread: 0.14,
                antherColor: 0xe11d48,
                filamentColor: 0xd4af37
            });
            stamenCluster.position.y = 0.48;
            flowerGroup.add(stamenCluster);

            // Cinnabar Seal Core
            const core = FlowerUtils.createGlowingCore({
                radius: 0.14,
                color: 0xe11d48,
                glowColor: 0xbe123c,
                emissiveIntensity: 2.0
            });
            core.position.y = 0.52;
            flowerGroup.add(core);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Gentle breathing oscillation
                petalMeshes.forEach(p => {
                    const breath = Math.sin(elapsed * 1.5 + p.phase) * 0.025;
                    p.mesh.rotation.x = p.baseRotX + breath;
                });

                flowerGroup.position.y = Math.sin(elapsed * 0.8) * 0.02;
                flowerGroup.rotation.y = elapsed * 0.1;

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
