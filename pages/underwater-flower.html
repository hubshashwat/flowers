<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Underwater Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Submerging...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Underwater Flower</h1>
            <p>A deep-sea aquatic bloom whose refractive petals undulate with ocean currents beneath shimmering caustic light</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x04111d,
                antialias: true
            });

            scene.fog = new THREE.FogExp2(0x04111d, 0.12);

            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.6,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.8);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x08334c, 0.6);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0x7fe3ff, 2.0);
            sunLight.position.set(3, 8, 4);
            scene.add(sunLight);

            const deepRim = new THREE.DirectionalLight(0x00ffcc, 1.5);
            deepRim.position.set(-4, -2, -3);
            scene.add(deepRim);

            // Seabed Pedestal
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x051320,
                rimColor: 0x00e5ff,
                marble: true
            });

            // Deep-sea plankton atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 140,
                color: 0x55eeff,
                size: 0.035,
                spread: 7,
                driftSpeed: 0.2
            });

            // Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Curved Organic Seaweed Stem
            const stemPoints = [
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.08, -0.1, 0.03),
                new THREE.Vector3(-0.06, -0.6, -0.02),
                new THREE.Vector3(0.02, -1.25, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.038, 12, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x0f5544,
                roughness: 0.25,
                metalness: 0.1,
                clearcoat: 0.8
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            flowerGroup.add(stem);

            // Translucent Water-Refractive Petals (IOR 1.33)
            const petalMat = new THREE.MeshPhysicalMaterial({
                color: 0x38bdf8,
                emissive: 0x003344,
                emissiveIntensity: 0.4,
                roughness: 0.12,
                metalness: 0.05,
                transmission: 0.72,
                thickness: 0.7,
                ior: 1.33,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                side: THREE.DoubleSide
            });

            const tiers = [
                { count: 9, length: 1.30, width: 0.48, curl: 0.65, wave: 0.25, y: 0.38, rotX: 0.95 },
                { count: 8, length: 1.10, width: 0.42, curl: 0.55, wave: 0.22, y: 0.42, rotX: 0.75 },
                { count: 7, length: 0.90, width: 0.36, curl: 0.45, wave: 0.18, y: 0.46, rotX: 0.55 },
                { count: 5, length: 0.70, width: 0.30, curl: 0.35, wave: 0.15, y: 0.50, rotX: 0.35 }
            ];

            const petalMeshes = [];

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsW: 16,
                    segmentsL: 28
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);
                    const pivot = new THREE.Group();
                    pivot.position.set(0, tier.y, 0);
                    pivot.rotation.y = angle;

                    const mesh = new THREE.Mesh(geom, petalMat);
                    mesh.rotation.x = tier.rotX;
                    pivot.add(mesh);
                    flowerGroup.add(pivot);

                    petalMeshes.push({
                        mesh,
                        pivot,
                        tier: tIdx,
                        baseRotX: tier.rotX,
                        phase: i * 0.6 + tIdx * 1.5
                    });
                }
            });

            // Bioluminescent Anemone Tentacle Stamens
            const stamenGroup = new THREE.Group();
            stamenGroup.position.y = 0.48;
            flowerGroup.add(stamenGroup);

            const tentacleCount = 32;
            const tentacles = [];
            const tipGeom = new THREE.SphereGeometry(0.022, 12, 12);
            const tipMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

            for (let i = 0; i < tentacleCount; i++) {
                const angle = (i / tentacleCount) * Math.PI * 2;
                const dist = 0.04 + Math.random() * 0.12;
                const height = 0.22 + Math.random() * 0.14;

                const tCurve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(Math.cos(angle) * dist, 0, Math.sin(angle) * dist),
                    new THREE.Vector3(Math.cos(angle) * (dist + 0.04), height * 0.6, Math.sin(angle) * (dist + 0.04)),
                    new THREE.Vector3(Math.cos(angle) * (dist + 0.08), height, Math.sin(angle) * (dist + 0.08))
                ]);
                const tGeom = new THREE.TubeGeometry(tCurve, 12, 0.008, 6, false);
                const tMat = new THREE.MeshPhysicalMaterial({
                    color: 0x00c8b0,
                    transmission: 0.5,
                    roughness: 0.2
                });
                const tentacle = new THREE.Mesh(tGeom, tMat);
                stamenGroup.add(tentacle);

                const tip = new THREE.Mesh(tipGeom, tipMat);
                tip.position.set(Math.cos(angle) * (dist + 0.08), height, Math.sin(angle) * (dist + 0.08));
                stamenGroup.add(tip);

                tentacles.push({ tentacle, tip, phase: i * 0.4, baseX: tip.position.x, baseZ: tip.position.z });
            }

            // Bioluminescent Core
            const core = FlowerUtils.createGlowingCore({
                radius: 0.14,
                color: 0x00ffff,
                glowColor: 0x00a8cc,
                emissiveIntensity: 2.2
            });
            core.position.y = 0.52;
            flowerGroup.add(core);

            // Rising Glassy Underwater Bubbles
            const bubbleCount = 35;
            const bubbleGeom = new THREE.SphereGeometry(1, 16, 16);
            const bubbleMat = new THREE.MeshPhysicalMaterial({
                color: 0x88eeff,
                roughness: 0.05,
                metalness: 0.1,
                transmission: 0.9,
                ior: 1.1,
                clearcoat: 1.0
            });
            const bubbles = [];

            for (let i = 0; i < bubbleCount; i++) {
                const bMesh = new THREE.Mesh(bubbleGeom, bubbleMat);
                const scale = 0.02 + Math.random() * 0.04;
                bMesh.scale.setScalar(scale);
                bMesh.position.set(
                    (Math.random() - 0.5) * 3,
                    -1.2 + Math.random() * 4,
                    (Math.random() - 0.5) * 3
                );
                scene.add(bMesh);
                bubbles.push({
                    mesh: bMesh,
                    speed: 0.008 + Math.random() * 0.015,
                    sway: Math.random() * Math.PI * 2,
                    swaySpeed: 1 + Math.random() * 2
                });
            }

            // Volumetric God Rays from water surface
            const rayGeom = new THREE.ConeGeometry(0.3, 5, 8, 1, true);
            const rayMat = new THREE.MeshBasicMaterial({
                color: 0x55ccff,
                transparent: true,
                opacity: 0.06,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const rays = [];
            for (let i = 0; i < 4; i++) {
                const ray = new THREE.Mesh(rayGeom, rayMat);
                ray.position.set((i - 1.5) * 1.2, 2.5, (Math.random() - 0.5) * 1.5);
                ray.rotation.x = Math.PI;
                ray.rotation.z = (i - 1.5) * 0.12;
                scene.add(ray);
                rays.push({ ray, phase: i * 1.5 });
            }

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Ocean current undulating wave
                const currentX = Math.sin(elapsed * 0.9) * 0.08;
                const currentZ = Math.cos(elapsed * 0.7) * 0.05;

                flowerGroup.rotation.z = currentX * 0.5;
                flowerGroup.rotation.x = currentZ * 0.5;
                flowerGroup.position.y = Math.sin(elapsed * 0.8) * 0.02;

                // Petal undulation in current
                petalMeshes.forEach(p => {
                    const wave = Math.sin(elapsed * 1.8 + p.phase) * 0.06;
                    const sway = Math.cos(elapsed * 1.4 + p.phase) * 0.03;
                    p.mesh.rotation.x = p.baseRotX + wave;
                    p.mesh.rotation.z = sway;
                });

                // Tentacle stamen swaying
                tentacles.forEach(t => {
                    const tWave = Math.sin(elapsed * 2.2 + t.phase) * 0.015;
                    t.tip.position.x = t.baseX + tWave;
                    t.tip.position.z = t.baseZ + Math.cos(elapsed * 2.0 + t.phase) * 0.015;
                });

                // Bubbles rising
                bubbles.forEach(b => {
                    b.mesh.position.y += b.speed;
                    b.mesh.position.x += Math.sin(elapsed * b.swaySpeed + b.sway) * 0.003;
                    if (b.mesh.position.y > 3.0) {
                        b.mesh.position.y = -1.2;
                        b.mesh.position.x = (Math.random() - 0.5) * 3;
                        b.mesh.position.z = (Math.random() - 0.5) * 3;
                    }
                });

                // God rays shimmering
                rays.forEach(r => {
                    r.ray.material.opacity = 0.04 + Math.sin(elapsed * 1.5 + r.phase) * 0.025;
                });

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
