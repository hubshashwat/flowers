<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomechanical Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Calibrating servos...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Biomechanical Flower</h1>
            <p>Titanium alloy petal segments articulated with hydraulic micro-servos and a pulsating cybernetic plasma reactor</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x07090e,
                antialias: true
            });

            FlowerUtils.createStudioEnvironment(renderer, 'cyberpunk');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.5,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x0f172a, 0.7);
            scene.add(ambient);

            const spotLight = new THREE.SpotLight(0xe0f2fe, 2.5);
            spotLight.position.set(4, 8, 4);
            spotLight.angle = 0.6;
            spotLight.penumbra = 0.5;
            scene.add(spotLight);

            const cyanRim = new THREE.DirectionalLight(0x00f0ff, 1.8);
            cyanRim.position.set(-4, -2, -3);
            scene.add(cyanRim);

            // Industrial Pedestal
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x0f172a,
                rimColor: 0x00f0ff,
                marble: false
            });

            // Floating cyber spark motes
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 110,
                color: 0x38bdf8,
                size: 0.035,
                spread: 6.5,
                driftSpeed: 0.25
            });

            // Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Armored Articulated Stem with Conduit Rings
            const stemPoints = [
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.04, -0.1, 0.02),
                new THREE.Vector3(-0.03, -0.6, -0.02),
                new THREE.Vector3(0.01, -1.25, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.042, 16, false);
            const titanMat = new THREE.MeshStandardMaterial({
                color: 0x1e293b,
                metalness: 0.92,
                roughness: 0.24
            });
            const stem = new THREE.Mesh(stemGeom, titanMat);
            flowerGroup.add(stem);

            // Glowing energy conduits spiraling up the stem
            const conduitMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
            for (let i = 0; i < 6; i++) {
                const ringGeom = new THREE.TorusGeometry(0.048, 0.008, 8, 24);
                const ring = new THREE.Mesh(ringGeom, conduitMat);
                ring.position.set(0, -0.15 - i * 0.18, 0);
                ring.rotation.x = Math.PI / 2;
                flowerGroup.add(ring);
            }

            // Mechanical Petal Construction
            const goldAccMat = new THREE.MeshStandardMaterial({
                color: 0xd97706,
                metalness: 0.95,
                roughness: 0.18
            });

            const armorPetalMat = new THREE.MeshPhysicalMaterial({
                color: 0x334155,
                metalness: 0.88,
                roughness: 0.25,
                clearcoat: 0.8,
                clearcoatRoughness: 0.15,
                side: THREE.DoubleSide
            });

            const tiers = [
                { count: 8, length: 1.25, width: 0.46, curl: 0.65, wave: 0.22, y: 0.38, rotX: 0.95 },
                { count: 7, length: 1.05, width: 0.40, curl: 0.55, wave: 0.18, y: 0.42, rotX: 0.72 },
                { count: 6, length: 0.82, width: 0.34, curl: 0.45, wave: 0.15, y: 0.46, rotX: 0.48 }
            ];

            const petalMeshes = [];
            const pistons = [];

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsW: 14,
                    segmentsL: 24
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.45);
                    const pivot = new THREE.Group();
                    pivot.position.set(0, tier.y, 0);
                    pivot.rotation.y = angle;

                    const mesh = new THREE.Mesh(geom, armorPetalMat);
                    mesh.rotation.x = tier.rotX;

                    // Mechanical hinge bracket at petal base
                    const hingeGeom = new THREE.CylinderGeometry(0.024, 0.024, 0.14, 12);
                    const hinge = new THREE.Mesh(hingeGeom, goldAccMat);
                    hinge.rotation.z = Math.PI / 2;
                    hinge.position.set(0, 0.04, 0.02);
                    mesh.add(hinge);

                    // Hydraulic piston cylinder
                    const cylGeom = new THREE.CylinderGeometry(0.012, 0.012, 0.24, 8);
                    const cyl = new THREE.Mesh(cylGeom, goldAccMat);
                    cyl.position.set(0, 0.18, 0.04);
                    cyl.rotation.x = -0.3;
                    mesh.add(cyl);

                    pivot.add(mesh);
                    flowerGroup.add(pivot);

                    petalMeshes.push({
                        mesh,
                        pivot,
                        tier: tIdx,
                        baseRotX: tier.rotX,
                        phase: i * 0.5 + tIdx * 1.4
                    });
                }
            });

            // Fiber-optic Stamen Antennae
            const stamenCluster = FlowerUtils.createStamenCluster({
                count: 32,
                height: 0.32,
                spread: 0.14,
                antherColor: 0x00f0ff,
                filamentColor: 0x94a3b8
            });
            stamenCluster.position.y = 0.48;
            flowerGroup.add(stamenCluster);

            // Pulsating Plasma Reactor Core
            const core = FlowerUtils.createGlowingCore({
                radius: 0.14,
                color: 0x00f0ff,
                glowColor: 0x0284c7,
                emissiveIntensity: 2.4
            });
            core.position.y = 0.52;
            flowerGroup.add(core);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Mechanical servo breathing & expansion
                petalMeshes.forEach(p => {
                    const servo = Math.sin(elapsed * 1.8 + p.phase) * 0.035;
                    p.mesh.rotation.x = p.baseRotX + servo;
                });

                flowerGroup.position.y = Math.sin(elapsed * 0.8) * 0.02;
                flowerGroup.rotation.y = elapsed * 0.12;

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
