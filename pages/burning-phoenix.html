<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burning Phoenix Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Rising from ashes...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Burning Phoenix Flower</h1>
            <p>Ignites into flames and reborn from glowing embers</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock, controls } = FlowerUtils.initScene(container, {
                background: 0x0a0302,
                environmentTheme: 'warm_sunset',
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.2,
                    maxDistance: 6.5,
                    autoRotate: true,
                    autoRotateSpeed: 0.35
                }
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.45, 0);

            // Fiery studio lighting
            const ambient = new THREE.AmbientLight(0x280d04, 0.5);
            scene.add(ambient);

            const fireKey = new THREE.DirectionalLight(0xffeedd, 2.2);
            fireKey.position.set(3, 5, 3);
            scene.add(fireKey);

            const warmFill = new THREE.DirectionalLight(0xff6600, 1.6);
            warmFill.position.set(-3, 3, 2);
            scene.add(warmFill);

            const rimGold = new THREE.PointLight(0xffa500, 2.2, 8);
            rimGold.position.set(0, 3, -2.5);
            scene.add(rimGold);

            // Volcanic obsidian pedestal
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.7,
                color: 0x0f0503,
                roughness: 0.15,
                metalness: 0.8,
                y: -0.8
            });

            // Glowing ember ring on pedestal
            const ringGeom = new THREE.RingGeometry(1.25, 1.28, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xff4500,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.65
            });
            const ring = new THREE.Mesh(ringGeom, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = -0.79;
            scene.add(ring);

            // Fiery sparks atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 120,
                color: 0xffaa00,
                spread: 4.5,
                size: 0.032,
                speed: 0.35
            });

            // Flower group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Flame Petal Materials
            function createFlameMat(baseColor = 0x991100, emissiveColor = 0xff4500, emissiveIntensity = 1.4) {
                return new THREE.MeshPhysicalMaterial({
                    color: new THREE.Color(baseColor),
                    emissive: new THREE.Color(emissiveColor),
                    emissiveIntensity: emissiveIntensity,
                    roughness: 0.25,
                    metalness: 0.1,
                    clearcoat: 0.8,
                    clearcoatRoughness: 0.15,
                    side: THREE.DoubleSide
                });
            }

            const outerFlameMat = createFlameMat(0x880000, 0xff2200, 1.2);
            const midFlameMat = createFlameMat(0xaa2200, 0xff6600, 1.6);
            const innerFlameMat = createFlameMat(0xcc4400, 0xffaa00, 2.0);

            const petals = [];

            // Outer layer: Grand phoenix flame wings
            const outerCount = 8;
            for (let i = 0; i < outerCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.55, 1.25, {
                    curl: 0.32,
                    cup: 0.22,
                    flare: 0.35,
                    ruffle: 0.04,
                    uSegments: 24,
                    vSegments: 32
                });
                const petal = new THREE.Mesh(geom, outerFlameMat);

                const angle = (i / outerCount) * Math.PI * 2;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.52;
                petal.position.y = 0.44;
                petal.userData = { phase: i * 0.4, baseRotX: petal.rotation.x };
                flowerGroup.add(petal);
                petals.push(petal);
            }

            // Middle layer: Rising fire plumes
            const midCount = 8;
            for (let i = 0; i < midCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.42, 0.95, {
                    curl: 0.38,
                    cup: 0.26,
                    flare: 0.2,
                    ruffle: 0.03,
                    uSegments: 20,
                    vSegments: 28
                });
                const petal = new THREE.Mesh(geom, midFlameMat);

                const angle = (i / midCount) * Math.PI * 2 + Math.PI / outerCount;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.32;
                petal.position.y = 0.47;
                petal.userData = { phase: i * 0.5 + 2, baseRotX: petal.rotation.x };
                flowerGroup.add(petal);
                petals.push(petal);
            }

            // Inner layer: Core golden flame tongues
            const innerCount = 6;
            for (let i = 0; i < innerCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.3, 0.7, {
                    curl: 0.42,
                    cup: 0.3,
                    flare: 0.12,
                    ruffle: 0.02,
                    uSegments: 18,
                    vSegments: 24
                });
                const petal = new THREE.Mesh(geom, innerFlameMat);

                const angle = (i / innerCount) * Math.PI * 2 + 0.3;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.16;
                petal.position.y = 0.5;
                petal.userData = { phase: i * 0.6 + 4, baseRotX: petal.rotation.x };
                flowerGroup.add(petal);
                petals.push(petal);
            }

            // Fiery golden stamen embers
            const stamens = FlowerUtils.createStamenCluster({
                count: 24,
                radius: 0.12,
                height: 0.32,
                filamentColor: 0xffaa00,
                pollenColor: 0xffe600,
                pollenEmissive: 0xff8800
            });
            stamens.position.y = 0.5;
            flowerGroup.add(stamens);

            // Radiant molten core
            const fireCore = FlowerUtils.createGlowingCore({
                radius: 0.15,
                innerColor: 0xffffff,
                glowColor: 0xff5500,
                emissiveIntensity: 2.6
            });
            fireCore.group.position.y = 0.52;
            flowerGroup.add(fireCore.group);

            // Charred obsidian stem with molten gold veins
            const stemPoints = [
                new THREE.Vector3(0, 0.44, 0),
                new THREE.Vector3(0.02, 0.2, 0.01),
                new THREE.Vector3(-0.015, -0.1, -0.01),
                new THREE.Vector3(0.01, -0.45, 0.005),
                new THREE.Vector3(0, -0.78, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.036, 16, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x140602,
                emissive: 0x551100,
                emissiveIntensity: 0.5,
                roughness: 0.35,
                metalness: 0.6,
                clearcoat: 0.4
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            flowerGroup.add(stem);

            // Flame leaves
            [-0.08, -0.4].forEach((y, i) => {
                const leafGeom = FlowerUtils.createCurvedPetalGeometry(0.24, 0.65, {
                    curl: 0.35,
                    cup: 0.15,
                    flare: 0.25
                });
                const leaf = new THREE.Mesh(leafGeom, midFlameMat);
                leaf.position.set(i % 2 === 0 ? 0.02 : -0.02, y, 0);
                leaf.rotation.set(0.28, i % 2 === 0 ? 1.15 : -1.15, i % 2 === 0 ? 0.45 : -0.45);
                flowerGroup.add(leaf);
            });

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Dynamic flame flickering and breathing
                const flicker = Math.sin(elapsed * 8) * 0.15;
                petals.forEach(p => {
                    const wave = Math.sin(elapsed * 2.5 + p.userData.phase) * 0.022;
                    p.rotation.x = p.userData.baseRotX + wave;
                });

                innerFlameMat.emissiveIntensity = 1.8 + flicker + Math.sin(elapsed * 4) * 0.4;
                fireCore.update(elapsed);
                atmosphere.update(elapsed, delta);
                if (controls) controls.update(delta);

                renderer.render(scene, camera);
            }

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
