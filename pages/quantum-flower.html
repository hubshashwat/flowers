<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Superposition...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Quantum Flower</h1>
            <p>Exists in multiple states until observed</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x03030d,
                cameraPos: [0, 1.4, 3.8],
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.0,
                    maxDistance: 7.0,
                    autoRotate: true,
                    autoRotateSpeed: 0.4
                }
            });

            // Studio Environment & Lighting
            FlowerUtils.createStudioEnvironment(renderer, 'cyberpunk');

            const ambientLight = new THREE.AmbientLight(0x0e1124, 1.2);
            scene.add(ambientLight);

            const cyanLight = new THREE.DirectionalLight(0x00f2fe, 2.2);
            cyanLight.position.set(4, 5, 3);
            scene.add(cyanLight);

            const magentaLight = new THREE.DirectionalLight(0xff007f, 2.4);
            magentaLight.position.set(-4, 3, -3);
            scene.add(magentaLight);

            const quantumCenterLight = new THREE.PointLight(0x7000ff, 3.0, 7);
            quantumCenterLight.position.set(0, 0.6, 0);
            scene.add(quantumCenterLight);

            // Luxury Hologram Pedestal
            const pedestal = FlowerUtils.createPedestal({
                radius: 1.85,
                height: 0.16,
                y: -0.78,
                color: 0x060814,
                metalness: 0.95,
                roughness: 0.1,
                rimColor: 0x00ffff
            });
            scene.add(pedestal);

            // Quantum Subatomic Atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 120,
                color: 0x88eeff,
                size: 0.024,
                spread: 5.0,
                ySpread: 3.5
            });

            // Quantum Root Group
            const rootGroup = new THREE.Group();
            rootGroup.position.y = 0.35;
            scene.add(rootGroup);

            // Stem (Quantum fiber waveguide)
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0.05, 0),
                new THREE.Vector3(-0.02, -0.28, 0.02),
                new THREE.Vector3(0.02, -0.55, -0.01),
                new THREE.Vector3(0, -0.78, 0)
            ]);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.03, 16, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x081024,
                emissive: 0x004466,
                emissiveIntensity: 0.6,
                metalness: 0.9,
                roughness: 0.15,
                clearcoat: 1.0
            });
            const stemMesh = new THREE.Mesh(stemGeom, stemMat);
            rootGroup.add(stemMesh);

            // Probability States (3 Eigenstates)
            const eigenConfigs = [
                { color: 0x00f0ff, emissive: 0x0066aa, rotOffset: 0, curl: 0.7, wave: 0.3 },
                { color: 0xbf00ff, emissive: 0x7700aa, rotOffset: Math.PI / 3, curl: 0.55, wave: 0.2 },
                { color: 0xff007f, emissive: 0xaa0044, rotOffset: -Math.PI / 3, curl: 0.85, wave: 0.4 }
            ];

            const eigenStates = [];

            eigenConfigs.forEach((cfg, sIdx) => {
                const stateGroup = new THREE.Group();
                stateGroup.rotation.y = cfg.rotOffset;
                rootGroup.add(stateGroup);

                const petalMat = new THREE.MeshPhysicalMaterial({
                    color: cfg.color,
                    emissive: cfg.emissive,
                    emissiveIntensity: 1.0,
                    metalness: 0.2,
                    roughness: 0.1,
                    transmission: 0.65,
                    ior: 1.55,
                    transparent: true,
                    opacity: 0.65,
                    side: THREE.DoubleSide
                });

                const tiers = [
                    { count: 8, length: 1.1, width: 0.38, curl: cfg.curl, wave: cfg.wave, angle: 0.8, y: 0.0 },
                    { count: 6, length: 0.85, width: 0.32, curl: cfg.curl * 0.9, wave: cfg.wave, angle: 0.55, y: 0.06 },
                    { count: 5, length: 0.6, width: 0.25, curl: cfg.curl * 0.8, wave: cfg.wave, angle: 0.35, y: 0.12 }
                ];

                const petals = [];
                tiers.forEach((tier, tIdx) => {
                    const geom = FlowerUtils.createCurvedPetalGeometry({
                        length: tier.length,
                        width: tier.width,
                        curl: tier.curl,
                        wave: tier.wave,
                        segmentsL: 20,
                        segmentsW: 14
                    });

                    for (let i = 0; i < tier.count; i++) {
                        const angle = (i / tier.count) * Math.PI * 2 + tIdx * 0.35;
                        const mesh = new THREE.Mesh(geom, petalMat.clone());
                        mesh.position.y = tier.y;
                        mesh.rotation.y = angle;
                        mesh.rotation.x = tier.angle;
                        mesh.userData = { origRotX: tier.angle, angle, freq: 2.0 + tIdx * 0.5 };
                        stateGroup.add(mesh);
                        petals.push(mesh);
                    }
                });

                eigenStates.push({
                    group: stateGroup,
                    petals,
                    config: cfg,
                    phase: sIdx * ((Math.PI * 2) / 3)
                });
            });

            // Quantum Core & Stamens
            const core = FlowerUtils.createGlowingCore(rootGroup, {
                radius: 0.2,
                color: 0x00f0ff,
                innerColor: 0xffffff,
                y: 0.18
            });

            FlowerUtils.createStamenCluster(rootGroup, {
                count: 36,
                radius: 0.12,
                height: 0.35,
                spread: 0.4,
                stemColor: 0x0088cc,
                antherColor: 0xffffff,
                y: 0.15
            });

            // Quantum Entangled Orbital Rings
            const ringCount = 3;
            const rings = [];
            for (let r = 0; r < ringCount; r++) {
                const ringGeom = new THREE.TorusGeometry(0.55 + r * 0.25, 0.008, 16, 64);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: r === 0 ? 0x00ffff : (r === 1 ? 0xff00ff : 0x7744ff),
                    transparent: true,
                    opacity: 0.7
                });
                const ring = new THREE.Mesh(ringGeom, ringMat);
                ring.rotation.x = Math.PI / 2 + (r - 1) * 0.35;
                ring.position.y = 0.2;
                rootGroup.add(ring);
                rings.push(ring);
            }

            // Observer Effect Detection
            let isObserved = false;
            let collapseFactor = 0.0;
            let observedEigenIndex = 0;

            container.addEventListener('pointerenter', () => {
                isObserved = true;
                observedEigenIndex = Math.floor(Math.random() * eigenStates.length);
            });
            container.addEventListener('pointerleave', () => {
                isObserved = false;
            });
            container.addEventListener('pointerdown', () => {
                isObserved = true;
                observedEigenIndex = (observedEigenIndex + 1) % eigenStates.length;
            });

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();
                const delta = clock.getDelta();

                // Smooth collapse transition
                if (isObserved) {
                    collapseFactor = THREE.MathUtils.lerp(collapseFactor, 1.0, 0.08);
                } else {
                    collapseFactor = THREE.MathUtils.lerp(collapseFactor, 0.0, 0.04);
                }

                // Animate eigenstates
                eigenStates.forEach((state, idx) => {
                    const wave = Math.sin(elapsed * 2.2 + state.phase) * 0.5 + 0.5;
                    const isSelected = idx === observedEigenIndex;

                    // Opacity interpolation based on collapse
                    const targetOpacity = THREE.MathUtils.lerp(
                        0.35 + wave * 0.45,
                        isSelected ? 0.95 : 0.05,
                        collapseFactor
                    );

                    state.petals.forEach(p => {
                        p.material.opacity = targetOpacity;
                        p.rotation.x = p.userData.origRotX + Math.sin(elapsed * p.userData.freq + p.userData.angle) * 0.04;
                    });

                    // Sub-orbital jitter
                    const jitter = (1.0 - collapseFactor) * 0.04;
                    state.group.position.x = Math.sin(elapsed * 4.0 + state.phase) * jitter;
                    state.group.position.z = Math.cos(elapsed * 3.5 + state.phase) * jitter;
                    state.group.rotation.y = state.config.rotOffset + Math.sin(elapsed * 0.8 + idx) * (0.1 * (1.0 - collapseFactor));
                });

                // Rings precession
                rings.forEach((ring, r) => {
                    ring.rotation.z = elapsed * (0.6 + r * 0.3) * (r % 2 === 0 ? 1 : -1);
                    ring.rotation.y = elapsed * 0.4 * (r % 2 === 0 ? -1 : 1);
                });

                // Quantum core pulse
                core.pulse(elapsed, 2.0);
                quantumCenterLight.intensity = 2.5 + Math.sin(elapsed * 5.0) * 1.0 + collapseFactor * 2.0;

                atmosphere.update();
                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
