<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watercolor Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .aquarelle-badge {
            position: fixed;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 16, 22, 0.8);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 8px 24px;
            border-radius: 30px;
            color: #fbcfe8;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: 1px solid rgba(251, 207, 232, 0.25);
            box-shadow: 0 8px 32px rgba(236, 72, 153, 0.15);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .aquarelle-badge span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f472b6;
            box-shadow: 0 0 10px #f472b6;
        }
    </style>
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Blending wet-in-wet aquarelle pigment...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="aquarelle-badge">
            <span></span>
            Fine Art Aquarelle • Wet-in-Wet Pigment
        </div>
        <div class="flower-info">
            <h1>Watercolor Style</h1>
            <p>Hand-painted Impressionist aquarelle petals with pigment diffusion, wet granulations, and organic watercolor wash textures</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x0f0b12,
                antialias: true
            });

            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.45,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x281824, 0.7);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xfff0f5, 2.2);
            sunLight.position.set(5, 8, 4);
            scene.add(sunLight);

            const pinkRim = new THREE.DirectionalLight(0xf472b6, 1.8);
            pinkRim.position.set(-4, -2, -3);
            scene.add(pinkRim);

            // Aquarelle Gallery Pedestal
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x140e16,
                rimColor: 0xf472b6,
                marble: true
            });

            // Pigment dust motes
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 110,
                color: 0xfbcfe8,
                size: 0.035,
                spread: 6.5,
                driftSpeed: 0.2
            });

            // Procedural Fine Art Watercolor Texture Generator
            function createAquarelleTexture(baseHex, accentHex) {
                const cvs = document.createElement('canvas');
                cvs.width = 512;
                cvs.height = 512;
                const ctx = cvs.getContext('2d');

                const grad = ctx.createLinearGradient(0, 0, 512, 512);
                grad.addColorStop(0, baseHex);
                grad.addColorStop(0.6, accentHex);
                grad.addColorStop(1, '#fff1f2');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 512);

                // Wet-in-wet pigment blooms
                for (let i = 0; i < 40; i++) {
                    const x = Math.random() * 512;
                    const y = Math.random() * 512;
                    const r = 20 + Math.random() * 80;
                    const radGrad = ctx.createRadialGradient(x, y, 0, x, y, r);
                    radGrad.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
                    radGrad.addColorStop(0.8, 'rgba(244, 114, 182, 0.15)');
                    radGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = radGrad;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Fine paper grain
                const imgData = ctx.getImageData(0, 0, 512, 512);
                const d = imgData.data;
                for (let j = 0; j < d.length; j += 4) {
                    const noise = (Math.random() - 0.5) * 12;
                    d[j] = Math.min(255, Math.max(0, d[j] + noise));
                    d[j + 1] = Math.min(255, Math.max(0, d[j + 1] + noise));
                    d[j + 2] = Math.min(255, Math.max(0, d[j + 2] + noise));
                }
                ctx.putImageData(imgData, 0, 0);

                const tex = new THREE.CanvasTexture(cvs);
                return tex;
            }

            const outerTex = createAquarelleTexture('#ec4899', '#fb7185');
            const innerTex = createAquarelleTexture('#f43f5e', '#fda4af');

            // Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Translucent Watercolor Physical Petal Material
            const outerMat = new THREE.MeshPhysicalMaterial({
                map: outerTex,
                roughness: 0.65,
                metalness: 0.05,
                transmission: 0.35,
                thickness: 0.5,
                clearcoat: 0.3,
                side: THREE.DoubleSide
            });

            const innerMat = new THREE.MeshPhysicalMaterial({
                map: innerTex,
                roughness: 0.68,
                metalness: 0.05,
                transmission: 0.4,
                thickness: 0.45,
                clearcoat: 0.3,
                side: THREE.DoubleSide
            });

            // Stem
            const stemPoints = [
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.04, -0.1, 0.02),
                new THREE.Vector3(-0.03, -0.6, -0.02),
                new THREE.Vector3(0.01, -1.25, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.038, 12, false);
            const stemMat = new THREE.MeshStandardMaterial({
                color: 0x2e6638,
                roughness: 0.7
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            flowerGroup.add(stem);

            // Leaves
            const leafGeom = FlowerUtils.createCurvedPetalGeometry({
                length: 0.65,
                width: 0.24,
                curl: 0.28,
                wave: 0.12,
                segmentsW: 12,
                segmentsL: 18
            });
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x3d7a48, roughness: 0.6, side: THREE.DoubleSide });
            const leaf1 = new THREE.Mesh(leafGeom, leafMat);
            leaf1.position.set(0.03, -0.3, 0.02);
            leaf1.rotation.set(0.8, 0.4, 0.6);
            flowerGroup.add(leaf1);

            const leaf2 = new THREE.Mesh(leafGeom, leafMat);
            leaf2.position.set(-0.03, -0.7, -0.01);
            leaf2.rotation.set(0.7, -2.4, -0.5);
            leaf2.scale.setScalar(0.85);
            flowerGroup.add(leaf2);

            // Petals
            const tiers = [
                { count: 10, length: 1.25, width: 0.52, curl: 0.65, wave: 0.25, y: 0.38, rotX: 0.95, mat: outerMat },
                { count: 8,  length: 1.05, width: 0.45, curl: 0.55, wave: 0.22, y: 0.42, rotX: 0.72, mat: outerMat },
                { count: 6,  length: 0.85, width: 0.38, curl: 0.45, wave: 0.18, y: 0.46, rotX: 0.48, mat: innerMat }
            ];

            const petalMeshes = [];

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsW: 14,
                    segmentsL: 24
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);
                    const pivot = new THREE.Group();
                    pivot.position.set(0, tier.y, 0);
                    pivot.rotation.y = angle;

                    const mesh = new THREE.Mesh(geom, tier.mat);
                    mesh.rotation.x = tier.rotX;

                    if (tIdx === 0 && i % 2 === 0) {
                        const drop = FlowerUtils.createDewdrop({ radius: 0.024 });
                        drop.position.set(0, tier.length * 0.55, 0.02);
                        mesh.add(drop);
                    }

                    pivot.add(mesh);
                    flowerGroup.add(pivot);

                    petalMeshes.push({
                        mesh,
                        pivot,
                        tier: tIdx,
                        baseRotX: tier.rotX,
                        phase: i * 0.5 + tIdx * 1.2
                    });
                }
            });

            // Center Stamen Cluster
            const stamenCluster = FlowerUtils.createStamenCluster({
                count: 32,
                height: 0.32,
                spread: 0.14,
                antherColor: 0xfbbf24,
                filamentColor: 0xfef3c7
            });
            stamenCluster.position.y = 0.48;
            flowerGroup.add(stamenCluster);

            // Radiant Core
            const core = FlowerUtils.createGlowingCore({
                radius: 0.13,
                color: 0xfbbf24,
                glowColor: 0xf472b6,
                emissiveIntensity: 1.8
            });
            core.position.y = 0.52;
            flowerGroup.add(core);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Gentle breathing oscillation
                petalMeshes.forEach(p => {
                    const breath = Math.sin(elapsed * 1.5 + p.phase) * 0.025;
                    p.mesh.rotation.x = p.baseRotX + breath;
                });

                flowerGroup.position.y = Math.sin(elapsed * 0.8) * 0.02;
                flowerGroup.rotation.y = elapsed * 0.1;

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
