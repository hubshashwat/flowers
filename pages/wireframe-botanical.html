<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Botanical Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Synthesizing holographic wireframe...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Wireframe Botanical Flower</h1>
            <p>Architectural holographic wireframe bloom with glass lattice facets and streaming data pulses coursing through vascular circuits</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x060f0c,
                antialias: true
            });

            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.45,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x0a241b, 0.7);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xd1fae5, 2.0);
            sunLight.position.set(5, 8, 4);
            scene.add(sunLight);

            const emeraldRim = new THREE.DirectionalLight(0x10b981, 1.8);
            emeraldRim.position.set(-4, -2, -3);
            scene.add(emeraldRim);

            // Holographic CAD Pedestal
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x091812,
                rimColor: 0x10b981,
                marble: false
            });

            // Rotating Holographic Radar Rings
            const radarRings = [];
            for (let i = 0; i < 3; i++) {
                const ringGeom = new THREE.RingGeometry(0.5 + i * 0.4, 0.52 + i * 0.4, 48);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x34d399, side: THREE.DoubleSide, transparent: true, opacity: 0.35 - i * 0.08 });
                const ring = new THREE.Mesh(ringGeom, ringMat);
                ring.rotation.x = -Math.PI / 2;
                ring.position.y = -1.2 + i * 0.02;
                scene.add(ring);
                radarRings.push(ring);
            }

            // Atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 110,
                color: 0x6ee7b7,
                size: 0.035,
                spread: 6.5,
                driftSpeed: 0.2
            });

            // Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Materials
            const wireframeMat = new THREE.MeshBasicMaterial({
                color: 0x10b981,
                wireframe: true,
                transparent: true,
                opacity: 0.85
            });

            const glassFacetMat = new THREE.MeshPhysicalMaterial({
                color: 0x064e3b,
                roughness: 0.1,
                transmission: 0.85,
                thickness: 0.5,
                clearcoat: 1.0,
                transparent: true,
                opacity: 0.35,
                side: THREE.DoubleSide
            });

            // Wireframe Stem
            const stemPoints = [
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.04, -0.1, 0.02),
                new THREE.Vector3(-0.03, -0.6, -0.02),
                new THREE.Vector3(0.01, -1.25, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 24, 0.038, 8, false);
            const stemWire = new THREE.Mesh(stemGeom, wireframeMat);
            const stemGlass = new THREE.Mesh(stemGeom, glassFacetMat);
            flowerGroup.add(stemWire);
            flowerGroup.add(stemGlass);

            // Petals with Glass facets + Neon Wireframe
            const tiers = [
                { count: 9, length: 1.25, width: 0.46, curl: 0.65, wave: 0.22, y: 0.38, rotX: 0.95 },
                { count: 8, length: 1.05, width: 0.40, curl: 0.55, wave: 0.18, y: 0.42, rotX: 0.72 },
                { count: 6, length: 0.85, width: 0.34, curl: 0.45, wave: 0.15, y: 0.46, rotX: 0.48 }
            ];

            const petalMeshes = [];

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsW: 10,
                    segmentsL: 16
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);
                    const pivot = new THREE.Group();
                    pivot.position.set(0, tier.y, 0);
                    pivot.rotation.y = angle;

                    const glassMesh = new THREE.Mesh(geom, glassFacetMat);
                    const wireMesh = new THREE.Mesh(geom, wireframeMat);
                    glassMesh.rotation.x = tier.rotX;
                    wireMesh.rotation.x = tier.rotX;

                    pivot.add(glassMesh);
                    pivot.add(wireMesh);
                    flowerGroup.add(pivot);

                    petalMeshes.push({
                        glassMesh,
                        wireMesh,
                        pivot,
                        tier: tIdx,
                        baseRotX: tier.rotX,
                        phase: i * 0.5 + tIdx * 1.2
                    });
                }
            });

            // Streaming Data Pulses
            const dataPulseCount = 60;
            const pulseGeom = new THREE.BufferGeometry();
            const pulsePos = new Float32Array(dataPulseCount * 3);
            const pulseData = [];

            for (let i = 0; i < dataPulseCount; i++) {
                pulseData.push({
                    petalIndex: i % petalMeshes.length,
                    t: Math.random(),
                    speed: 0.4 + Math.random() * 0.4
                });
            }
            pulseGeom.setAttribute('position', new THREE.BufferAttribute(pulsePos, 3));
            const pulseMat = new THREE.PointsMaterial({
                color: 0x34d399,
                size: 0.055,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            const pulses = new THREE.Points(pulseGeom, pulseMat);
            flowerGroup.add(pulses);

            // Center Wireframe Icosahedron Core
            const core = FlowerUtils.createGlowingCore({
                radius: 0.14,
                color: 0x10b981,
                glowColor: 0x059669,
                emissiveIntensity: 2.2
            });
            core.position.y = 0.52;
            flowerGroup.add(core);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Rotate radar rings
                radarRings.forEach((r, idx) => {
                    r.rotation.z = elapsed * (0.2 + idx * 0.15) * (idx % 2 === 0 ? 1 : -1);
                });

                // Harmonic breathing oscillation
                petalMeshes.forEach(p => {
                    const wave = Math.sin(elapsed * 1.8 + p.phase) * 0.03;
                    p.glassMesh.rotation.x = p.baseRotX + wave;
                    p.wireMesh.rotation.x = p.baseRotX + wave;
                });

                // Update data pulses coursing through petal lines
                const pArr = pulseGeom.attributes.position.array;
                for (let i = 0; i < dataPulseCount; i++) {
                    const d = pulseData[i];
                    d.t = (d.t + 0.012 * d.speed) % 1.0;

                    const p = petalMeshes[d.petalIndex];
                    const angle = p.pivot.rotation.y;
                    const r = d.t * 1.1;
                    const y = p.pivot.position.y + Math.sin(d.t * Math.PI * 0.5) * 0.6;
                    const x = Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;

                    pArr[i * 3] = x;
                    pArr[i * 3 + 1] = y;
                    pArr[i * 3 + 2] = z;
                }
                pulseGeom.attributes.position.needsUpdate = true;

                flowerGroup.position.y = Math.sin(elapsed * 0.8) * 0.02;
                flowerGroup.rotation.y = elapsed * 0.1;

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
