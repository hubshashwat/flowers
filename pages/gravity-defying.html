<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity-Defying Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Nullifying gravitational field...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Gravity-Defying Flower</h1>
            <p>Independent pearlescent petals and detached segmented nodes suspended in a frictionless zero-gravity field</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x0a0714,
                antialias: true
            });

            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.4,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x201438, 0.7);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xf5f3ff, 2.2);
            sunLight.position.set(5, 8, 4);
            scene.add(sunLight);

            const violetRim = new THREE.DirectionalLight(0xa855f7, 1.8);
            violetRim.position.set(-4, -2, -3);
            scene.add(violetRim);

            // Anti-gravity emitter pedestal
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x0f0a1c,
                rimColor: 0xc084fc,
                marble: true
            });

            // Antigravity Field Emitter Rings
            for (let i = 0; i < 3; i++) {
                const ringGeom = new THREE.TorusGeometry(0.8 - i * 0.2, 0.012, 8, 48);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.6 - i * 0.15 });
                const ring = new THREE.Mesh(ringGeom, ringMat);
                ring.position.y = -1.15 + i * 0.12;
                ring.rotation.x = Math.PI / 2;
                scene.add(ring);
            }

            // Upward floating antigravity motes
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 120,
                color: 0xd8b4fe,
                size: 0.035,
                spread: 6.5,
                driftSpeed: 0.35
            });

            // Levitation Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Pearlescent Opal Petal Material
            const opalMat = new THREE.MeshPhysicalMaterial({
                color: 0xfdf4ff,
                roughness: 0.12,
                metalness: 0.1,
                transmission: 0.45,
                thickness: 0.6,
                clearcoat: 1.0,
                clearcoatRoughness: 0.08,
                ior: 1.52,
                side: THREE.DoubleSide
            });

            // Disjointed Levitation Stem (Floating Segments)
            const stemSegments = [];
            const segMat = new THREE.MeshStandardMaterial({
                color: 0x4c1d95,
                metalness: 0.85,
                roughness: 0.2
            });

            for (let i = 0; i < 7; i++) {
                const h = 0.12;
                const segGeom = new THREE.CylinderGeometry(0.026 - i * 0.002, 0.030 - i * 0.002, h, 16);
                const seg = new THREE.Mesh(segGeom, segMat);
                const baseY = -0.9 + i * 0.18;
                seg.position.set(0, baseY, 0);

                // Glowing levitation disc between segments
                const discGeom = new THREE.TorusGeometry(0.045, 0.006, 8, 24);
                const discMat = new THREE.MeshBasicMaterial({ color: 0xc084fc });
                const disc = new THREE.Mesh(discGeom, discMat);
                disc.rotation.x = Math.PI / 2;
                seg.add(disc);

                flowerGroup.add(seg);
                stemSegments.push({ seg, baseY, phase: i * 0.6 });
            }

            // Independent Floating Petal Tiers
            const tiers = [
                { count: 9, length: 1.25, width: 0.48, curl: 0.65, wave: 0.22, y: 0.40, rotX: 0.95 },
                { count: 8, length: 1.05, width: 0.42, curl: 0.55, wave: 0.20, y: 0.46, rotX: 0.72 },
                { count: 6, length: 0.85, width: 0.36, curl: 0.45, wave: 0.16, y: 0.52, rotX: 0.48 }
            ];

            const floatingPetals = [];

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsW: 14,
                    segmentsL: 24
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);
                    const pivot = new THREE.Group();
                    pivot.position.set(0, tier.y, 0);
                    pivot.rotation.y = angle;

                    const mesh = new THREE.Mesh(geom, opalMat);
                    mesh.rotation.x = tier.rotX;

                    // Optical levitation dewdrop
                    if (tIdx === 0 && i % 2 === 0) {
                        const drop = FlowerUtils.createDewdrop({ radius: 0.024 });
                        drop.position.set(0, tier.length * 0.55, 0.02);
                        mesh.add(drop);
                    }

                    pivot.add(mesh);
                    flowerGroup.add(pivot);

                    floatingPetals.push({
                        mesh,
                        pivot,
                        tier: tIdx,
                        baseRotX: tier.rotX,
                        baseY: tier.y,
                        phase: i * 0.6 + tIdx * 1.5,
                        driftRadius: 0.04 + Math.random() * 0.03
                    });
                }
            });

            // Floating Stamen Cluster
            const stamenCluster = FlowerUtils.createStamenCluster({
                count: 32,
                height: 0.32,
                spread: 0.14,
                antherColor: 0xc084fc,
                filamentColor: 0xe9d5ff
            });
            stamenCluster.position.y = 0.52;
            flowerGroup.add(stamenCluster);

            // Levitation Singularity Core
            const core = FlowerUtils.createGlowingCore({
                radius: 0.14,
                color: 0xc084fc,
                glowColor: 0x9333ea,
                emissiveIntensity: 2.2
            });
            core.position.y = 0.56;
            flowerGroup.add(core);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Zero-gravity harmonic levitation on independent petals
                floatingPetals.forEach(p => {
                    const bob = Math.sin(elapsed * 1.5 + p.phase) * 0.025;
                    const pitch = Math.cos(elapsed * 1.8 + p.phase) * 0.04;
                    const roll = Math.sin(elapsed * 1.2 + p.phase) * 0.02;

                    p.pivot.position.y = p.baseY + bob;
                    p.mesh.rotation.x = p.baseRotX + pitch;
                    p.mesh.rotation.z = roll;
                });

                // Floating stem segments undulating in zero-g
                stemSegments.forEach(s => {
                    s.seg.position.y = s.baseY + Math.sin(elapsed * 1.6 + s.phase) * 0.018;
                    s.seg.rotation.y = Math.sin(elapsed * 0.8 + s.phase) * 0.1;
                });

                flowerGroup.position.y = Math.sin(elapsed * 0.6) * 0.04;
                flowerGroup.rotation.y = elapsed * 0.08;

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
