<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photorealistic Rose | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Arranging petals...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>

        <div id="canvas-container" class="flower-canvas"></div>

        <div class="flower-info">
            <h1>Photorealistic Rose</h1>
            <p>Layered petals with soft shadows and cinematic lighting, like a product commercial</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>

    <script>
        // Photorealistic Single Rose - Luxury Velvet Edition
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock, controls } = FlowerUtils.initScene(container, {
                background: 0x060609,
                environmentTheme: 'dark_luxury',
                controls: {
                    target: new THREE.Vector3(0, 0.5, 0),
                    minDistance: 2.2,
                    maxDistance: 7.0,
                    autoRotate: true,
                    autoRotateSpeed: 0.3
                }
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.45, 0);

            // Studio lighting setup
            const ambient = new THREE.AmbientLight(0xfff5f0, 0.45);
            scene.add(ambient);

            // Key light (warm golden rim)
            const keyLight = new THREE.DirectionalLight(0xfff0e4, 2.2);
            keyLight.position.set(3.5, 6, 3.5);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.bias = -0.0001;
            scene.add(keyLight);

            // Fill light (soft rose-tinted fill)
            const fillLight = new THREE.DirectionalLight(0xecd4df, 1.2);
            fillLight.position.set(-3.5, 3.5, 2);
            scene.add(fillLight);

            // Rim backlight for velvet edge glow
            const rimLight = new THREE.DirectionalLight(0xffaacc, 1.6);
            rimLight.position.set(0, 4.5, -4);
            scene.add(rimLight);

            // Atmosphere & pedestal
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 110,
                color: 0xffd5e0,
                spread: 5,
                size: 0.03
            });

            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                color: 0x09090d,
                metalness: 0.7,
                roughness: 0.25,
                y: -0.8
            });

            // Rose group
            const roseGroup = new THREE.Group();
            scene.add(roseGroup);

            // Create physical velvet petal material with subsurface transmission and sheen
            function createRoseMaterial(brightness = 1, hueShift = 0) {
                const baseColor = new THREE.Color().setHSL(0.98 + hueShift, 0.88, 0.32 * brightness);
                const sheenCol = new THREE.Color().setHSL(0.97 + hueShift, 0.95, 0.58 * brightness);

                return new THREE.MeshPhysicalMaterial({
                    color: baseColor,
                    roughness: 0.38,
                    metalness: 0.02,
                    transmission: 0.14,
                    thickness: 0.55,
                    sheen: sheenCol,
                    clearcoat: 0.12,
                    clearcoatRoughness: 0.25,
                    side: THREE.DoubleSide
                });
            }

            const allPetals = [];

            // Tier 1: Tight Inner Spiral Core (Bud)
            const corePetalCount = 10;
            for (let i = 0; i < corePetalCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.32, 0.65, {
                    curl: 0.42,
                    cup: 0.35,
                    flare: 0.05,
                    ruffle: 0.01,
                    uSegments: 24,
                    vSegments: 32
                });
                const mat = createRoseMaterial(0.82 + (i / corePetalCount) * 0.18, -0.01);
                const petal = new THREE.Mesh(geom, mat);

                const angle = i * 2.39996; // Golden ratio spiral
                const radius = 0.03 + (i / corePetalCount) * 0.08;
                petal.position.set(
                    Math.cos(angle) * radius,
                    0.55 + (i / corePetalCount) * 0.06,
                    Math.sin(angle) * radius
                );
                petal.rotation.y = -angle + Math.PI / 2;
                petal.rotation.z = -0.15 - (i / corePetalCount) * 0.15;
                petal.castShadow = true;
                roseGroup.add(petal);

                allPetals.push({
                    mesh: petal,
                    baseRotZ: petal.rotation.z,
                    phase: i * 0.4,
                    speed: 1.2
                });
            }

            // Tier 2: Middle Unfurling Petals
            const midPetalCount = 14;
            for (let i = 0; i < midPetalCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.55, 0.95, {
                    curl: 0.28,
                    cup: 0.24,
                    flare: 0.22,
                    ruffle: 0.02,
                    uSegments: 28,
                    vSegments: 36
                });
                const mat = createRoseMaterial(0.92 + (i / midPetalCount) * 0.14, 0);
                const petal = new THREE.Mesh(geom, mat);

                const angle = i * (Math.PI * 2 / midPetalCount) + (i % 2) * 0.25;
                const radius = 0.14 + (i / midPetalCount) * 0.14;
                petal.position.set(
                    Math.cos(angle) * radius,
                    0.50 - (i / midPetalCount) * 0.04,
                    Math.sin(angle) * radius
                );
                petal.rotation.y = -angle + Math.PI / 2;
                petal.rotation.z = -0.42 - (i / midPetalCount) * 0.25;
                petal.castShadow = true;
                roseGroup.add(petal);

                allPetals.push({
                    mesh: petal,
                    baseRotZ: petal.rotation.z,
                    phase: i * 0.5 + 2,
                    speed: 1.0
                });
            }

            // Tier 3: Grand Outer Blooming Petals with Dewdrops
            const outerPetalCount = 16;
            for (let i = 0; i < outerPetalCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.72, 1.25, {
                    curl: 0.18,
                    cup: 0.18,
                    flare: 0.38,
                    ruffle: 0.03,
                    uSegments: 32,
                    vSegments: 40
                });
                const mat = createRoseMaterial(1.02 + (i % 3) * 0.06, 0.01);
                const petal = new THREE.Mesh(geom, mat);

                const angle = i * (Math.PI * 2 / outerPetalCount) + 0.2;
                const radius = 0.28 + (i / outerPetalCount) * 0.18;
                petal.position.set(
                    Math.cos(angle) * radius,
                    0.42 - (i / outerPetalCount) * 0.08,
                    Math.sin(angle) * radius
                );
                petal.rotation.y = -angle + Math.PI / 2;
                petal.rotation.z = -0.75 - (i / outerPetalCount) * 0.22;
                petal.castShadow = true;
                petal.receiveShadow = true;
                roseGroup.add(petal);

                // Add optical dewdrops on some outer petals
                if (i % 2 === 0) {
                    const dewdrop = FlowerUtils.createDewdrop(0.025 + Math.random() * 0.02);
                    dewdrop.position.set(
                        (Math.random() - 0.5) * 0.2,
                        0.4 + Math.random() * 0.35,
                        0.08
                    );
                    petal.add(dewdrop);
                }

                allPetals.push({
                    mesh: petal,
                    baseRotZ: petal.rotation.z,
                    phase: i * 0.45 + 4,
                    speed: 0.8
                });
            }

            // Calyx & Sepals (Green base holding the rose)
            const calyxMat = new THREE.MeshPhysicalMaterial({
                color: 0x224822,
                roughness: 0.45,
                clearcoat: 0.2,
                side: THREE.DoubleSide
            });
            for (let i = 0; i < 5; i++) {
                const sepalGeom = FlowerUtils.createCurvedPetalGeometry(0.18, 0.65, {
                    curl: 0.5,
                    cup: 0.1,
                    flare: 0.3,
                    ruffle: 0.01
                });
                const sepal = new THREE.Mesh(sepalGeom, calyxMat);
                const angle = (i / 5) * Math.PI * 2;
                sepal.position.set(Math.cos(angle) * 0.12, 0.42, Math.sin(angle) * 0.12);
                sepal.rotation.y = -angle + Math.PI / 2;
                sepal.rotation.z = -1.2;
                roseGroup.add(sepal);
            }

            // Organic curved stem
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0.42, 0),
                new THREE.Vector3(0.025, 0.15, 0.015),
                new THREE.Vector3(-0.02, -0.2, -0.01),
                new THREE.Vector3(0.01, -0.5, 0.005),
                new THREE.Vector3(0, -0.78, 0)
            ]);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.038, 16, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x2a542a,
                roughness: 0.4,
                clearcoat: 0.25,
                clearcoatRoughness: 0.2
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            stem.castShadow = true;
            roseGroup.add(stem);

            // Add organic leaves with serrated edges and gentle curve
            function createRoseLeaf() {
                const shape = new THREE.Shape();
                shape.moveTo(0, 0);
                shape.bezierCurveTo(0.15, 0.12, 0.26, 0.32, 0.14, 0.55);
                shape.bezierCurveTo(0.05, 0.68, 0.02, 0.72, 0, 0.75);
                shape.bezierCurveTo(-0.02, 0.72, -0.05, 0.68, -0.14, 0.55);
                shape.bezierCurveTo(-0.26, 0.32, -0.15, 0.12, 0, 0);

                const geom = new THREE.ShapeGeometry(shape, 24);
                const pos = geom.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const y = pos.getY(i);
                    const v = y / 0.75;
                    const arch = Math.sin(v * Math.PI) * 0.06;
                    pos.setZ(i, -arch);
                }
                pos.needsUpdate = true;
                geom.computeVertexNormals();
                return geom;
            }

            const leafMat = new THREE.MeshPhysicalMaterial({
                color: 0x245824,
                roughness: 0.35,
                clearcoat: 0.3,
                clearcoatRoughness: 0.2,
                side: THREE.DoubleSide
            });

            // Realistic leaf pairs
            [-0.1, -0.42].forEach((y, i) => {
                const leaf1 = new THREE.Mesh(createRoseLeaf(), leafMat);
                leaf1.position.set(0.03, y, 0.02);
                leaf1.rotation.set(-0.35, 0.9 + i * 0.6, 0.3);
                leaf1.scale.setScalar(0.75 - i * 0.1);
                leaf1.castShadow = true;
                roseGroup.add(leaf1);

                const leaf2 = new THREE.Mesh(createRoseLeaf(), leafMat);
                leaf2.position.set(-0.025, y - 0.08, -0.02);
                leaf2.rotation.set(-0.2, -0.8 - i * 0.5, -0.25);
                leaf2.scale.setScalar(0.68 - i * 0.1);
                leaf2.castShadow = true;
                roseGroup.add(leaf2);
            });

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Gentle natural petal breathing
                allPetals.forEach(p => {
                    const breathe = Math.sin(elapsed * p.speed + p.phase) * 0.015;
                    p.mesh.rotation.z = p.baseRotZ + breathe;
                });

                // Stem micro-sway
                roseGroup.rotation.y = Math.sin(elapsed * 0.3) * 0.05;

                // Update atmosphere and smooth orbit controls
                atmosphere.update(elapsed, delta);
                if (controls) controls.update(delta);

                renderer.render(scene, camera);
            }

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
