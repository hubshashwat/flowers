<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Bloom | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Growing petals...</p>
    </div>

    <div class="flower-page">
        <!-- Navigation -->
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>

        <!-- Three.js Canvas Container -->
        <div id="canvas-container" class="flower-canvas"></div>

        <!-- Flower Info -->
        <div class="flower-info">
            <h1>Procedural Bloom</h1>
            <p>Each petal is uniquely generated using parametric curves with noise-based deformation</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x0a060e,
                cameraPos: [0, 1.4, 3.8],
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.0,
                    maxDistance: 7.0,
                    autoRotate: true,
                    autoRotateSpeed: 0.35
                }
            });

            // Studio Environment & Lighting
            FlowerUtils.createStudioEnvironment(renderer, 'warm_sunset');

            const ambientLight = new THREE.AmbientLight(0x201026, 1.2);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffeedd, 2.2);
            keyLight.position.set(4, 6, 3);
            scene.add(keyLight);

            const rimLight = new THREE.DirectionalLight(0xff66aa, 2.4);
            rimLight.position.set(-4, 2, -3);
            scene.add(rimLight);

            // Luxury Pedestal
            const pedestal = FlowerUtils.createPedestal({
                radius: 1.85,
                height: 0.16,
                y: -0.78,
                color: 0x100816,
                metalness: 0.95,
                roughness: 0.12,
                rimColor: 0xff4488
            });
            scene.add(pedestal);

            // Floating Atmosphere Sparks
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 130,
                color: 0xff99bb,
                size: 0.025,
                spread: 5.0,
                ySpread: 3.5
            });

            // Flower Group
            const flower = new THREE.Group();
            flower.position.y = 0.35;
            scene.add(flower);

            // 3 Tiers of Parametrically Generated Petals
            const tiers = [
                { count: 12, length: 1.18, width: 0.42, curl: 0.8, wave: 0.28, angle: 0.82, y: 0.0, color: 0xd92b6b },
                { count: 9,  length: 0.95, width: 0.36, curl: 0.62, wave: 0.22, angle: 0.58, y: 0.06, color: 0xeb4886 },
                { count: 7,  length: 0.7,  width: 0.28, curl: 0.42, wave: 0.18, angle: 0.38, y: 0.12, color: 0xff70a6 }
            ];

            const allPetals = [];

            tiers.forEach((tier, tIdx) => {
                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.35);

                    // Procedural unique petal geometry with per-petal noise variation
                    const noiseCurl = tier.curl + (Math.random() - 0.5) * 0.12;
                    const noiseWave = tier.wave + (Math.random() - 0.5) * 0.08;
                    const geom = FlowerUtils.createCurvedPetalGeometry({
                        length: tier.length * (0.95 + Math.random() * 0.1),
                        width: tier.width * (0.95 + Math.random() * 0.1),
                        curl: noiseCurl,
                        wave: noiseWave,
                        segmentsL: 24,
                        segmentsW: 16
                    });

                    const mat = new THREE.MeshPhysicalMaterial({
                        color: tier.color,
                        emissive: 0x4a0a22,
                        emissiveIntensity: 0.4,
                        roughness: 0.3,
                        metalness: 0.15,
                        clearcoat: 0.8,
                        clearcoatRoughness: 0.2,
                        side: THREE.DoubleSide
                    });

                    const mesh = new THREE.Mesh(geom, mat);
                    mesh.position.y = tier.y;
                    mesh.rotation.y = angle;
                    mesh.rotation.x = tier.angle;
                    mesh.userData = {
                        origRotX: tier.angle,
                        angle,
                        scaleMax: 1.0,
                        freq: 1.8 + tIdx * 0.5,
                        phase: angle + tIdx
                    };
                    mesh.scale.setScalar(0.01); // Start small for bloom
                    flower.add(mesh);
                    allPetals.push(mesh);
                }
            });

            // Golden Core & Botanical Stamens
            const core = FlowerUtils.createGlowingCore(flower, {
                radius: 0.22,
                color: 0xffaa22,
                innerColor: 0xffffff,
                y: 0.18
            });

            FlowerUtils.createStamenCluster(flower, {
                count: 36,
                radius: 0.14,
                height: 0.34,
                spread: 0.38,
                stemColor: 0x995522,
                antherColor: 0xffdd44,
                y: 0.15
            });

            // Organic Stem
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0.05, 0),
                new THREE.Vector3(0.03, -0.28, 0.02),
                new THREE.Vector3(-0.02, -0.55, -0.01),
                new THREE.Vector3(0, -0.78, 0)
            ]);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.032, 12, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x182b14,
                emissive: 0x081406,
                emissiveIntensity: 0.4,
                metalness: 0.4,
                roughness: 0.35,
                clearcoat: 0.7
            });
            const stemMesh = new THREE.Mesh(stemGeom, stemMat);
            flower.add(stemMesh);

            let bloomProgress = 0;
            const bloomDuration = 2.4; // seconds

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();
                const delta = clock.getDelta();

                // Bloom animation
                if (bloomProgress < 1.0) {
                    bloomProgress = Math.min(bloomProgress + delta / bloomDuration, 1.0);
                    const eased = FlowerUtils.easing.easeOutBack(bloomProgress);
                    for (let i = 0; i < allPetals.length; i++) {
                        allPetals[i].scale.setScalar(allPetals[i].userData.scaleMax * Math.max(0.01, eased));
                    }
                }

                // Gentle natural breathing
                flower.position.y = 0.35 + Math.sin(elapsed * 1.5) * 0.035;

                for (let i = 0; i < allPetals.length; i++) {
                    const p = allPetals[i];
                    const wave = Math.sin(elapsed * p.userData.freq + p.userData.phase) * 0.035;
                    p.rotation.x = p.userData.origRotX + wave;
                }

                core.pulse(elapsed, 1.8);
                atmosphere.update();
                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
