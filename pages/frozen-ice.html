<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frozen Ice Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Crystallizing...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Frozen Ice Flower</h1>
            <p>Crystallizes from vapor with spreading frost patterns</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock, controls } = FlowerUtils.initScene(container, {
                background: 0x040810,
                environmentTheme: 'crystal_ice',
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.2,
                    maxDistance: 6.5,
                    autoRotate: true,
                    autoRotateSpeed: 0.35
                }
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.45, 0);

            // Polar studio lighting
            const ambient = new THREE.AmbientLight(0xd0e8ff, 0.5);
            scene.add(ambient);

            const mainLight = new THREE.DirectionalLight(0xe8f4ff, 2.2);
            mainLight.position.set(3.5, 5, 3.5);
            scene.add(mainLight);

            const coldFill = new THREE.DirectionalLight(0x70b0ff, 1.2);
            coldFill.position.set(-3.5, 3, -2);
            scene.add(coldFill);

            const rimLight = new THREE.PointLight(0xa5d8ff, 2.0, 8);
            rimLight.position.set(0, 2.5, -3);
            scene.add(rimLight);

            // Pedestal & frost atmosphere
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.7,
                color: 0x060c18,
                roughness: 0.12,
                metalness: 0.8,
                y: -0.8
            });

            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 120,
                color: 0xdef0ff,
                spread: 4.5,
                size: 0.03,
                speed: 0.3
            });

            // Flower group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Optical Ice Material (IOR = 1.31)
            const iceMat = new THREE.MeshPhysicalMaterial({
                color: 0xebf5ff,
                metalness: 0.04,
                roughness: 0.08,
                transmission: 0.92,
                thickness: 0.75,
                ior: 1.31,
                clearcoat: 1.0,
                clearcoatRoughness: 0.05,
                side: THREE.DoubleSide
            });

            const frostedIceMat = new THREE.MeshPhysicalMaterial({
                color: 0xc8e6ff,
                metalness: 0.08,
                roughness: 0.28,
                transmission: 0.82,
                thickness: 0.6,
                ior: 1.31,
                clearcoat: 0.8,
                side: THREE.DoubleSide
            });

            const petals = [];

            // Outer Glacial Petals (Layer 1)
            const outerCount = 8;
            for (let i = 0; i < outerCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.5, 1.15, {
                    curl: 0.28,
                    cup: 0.22,
                    flare: 0.24,
                    ruffle: 0.03,
                    uSegments: 24,
                    vSegments: 32
                });
                const petal = new THREE.Mesh(geom, iceMat.clone());
                const angle = (i / outerCount) * Math.PI * 2;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.45;
                petal.position.y = 0.46;
                petal.userData = { phase: i * 0.4, baseRotX: petal.rotation.x };
                flowerGroup.add(petal);
                petals.push(petal);
            }

            // Middle Frosted Petals (Layer 2)
            const midCount = 8;
            for (let i = 0; i < midCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.38, 0.85, {
                    curl: 0.35,
                    cup: 0.25,
                    flare: 0.15,
                    ruffle: 0.02,
                    uSegments: 20,
                    vSegments: 28
                });
                const petal = new THREE.Mesh(geom, frostedIceMat.clone());
                const angle = (i / midCount) * Math.PI * 2 + Math.PI / outerCount;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.26;
                petal.position.y = 0.49;
                petal.userData = { phase: i * 0.5 + 2, baseRotX: petal.rotation.x };
                flowerGroup.add(petal);
                petals.push(petal);
            }

            // Center: Cluster of sharp prismatic ice crystals
            const crystalCluster = new THREE.Group();
            crystalCluster.position.y = 0.52;
            flowerGroup.add(crystalCluster);

            const shardCount = 9;
            for (let s = 0; s < shardCount; s++) {
                const shardGeom = FlowerUtils.createFacetedCrystalGeometry(0.045, 0.28 + (s % 3) * 0.06, 6);
                const shard = new THREE.Mesh(shardGeom, iceMat);
                const angle = (s / shardCount) * Math.PI * 2;
                const r = 0.06 + (s % 2) * 0.04;
                shard.position.set(Math.cos(angle) * r, 0.05, Math.sin(angle) * r);
                shard.rotation.set((Math.random() - 0.5) * 0.4, angle, (Math.random() - 0.5) * 0.4);
                crystalCluster.add(shard);
            }

            // Center glowing ice core
            const iceCore = FlowerUtils.createGlowingCore({
                radius: 0.12,
                innerColor: 0xffffff,
                glowColor: 0x70c0ff,
                emissiveIntensity: 1.8
            });
            iceCore.group.position.y = 0.52;
            flowerGroup.add(iceCore.group);

            // Glacial icicle stem
            const stemPoints = [
                new THREE.Vector3(0, 0.46, 0),
                new THREE.Vector3(0.015, 0.2, 0.01),
                new THREE.Vector3(-0.015, -0.1, -0.01),
                new THREE.Vector3(0.01, -0.45, 0.005),
                new THREE.Vector3(0, -0.78, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.035, 16, false);
            const stem = new THREE.Mesh(stemGeom, iceMat);
            flowerGroup.add(stem);

            // Ice frost shards on stem
            [-0.08, -0.38].forEach((y, i) => {
                const leafGeom = FlowerUtils.createCurvedPetalGeometry(0.2, 0.55, {
                    curl: 0.4,
                    cup: 0.15,
                    flare: 0.2
                });
                const leaf = new THREE.Mesh(leafGeom, frostedIceMat);
                leaf.position.set(i % 2 === 0 ? 0.02 : -0.02, y, 0);
                leaf.rotation.set(0.25, i % 2 === 0 ? 1.1 : -1.1, i % 2 === 0 ? 0.45 : -0.45);
                flowerGroup.add(leaf);
            });

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Gentle crystalline breathing
                petals.forEach(petal => {
                    const breathe = Math.sin(elapsed * 0.6 + petal.userData.phase) * 0.018;
                    petal.rotation.x = petal.userData.baseRotX + breathe;
                });

                // Crystal core pulse
                iceCore.update(elapsed);
                atmosphere.update(elapsed, delta);
                if (controls) controls.update(delta);

                renderer.render(scene, camera);
            }

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
