<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heat Reactive Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .hint {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 100, 50, 0.15);
            border: 1px solid rgba(255, 100, 50, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            letter-spacing: 0.5px;
            z-index: 50;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Heating up...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="hint">🔥 Move your mouse near the flower to warm it up!</div>
        <div class="flower-info">
            <h1>Heat Reactive</h1>
            <p>Petals change color based on proximity to a glowing heat source</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x08040a,
                cameraPos: [0, 1.4, 3.8],
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.0,
                    maxDistance: 7.0,
                    autoRotate: true,
                    autoRotateSpeed: 0.35
                }
            });

            // Studio Environment & Lighting
            FlowerUtils.createStudioEnvironment(renderer, 'warm_sunset');

            const ambientLight = new THREE.AmbientLight(0x181024, 1.2);
            scene.add(ambientLight);

            const sunsetLight = new THREE.DirectionalLight(0xffeedd, 2.2);
            sunsetLight.position.set(4, 6, 3);
            scene.add(sunsetLight);

            const coldRimLight = new THREE.DirectionalLight(0x2255bb, 1.8);
            coldRimLight.position.set(-4, 2, -3);
            scene.add(coldRimLight);

            // Luxury Dark Gold Pedestal
            const pedestal = FlowerUtils.createPedestal({
                radius: 1.85,
                height: 0.16,
                y: -0.78,
                color: 0x0f0b12,
                metalness: 0.95,
                roughness: 0.12,
                rimColor: 0xff7722
            });
            scene.add(pedestal);

            // Floating Atmosphere Embers
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 130,
                color: 0xffaa44,
                size: 0.025,
                spread: 5.0,
                ySpread: 3.5
            });

            // Floating Heat Plasma Orb
            const heatOrbGroup = new THREE.Group();
            heatOrbGroup.position.set(1.4, 0.8, 1.2);
            scene.add(heatOrbGroup);

            const orbCoreGeom = new THREE.SphereGeometry(0.1, 32, 32);
            const orbCoreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const orbCore = new THREE.Mesh(orbCoreGeom, orbCoreMat);
            heatOrbGroup.add(orbCore);

            const orbCoronaGeom = new THREE.SphereGeometry(0.24, 24, 24);
            const orbCoronaMat = new THREE.MeshBasicMaterial({
                color: 0xff4400,
                transparent: true,
                opacity: 0.45,
                blending: THREE.AdditiveBlending
            });
            const orbCorona = new THREE.Mesh(orbCoronaGeom, orbCoronaMat);
            heatOrbGroup.add(orbCorona);

            const heatLight = new THREE.PointLight(0xff5511, 3.5, 5);
            heatOrbGroup.add(heatLight);

            // Mouse & Touch Tracking for Heat Orb
            const mouse = new THREE.Vector2();
            const raycaster = new THREE.Raycaster();
            const targetPos = new THREE.Vector3(1.4, 0.8, 1.2);
            let hasUserPointer = false;

            // Tracking plane at flower depth
            const trackingPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

            function onPointerMove(e) {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                hasUserPointer = true;

                raycaster.setFromCamera(mouse, camera);
                const hit = new THREE.Vector3();
                if (raycaster.ray.intersectPlane(trackingPlane, hit)) {
                    targetPos.copy(hit);
                    targetPos.z = Math.max(targetPos.z, 0.4);
                }
            }

            container.addEventListener('pointermove', onPointerMove);
            container.addEventListener('pointerleave', () => { hasUserPointer = false; });

            // Thermochromic Color Ramps
            const coldCol = new THREE.Color(0x1a2e66); // Deep sapphire
            const coldEmissive = new THREE.Color(0x060c22);
            const warmCol = new THREE.Color(0xd46a18); // Amber copper
            const warmEmissive = new THREE.Color(0x882200);
            const hotCol = new THREE.Color(0xff4422); // Molten crimson
            const hotEmissive = new THREE.Color(0xff3300);

            // Flower Group
            const flower = new THREE.Group();
            flower.position.y = 0.35;
            scene.add(flower);

            // 3 Tiers of Double-Curved Petals
            const tiers = [
                { count: 12, length: 1.15, width: 0.38, curl: 0.8, wave: 0.25, angle: 0.8, y: 0.0 },
                { count: 9,  length: 0.92, width: 0.34, curl: 0.6, wave: 0.2, angle: 0.55, y: 0.06 },
                { count: 7,  length: 0.68, width: 0.28, curl: 0.4, wave: 0.15, angle: 0.35, y: 0.12 }
            ];

            const allPetals = [];
            const tempWorldPos = new THREE.Vector3();
            const tempCol = new THREE.Color();
            const tempEmiss = new THREE.Color();

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsL: 24,
                    segmentsW: 16
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);

                    const mat = new THREE.MeshPhysicalMaterial({
                        color: coldCol.clone(),
                        emissive: coldEmissive.clone(),
                        emissiveIntensity: 0.6,
                        metalness: 0.4,
                        roughness: 0.3,
                        clearcoat: 0.85,
                        clearcoatRoughness: 0.2,
                        side: THREE.DoubleSide
                    });

                    const mesh = new THREE.Mesh(geom, mat);
                    mesh.position.y = tier.y;
                    mesh.rotation.y = angle;
                    mesh.rotation.x = tier.angle;
                    mesh.userData = {
                        origRotX: tier.angle,
                        angle,
                        heatLevel: 0.0,
                        freq: 1.8 + tIdx * 0.5
                    };
                    flower.add(mesh);
                    allPetals.push(mesh);
                }
            });

            // Core & Stamens
            const core = FlowerUtils.createGlowingCore(flower, {
                radius: 0.22,
                color: 0xff5500,
                innerColor: 0xffeedd,
                y: 0.18
            });

            FlowerUtils.createStamenCluster(flower, {
                count: 36,
                radius: 0.14,
                height: 0.34,
                spread: 0.38,
                stemColor: 0x993311,
                antherColor: 0xffbb44,
                y: 0.15
            });

            // Organic Stem
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0.05, 0),
                new THREE.Vector3(0.03, -0.28, 0.02),
                new THREE.Vector3(-0.02, -0.55, -0.01),
                new THREE.Vector3(0, -0.78, 0)
            ]);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.032, 12, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x182414,
                emissive: 0x081206,
                emissiveIntensity: 0.4,
                metalness: 0.5,
                roughness: 0.35,
                clearcoat: 0.7
            });
            const stemMesh = new THREE.Mesh(stemGeom, stemMat);
            flower.add(stemMesh);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();
                const delta = clock.getDelta();

                // Gentle floating breath
                flower.position.y = 0.35 + Math.sin(elapsed * 1.5) * 0.035;

                // Heat orb movement: follows pointer if available, else orbits smoothly
                if (!hasUserPointer) {
                    const orbitAngle = elapsed * 0.8;
                    targetPos.set(
                        Math.cos(orbitAngle) * 1.4,
                        0.7 + Math.sin(elapsed * 1.6) * 0.3,
                        Math.sin(orbitAngle) * 1.2
                    );
                }
                heatOrbGroup.position.lerp(targetPos, delta * 4.5);

                // Orb corona pulse
                const pulse = 1.0 + Math.sin(elapsed * 6.0) * 0.15;
                orbCorona.scale.setScalar(pulse);
                heatLight.intensity = 3.0 + Math.sin(elapsed * 5.0) * 1.0;

                // Petal heat conduction based on 3D distance
                for (let i = 0; i < allPetals.length; i++) {
                    const p = allPetals[i];
                    p.getWorldPosition(tempWorldPos);
                    const dist = tempWorldPos.distanceTo(heatOrbGroup.position);
                    const targetHeat = THREE.MathUtils.clamp(1.0 - (dist / 2.6), 0, 1);

                    p.userData.heatLevel = THREE.MathUtils.lerp(p.userData.heatLevel, targetHeat, delta * 3.5);
                    const h = p.userData.heatLevel;

                    if (h < 0.5) {
                        tempCol.lerpColors(coldCol, warmCol, h * 2);
                        tempEmiss.lerpColors(coldEmissive, warmEmissive, h * 2);
                    } else {
                        tempCol.lerpColors(warmCol, hotCol, (h - 0.5) * 2);
                        tempEmiss.lerpColors(warmEmissive, hotEmissive, (h - 0.5) * 2);
                    }

                    p.material.color.copy(tempCol);
                    p.material.emissive.copy(tempEmiss);
                    p.material.emissiveIntensity = 0.5 + h * 1.2;

                    // Petals curl slightly toward heat
                    const heatCurl = h * 0.12;
                    p.rotation.x = p.userData.origRotX - heatCurl + Math.sin(elapsed * p.userData.freq + p.userData.angle) * 0.03;
                }

                core.pulse(elapsed, 1.6);
                atmosphere.update();
                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
