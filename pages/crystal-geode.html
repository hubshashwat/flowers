<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Geode Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Cracking open...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Crystal Geode Flower</h1>
            <p>Rocky exterior cracks to reveal crystalline petals</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock, controls } = FlowerUtils.initScene(container, {
                background: 0x09060e,
                environmentTheme: 'crystal_ice',
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.2,
                    maxDistance: 6.5,
                    autoRotate: true,
                    autoRotateSpeed: 0.35
                }
            });

            camera.position.set(0, 1.5, 3.6);
            camera.lookAt(0, 0.45, 0);

            // Studio gemological lighting
            const ambient = new THREE.AmbientLight(0xf0e0ff, 0.5);
            scene.add(ambient);

            const keyLight = new THREE.DirectionalLight(0xfff5ea, 2.2);
            keyLight.position.set(3.5, 5.5, 3.5);
            scene.add(keyLight);

            const violetFill = new THREE.DirectionalLight(0xa55eea, 1.4);
            violetFill.position.set(-3.5, 3, -2);
            scene.add(violetFill);

            const rimLight = new THREE.PointLight(0xf368e0, 2.0, 8);
            rimLight.position.set(0, 3, -2.5);
            scene.add(rimLight);

            // Pedestal & crystal atmosphere
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.7,
                color: 0x0f0b18,
                roughness: 0.2,
                metalness: 0.7,
                y: -0.8
            });

            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 100,
                color: 0xdfb0ff,
                spread: 4.5,
                size: 0.03
            });

            // Geode flower group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Outer geode mineral shell material (obsidian & gold flecks)
            const rockMat = new THREE.MeshStandardMaterial({
                color: 0x221d28,
                roughness: 0.75,
                metalness: 0.25,
                side: THREE.DoubleSide
            });

            // Amethyst Crystal Materials
            const amethystMat = new THREE.MeshPhysicalMaterial({
                color: 0x9b59b6,
                metalness: 0.05,
                roughness: 0.08,
                transmission: 0.8,
                thickness: 0.7,
                ior: 1.55,
                clearcoat: 1.0,
                clearcoatRoughness: 0.06,
                side: THREE.DoubleSide
            });

            const deepAmethystMat = new THREE.MeshPhysicalMaterial({
                color: 0x6c2999,
                metalness: 0.08,
                roughness: 0.12,
                transmission: 0.7,
                thickness: 0.85,
                ior: 1.55,
                clearcoat: 1.0,
                side: THREE.DoubleSide
            });

            const quartzMat = new THREE.MeshPhysicalMaterial({
                color: 0xf1e5ff,
                metalness: 0.02,
                roughness: 0.04,
                transmission: 0.94,
                thickness: 0.6,
                ior: 1.54,
                clearcoat: 1.0,
                side: THREE.DoubleSide
            });

            // Layer 1: Outer Mineral Rock Petals (The Geode Crust)
            const shellCount = 7;
            const shellPetals = [];
            for (let i = 0; i < shellCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.55, 1.15, {
                    curl: 0.25,
                    cup: 0.26,
                    flare: 0.18,
                    ruffle: 0.04,
                    uSegments: 24,
                    vSegments: 32
                });
                const petal = new THREE.Mesh(geom, rockMat);
                const angle = (i / shellCount) * Math.PI * 2;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.55;
                petal.position.y = 0.44;
                petal.userData = { phase: i * 0.4, baseRotX: petal.rotation.x };
                flowerGroup.add(petal);
                shellPetals.push(petal);
            }

            // Layer 2: Middle Amethyst Crystal Blades
            const crystalCount = 9;
            const crystalPetals = [];
            for (let i = 0; i < crystalCount; i++) {
                const geom = FlowerUtils.createCurvedPetalGeometry(0.42, 0.92, {
                    curl: 0.32,
                    cup: 0.22,
                    flare: 0.22,
                    ruffle: 0.02,
                    uSegments: 20,
                    vSegments: 28
                });
                const petal = new THREE.Mesh(geom, i % 2 === 0 ? amethystMat : deepAmethystMat);
                const angle = (i / crystalCount) * Math.PI * 2 + 0.25;
                petal.rotation.z = angle;
                petal.rotation.x = -Math.PI / 2 + 0.35;
                petal.position.y = 0.47;
                petal.userData = { phase: i * 0.5 + 2, baseRotX: petal.rotation.x };
                flowerGroup.add(petal);
                crystalPetals.push(petal);
            }

            // Layer 3: Inner Prismatic Quartz Cluster (Faceted Shards)
            const clusterGroup = new THREE.Group();
            clusterGroup.position.y = 0.5;
            flowerGroup.add(clusterGroup);

            const shardCount = 14;
            for (let s = 0; s < shardCount; s++) {
                const height = 0.3 + (s % 4) * 0.08;
                const radius = 0.045 + (s % 3) * 0.015;
                const shardGeom = FlowerUtils.createFacetedCrystalGeometry(radius, height, 6);
                const shard = new THREE.Mesh(shardGeom, s % 3 === 0 ? quartzMat : amethystMat);

                const angle = (s / shardCount) * Math.PI * 2;
                const r = 0.08 + (s % 3) * 0.05;
                shard.position.set(Math.cos(angle) * r, 0.06, Math.sin(angle) * r);
                shard.rotation.set((Math.random() - 0.5) * 0.5, angle, (Math.random() - 0.5) * 0.5);
                clusterGroup.add(shard);
            }

            // Glowing inner geode heart
            const geodeCore = FlowerUtils.createGlowingCore({
                radius: 0.13,
                innerColor: 0xffffff,
                glowColor: 0x9b59b6,
                emissiveIntensity: 2.2
            });
            geodeCore.group.position.y = 0.52;
            flowerGroup.add(geodeCore.group);

            // Mineral stem
            const stemPoints = [
                new THREE.Vector3(0, 0.44, 0),
                new THREE.Vector3(0.02, 0.2, 0.01),
                new THREE.Vector3(-0.015, -0.1, -0.01),
                new THREE.Vector3(0.01, -0.45, 0.005),
                new THREE.Vector3(0, -0.78, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.038, 16, false);
            const stem = new THREE.Mesh(stemGeom, rockMat);
            flowerGroup.add(stem);

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Dynamic geode breathing
                const cycle = Math.sin(elapsed * 0.7);
                shellPetals.forEach(p => {
                    p.rotation.x = p.userData.baseRotX + cycle * 0.03;
                });
                crystalPetals.forEach(p => {
                    p.rotation.x = p.userData.baseRotX + cycle * 0.04;
                });

                // Core pulse & atmosphere
                geodeCore.update(elapsed);
                atmosphere.update(elapsed, delta);
                if (controls) controls.update(delta);

                renderer.render(scene, camera);
            }

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
