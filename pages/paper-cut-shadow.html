<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper-Cut Shadow Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Layering shadowbox filigree...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Paper-Cut Shadow Flower</h1>
            <p>Intricate 3D layered kirigami silhouettes stacked in spatial depth casting dynamic ambient shadows with warm backlighting</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x0c0907,
                antialias: true
            });

            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.45,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x2d1a10, 0.7);
            scene.add(ambient);

            const warmBacklight = new THREE.DirectionalLight(0xffeedd, 2.4);
            warmBacklight.position.set(0, 2, -4);
            scene.add(warmBacklight);

            const keyLight = new THREE.DirectionalLight(0xffecd2, 1.8);
            keyLight.position.set(4, 6, 4);
            scene.add(keyLight);

            const amberRim = new THREE.DirectionalLight(0xf97316, 1.4);
            amberRim.position.set(-4, -2, -3);
            scene.add(amberRim);

            // Museum Shadowbox Pedestal
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x140c08,
                rimColor: 0xfb923c,
                marble: true
            });

            // Golden paper dust atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 110,
                color: 0xfed7aa,
                size: 0.035,
                spread: 6.5,
                driftSpeed: 0.2
            });

            // Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Kirigami Layer Materials with Physical Paper Texture & Subsurface Light
            const layerColors = [
                0x1a0f0a, // Darkest front silhouette
                0x2e1810,
                0x4d2818,
                0x733a20,
                0xa6552e,
                0xd97736  // Warmest glowing back layer
            ];

            // Stem
            const stemPoints = [
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.04, -0.1, 0.02),
                new THREE.Vector3(-0.03, -0.6, -0.02),
                new THREE.Vector3(0.01, -1.25, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 24, 0.035, 8, false);
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x22140c, roughness: 0.85 });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            flowerGroup.add(stem);

            // Function to generate filigree paper-cut layer
            function createFiligreeLayer(petalCount, outerR, innerR, color, zOffset) {
                const shape = new THREE.Shape();
                for (let i = 0; i < petalCount; i++) {
                    const a1 = (i / petalCount) * Math.PI * 2;
                    const aMid = ((i + 0.5) / petalCount) * Math.PI * 2;
                    const a2 = ((i + 1.0) / petalCount) * Math.PI * 2;

                    const x1 = Math.cos(a1) * innerR;
                    const y1 = Math.sin(a1) * innerR;
                    const xMid = Math.cos(aMid) * outerR;
                    const yMid = Math.sin(aMid) * outerR;
                    const x2 = Math.cos(a2) * innerR;
                    const y2 = Math.sin(a2) * innerR;

                    if (i === 0) shape.moveTo(x1, y1);
                    shape.quadraticCurveTo(xMid * 1.15, yMid * 1.15, x2, y2);
                }

                // Add decorative lace cutouts (holes)
                for (let i = 0; i < petalCount; i++) {
                    const a = ((i + 0.5) / petalCount) * Math.PI * 2;
                    const holeR = (outerR + innerR) * 0.5;
                    const hole = new THREE.Path();
                    const hx = Math.cos(a) * holeR;
                    const hy = Math.sin(a) * holeR;
                    hole.absarc(hx, hy, (outerR - innerR) * 0.15, 0, Math.PI * 2, true);
                    shape.holes.push(hole);
                }

                const extrude = new THREE.ExtrudeGeometry(shape, {
                    depth: 0.02,
                    bevelEnabled: true,
                    bevelThickness: 0.005,
                    bevelSize: 0.005,
                    bevelSegments: 2
                });
                extrude.center();

                const mat = new THREE.MeshPhysicalMaterial({
                    color: color,
                    roughness: 0.82,
                    metalness: 0.02,
                    clearcoat: 0.3,
                    side: THREE.DoubleSide
                });

                const mesh = new THREE.Mesh(extrude, mat);
                mesh.position.set(0, 0.46, zOffset);
                return mesh;
            }

            // Create 5 progressive Kirigami layers separated along Z-depth
            const layers = [];
            const layerConfigs = [
                { count: 12, outerR: 1.25, innerR: 0.45, z: 0.16 },
                { count: 10, outerR: 1.05, innerR: 0.38, z: 0.08 },
                { count: 8,  outerR: 0.88, innerR: 0.32, z: 0.00 },
                { count: 7,  outerR: 0.72, innerR: 0.26, z: -0.08 },
                { count: 6,  outerR: 0.56, innerR: 0.20, z: -0.16 }
            ];

            layerConfigs.forEach((cfg, idx) => {
                const mesh = createFiligreeLayer(cfg.count, cfg.outerR, cfg.innerR, layerColors[idx], cfg.z);
                flowerGroup.add(mesh);
                layers.push({
                    mesh,
                    baseZ: cfg.z,
                    rotSpeed: (idx % 2 === 0 ? 1 : -1) * (0.05 + idx * 0.02)
                });
            });

            // Center Stamen Cluster
            const stamenCluster = FlowerUtils.createStamenCluster({
                count: 28,
                height: 0.24,
                spread: 0.10,
                antherColor: 0xfbbf24,
                filamentColor: 0xd97736
            });
            stamenCluster.position.set(0, 0.46, 0.18);
            stamenCluster.rotation.x = Math.PI / 2;
            flowerGroup.add(stamenCluster);

            // Glowing Backlit Heart Core
            const core = FlowerUtils.createGlowingCore({
                radius: 0.15,
                color: 0xf97316,
                glowColor: 0xea580c,
                emissiveIntensity: 2.5
            });
            core.position.set(0, 0.46, -0.05);
            flowerGroup.add(core);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Multi-plane parallax breath
                layers.forEach((l, idx) => {
                    const breath = Math.sin(elapsed * 1.5 + idx * 0.4) * 0.015;
                    l.mesh.position.z = l.baseZ + breath;
                    l.mesh.rotation.z = Math.sin(elapsed * 0.4 + idx) * 0.05;
                });

                flowerGroup.position.y = Math.sin(elapsed * 0.8) * 0.02;
                flowerGroup.rotation.y = Math.sin(elapsed * 0.3) * 0.2;

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
