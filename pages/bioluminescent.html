<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bioluminescent Deep-Sea Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Descending...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Bioluminescent Deep-Sea Flower</h1>
            <p>Glowing in darkness with orbiting creatures</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock, controls } = FlowerUtils.initScene(container, {
                background: 0x02070e,
                environmentTheme: 'dark_luxury',
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.2,
                    maxDistance: 6.5,
                    autoRotate: true,
                    autoRotateSpeed: 0.35
                }
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.45, 0);

            // Abyssal lighting
            const ambient = new THREE.AmbientLight(0x061828, 0.5);
            scene.add(ambient);

            const moonLight = new THREE.DirectionalLight(0x4090d0, 1.2);
            moonLight.position.set(2, 5, 2);
            scene.add(moonLight);

            const bioRimLight = new THREE.PointLight(0x00f5d4, 2.0, 8);
            bioRimLight.position.set(0, 3, -2.5);
            scene.add(bioRimLight);

            // Abyssal pedestal pool
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.7,
                color: 0x030d18,
                roughness: 0.15,
                metalness: 0.8,
                y: -0.8
            });

            // Glowing bioluminescent pool ring
            const ringGeom = new THREE.RingGeometry(1.25, 1.28, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x00f5d4,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.6
            });
            const ring = new THREE.Mesh(ringGeom, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = -0.79;
            scene.add(ring);

            // Floating bioluminescent plankton atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 110,
                color: 0x00f5d4,
                spread: 4.5,
                size: 0.028,
                speed: 0.25
            });

            // Flower group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Abyssal velvet petal material
            const darkVelvetMat = new THREE.MeshPhysicalMaterial({
                color: 0x06182a,
                roughness: 0.35,
                metalness: 0.1,
                transmission: 0.2,
                thickness: 0.5,
                clearcoat: 0.3,
                side: THREE.DoubleSide
            });

            function createBioGlowMat(col = 0x00f5d4) {
                return new THREE.MeshPhysicalMaterial({
                    color: 0x031220,
                    emissive: new THREE.Color(col),
                    emissiveIntensity: 2.0,
                    roughness: 0.2,
                    metalness: 0.8,
                    side: THREE.DoubleSide
                });
            }

            const petals = [];

            // Outer bioluminescent petals
            const outerCount = 7;
            for (let i = 0; i < outerCount; i++) {
                const group = new THREE.Group();
                const geom = FlowerUtils.createCurvedPetalGeometry(0.55, 1.2, {
                    curl: 0.28,
                    cup: 0.22,
                    flare: 0.28,
                    ruffle: 0.03,
                    uSegments: 24,
                    vSegments: 32
                });

                const basePetal = new THREE.Mesh(geom, darkVelvetMat);
                group.add(basePetal);

                // Bioluminescent edge rim
                const glowMat = createBioGlowMat(i % 2 === 0 ? 0x00f5d4 : 0x00bbf9);
                const glowMesh = new THREE.Mesh(geom, glowMat);
                glowMesh.scale.set(1.015, 1.015, 1.015);
                glowMesh.position.z = -0.005;
                group.add(glowMesh);

                const angle = (i / outerCount) * Math.PI * 2;
                group.rotation.z = angle;
                group.rotation.x = -Math.PI / 2 + 0.52;
                group.position.y = 0.44;
                group.userData = { phase: i * 0.45, baseRotX: group.rotation.x, glowMat };
                flowerGroup.add(group);
                petals.push(group);
            }

            // Middle bioluminescent petals
            const midCount = 7;
            for (let i = 0; i < midCount; i++) {
                const group = new THREE.Group();
                const geom = FlowerUtils.createCurvedPetalGeometry(0.42, 0.92, {
                    curl: 0.36,
                    cup: 0.26,
                    flare: 0.16,
                    ruffle: 0.02,
                    uSegments: 20,
                    vSegments: 28
                });

                const basePetal = new THREE.Mesh(geom, darkVelvetMat);
                group.add(basePetal);

                const glowMat = createBioGlowMat(i % 2 !== 0 ? 0x00f5d4 : 0x70e000);
                const glowMesh = new THREE.Mesh(geom, glowMat);
                glowMesh.scale.set(1.015, 1.015, 1.015);
                group.add(glowMesh);

                const angle = (i / midCount) * Math.PI * 2 + Math.PI / outerCount;
                group.rotation.z = angle;
                group.rotation.x = -Math.PI / 2 + 0.32;
                group.position.y = 0.47;
                group.userData = { phase: i * 0.55 + 2, baseRotX: group.rotation.x, glowMat };
                flowerGroup.add(group);
                petals.push(group);
            }

            // Bioluminescent glowing stamen filaments
            const stamens = FlowerUtils.createStamenCluster({
                count: 24,
                radius: 0.12,
                height: 0.3,
                filamentColor: 0x00bbf9,
                pollenColor: 0x00f5d4,
                pollenEmissive: 0x00f5d4
            });
            stamens.position.y = 0.49;
            flowerGroup.add(stamens);

            // Glowing abyssal core
            const bioCore = FlowerUtils.createGlowingCore({
                radius: 0.13,
                innerColor: 0xffffff,
                glowColor: 0x00f5d4,
                emissiveIntensity: 2.2
            });
            bioCore.group.position.y = 0.51;
            flowerGroup.add(bioCore.group);

            // Deep organic stem
            const stemPoints = [
                new THREE.Vector3(0, 0.44, 0),
                new THREE.Vector3(0.02, 0.2, 0.01),
                new THREE.Vector3(-0.015, -0.1, -0.01),
                new THREE.Vector3(0.01, -0.45, 0.005),
                new THREE.Vector3(0, -0.78, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.035, 16, false);
            const stem = new THREE.Mesh(stemGeom, darkVelvetMat);
            flowerGroup.add(stem);

            // Orbiting luminous abyssal organisms
            const organisms = [];
            const orgGeom = new THREE.SphereGeometry(0.03, 12, 12);
            for (let i = 0; i < 8; i++) {
                const orgMat = new THREE.MeshBasicMaterial({
                    color: i % 2 === 0 ? 0x00f5d4 : 0x00bbf9,
                    transparent: true,
                    opacity: 0.85
                });
                const org = new THREE.Mesh(orgGeom, orgMat);
                const light = new THREE.PointLight(orgMat.color, 0.4, 1.2);
                org.add(light);

                org.userData = {
                    radius: 0.8 + Math.random() * 0.6,
                    speed: 0.6 + Math.random() * 0.4,
                    offset: Math.random() * Math.PI * 2,
                    yBase: 0.3 + (i / 8) * 0.4,
                    ySpeed: 0.8 + Math.random() * 0.5
                };
                scene.add(org);
                organisms.push(org);
            }

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Gentle pulsing bioluminescence
                const pulse = Math.sin(elapsed * 2.2) * 0.5 + 0.5;
                petals.forEach(p => {
                    const breathe = Math.sin(elapsed * 0.7 + p.userData.phase) * 0.018;
                    p.rotation.x = p.userData.baseRotX + breathe;
                    p.userData.glowMat.emissiveIntensity = 1.4 + pulse * 1.0;
                });

                // Organisms orbit
                organisms.forEach(org => {
                    const angle = elapsed * org.userData.speed + org.userData.offset;
                    org.position.x = Math.cos(angle) * org.userData.radius;
                    org.position.z = Math.sin(angle) * org.userData.radius;
                    org.position.y = org.userData.yBase + Math.sin(elapsed * org.userData.ySpeed) * 0.15;
                });

                bioCore.update(elapsed);
                atmosphere.update(elapsed, delta);
                if (controls) controls.update(delta);

                renderer.render(scene, camera);
            }

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
