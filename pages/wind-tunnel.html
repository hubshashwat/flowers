<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind-Tunnel Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .aero-badge {
            position: fixed;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(8, 16, 24, 0.8);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 8px 24px;
            border-radius: 30px;
            color: #38bdf8;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 8px 32px rgba(14, 165, 233, 0.2);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .aero-badge span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 10px #38bdf8;
            animation: aeroPulse 1.5s infinite ease-in-out;
        }

        @keyframes aeroPulse {
            0%, 100% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Calibrating supersonic streamlines...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="aero-badge">
            <span></span>
            Mach 1.2 Laminar Airflow • Aero Strain
        </div>
        <div class="flower-info">
            <h1>Wind-Tunnel Flower</h1>
            <p>Aerodynamic carbon-composite petals flexing dynamically within a supersonic wind tunnel accompanied by continuous laminar streamlines</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x070c14,
                antialias: true
            });

            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.45,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x0e1f30, 0.7);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xe0f2fe, 2.2);
            sunLight.position.set(5, 8, 4);
            scene.add(sunLight);

            const cyanRim = new THREE.DirectionalLight(0x38bdf8, 1.8);
            cyanRim.position.set(-4, -2, -3);
            scene.add(cyanRim);

            // Wind Tunnel Pedestal with Aero Grid
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x091420,
                rimColor: 0x38bdf8,
                marble: false
            });

            // Streamline wind motes
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 120,
                color: 0x7dd3fc,
                size: 0.035,
                spread: 6.5,
                driftSpeed: 0.35
            });

            // Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Carbon-Composite Aerodynamic Petal Material
            const aeroMat = new THREE.MeshPhysicalMaterial({
                color: 0x1e293b,
                emissive: 0x082f49,
                emissiveIntensity: 0.3,
                metalness: 0.9,
                roughness: 0.2,
                clearcoat: 0.9,
                clearcoatRoughness: 0.1,
                side: THREE.DoubleSide
            });

            // High-tensile Titanium Stem
            const stemPoints = [
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.04, -0.1, 0.02),
                new THREE.Vector3(-0.03, -0.6, -0.02),
                new THREE.Vector3(0.01, -1.25, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.038, 12, false);
            const stemMat = new THREE.MeshStandardMaterial({
                color: 0x334155,
                metalness: 0.95,
                roughness: 0.2
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            flowerGroup.add(stem);

            // Petals with Aerodynamic Camber
            const tiers = [
                { count: 9, length: 1.25, width: 0.46, curl: 0.75, wave: 0.28, y: 0.38, rotX: 0.95 },
                { count: 8, length: 1.05, width: 0.40, curl: 0.65, wave: 0.22, y: 0.42, rotX: 0.72 },
                { count: 6, length: 0.85, width: 0.34, curl: 0.50, wave: 0.18, y: 0.46, rotX: 0.48 }
            ];

            const petalMeshes = [];

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsW: 14,
                    segmentsL: 26
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);
                    const pivot = new THREE.Group();
                    pivot.position.set(0, tier.y, 0);
                    pivot.rotation.y = angle;

                    const mesh = new THREE.Mesh(geom, aeroMat);
                    mesh.rotation.x = tier.rotX;

                    // Neon edge boundary layer conduit
                    const edgeGeom = new THREE.CylinderGeometry(0.006, 0.006, tier.length * 0.85, 6);
                    edgeGeom.translate(0, tier.length * 0.48, 0.015);
                    const edgeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
                    const edgeMesh = new THREE.Mesh(edgeGeom, edgeMat);
                    mesh.add(edgeMesh);

                    pivot.add(mesh);
                    flowerGroup.add(pivot);

                    petalMeshes.push({
                        mesh,
                        pivot,
                        tier: tIdx,
                        baseRotX: tier.rotX,
                        phase: i * 0.6 + tIdx * 1.5
                    });
                }
            });

            // Laminar Streamline Tubes rushing through the wind tunnel
            const streamlineCount = 28;
            const streamlines = [];
            const streamMat = new THREE.MeshBasicMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.35
            });

            for (let i = 0; i < streamlineCount; i++) {
                const startY = -0.6 + (i / streamlineCount) * 2.0;
                const startZ = (Math.random() - 0.5) * 2.2;
                const points = [];
                for (let s = 0; s <= 20; s++) {
                    const x = -3.5 + s * 0.35;
                    const distToCenter = Math.sqrt(x * x + startZ * startZ);
                    const deflection = Math.exp(-distToCenter * 1.5) * 0.25;
                    points.push(new THREE.Vector3(x, startY + deflection, startZ + deflection * 0.5));
                }
                const curve = new THREE.CatmullRomCurve3(points);
                const geom = new THREE.TubeGeometry(curve, 24, 0.008, 6, false);
                const mesh = new THREE.Mesh(geom, streamMat);
                scene.add(mesh);
                streamlines.push({ mesh, phase: i * 0.35 });
            }

            // High-Speed Wind Particle Streaks
            const streakCount = 90;
            const streakGeom = new THREE.BufferGeometry();
            const streakPos = new Float32Array(streakCount * 3);
            const streakData = [];

            for (let i = 0; i < streakCount; i++) {
                streakPos[i * 3] = (Math.random() - 0.5) * 6;
                streakPos[i * 3 + 1] = -0.5 + Math.random() * 2.2;
                streakPos[i * 3 + 2] = (Math.random() - 0.5) * 3;
                streakData.push({
                    speed: 0.06 + Math.random() * 0.08,
                    baseY: streakPos[i * 3 + 1],
                    baseZ: streakPos[i * 3 + 2]
                });
            }
            streakGeom.setAttribute('position', new THREE.BufferAttribute(streakPos, 3));
            const streakMat = new THREE.PointsMaterial({
                color: 0xbae6fd,
                size: 0.055,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });
            const streaks = new THREE.Points(streakGeom, streakMat);
            scene.add(streaks);

            // Stamen Cluster & Core
            const stamenCluster = FlowerUtils.createStamenCluster({
                count: 32,
                height: 0.30,
                spread: 0.14,
                antherColor: 0x38bdf8,
                filamentColor: 0x64748b
            });
            stamenCluster.position.y = 0.48;
            flowerGroup.add(stamenCluster);

            const core = FlowerUtils.createGlowingCore({
                radius: 0.14,
                color: 0x0284c7,
                glowColor: 0x0369a1,
                emissiveIntensity: 2.2
            });
            core.position.y = 0.52;
            flowerGroup.add(core);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Wind aerodynamic buffeting on petals
                petalMeshes.forEach(p => {
                    const aeroFlutter = Math.sin(elapsed * 4.5 + p.phase) * 0.045 + Math.sin(elapsed * 9.0 + p.phase) * 0.02;
                    p.mesh.rotation.x = p.baseRotX + aeroFlutter;
                });

                // Wind particles rushing from left to right (-X to +X)
                const sPos = streakGeom.attributes.position.array;
                for (let i = 0; i < streakCount; i++) {
                    const d = streakData[i];
                    sPos[i * 3] += d.speed;
                    if (sPos[i * 3] > 3.5) {
                        sPos[i * 3] = -3.5;
                        sPos[i * 3 + 1] = -0.5 + Math.random() * 2.2;
                        sPos[i * 3 + 2] = (Math.random() - 0.5) * 3;
                    }
                }
                streakGeom.attributes.position.needsUpdate = true;

                // Streamlines opacity shimmer
                streamlines.forEach(s => {
                    s.mesh.material.opacity = 0.25 + Math.sin(elapsed * 2.5 + s.phase) * 0.15;
                });

                // Overall flower aerodynamic tilt
                flowerGroup.rotation.z = Math.sin(elapsed * 2.0) * 0.04 - 0.06;
                flowerGroup.rotation.y = elapsed * 0.08;

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
