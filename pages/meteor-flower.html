<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteor Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Streaking through space...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Meteor Flower</h1>
            <p>Cosmic flower streaking through space with a luminous trail</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x030208,
                cameraPos: [0, 1.4, 3.8],
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.0,
                    maxDistance: 7.0,
                    autoRotate: true,
                    autoRotateSpeed: 0.35
                }
            });

            // Studio Environment & Lighting
            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');

            const ambientLight = new THREE.AmbientLight(0x1a0f2e, 1.2);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffecd2, 2.2);
            keyLight.position.set(4, 6, 3);
            scene.add(keyLight);

            const rimLight = new THREE.DirectionalLight(0xff5533, 2.8);
            rimLight.position.set(-4, 2, -3);
            scene.add(rimLight);

            const cosmicFill = new THREE.PointLight(0x7744ff, 2.5, 8);
            cosmicFill.position.set(0, 2, 2);
            scene.add(cosmicFill);

            // Luxury Cosmic Pedestal
            const pedestal = FlowerUtils.createPedestal({
                radius: 1.85,
                height: 0.16,
                y: -0.78,
                color: 0x090514,
                metalness: 0.95,
                roughness: 0.12,
                rimColor: 0xff6622
            });
            scene.add(pedestal);

            // Floating Atmosphere Sparks
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 140,
                color: 0xffaa55,
                size: 0.026,
                spread: 5.5,
                ySpread: 3.5
            });

            // Deep Space Starfield
            const starCount = 600;
            const starGeom = new THREE.BufferGeometry();
            const starPos = new Float32Array(starCount * 3);
            const starCols = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                starPos[i * 3] = (Math.random() - 0.5) * 30;
                starPos[i * 3 + 1] = (Math.random() - 0.5) * 20 + 2;
                starPos[i * 3 + 2] = (Math.random() - 0.5) * 30;
                const c = Math.random() > 0.4 ? 1 : 0.7;
                starCols[i * 3] = c;
                starCols[i * 3 + 1] = c * (0.7 + Math.random() * 0.3);
                starCols[i * 3 + 2] = 1.0;
            }
            starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            starGeom.setAttribute('color', new THREE.BufferAttribute(starCols, 3));
            const starMat = new THREE.PointsMaterial({
                size: 0.03,
                vertexColors: true,
                transparent: true,
                opacity: 0.85
            });
            const stars = new THREE.Points(starGeom, starMat);
            scene.add(stars);

            // Root Flower Group
            const flower = new THREE.Group();
            flower.position.y = 0.35;
            scene.add(flower);

            // Meteor Materials
            const outerPetalMat = new THREE.MeshPhysicalMaterial({
                color: 0x140d24,
                emissive: 0x4a1805,
                emissiveIntensity: 0.8,
                metalness: 0.85,
                roughness: 0.28,
                clearcoat: 0.9,
                clearcoatRoughness: 0.15,
                side: THREE.DoubleSide
            });

            const midPetalMat = new THREE.MeshPhysicalMaterial({
                color: 0x220c38,
                emissive: 0xcc4411,
                emissiveIntensity: 1.2,
                metalness: 0.7,
                roughness: 0.2,
                clearcoat: 1.0,
                side: THREE.DoubleSide
            });

            const innerPetalMat = new THREE.MeshPhysicalMaterial({
                color: 0xffe090,
                emissive: 0xff6600,
                emissiveIntensity: 1.8,
                metalness: 0.4,
                roughness: 0.1,
                clearcoat: 1.0,
                side: THREE.DoubleSide
            });

            // 3 Tiers of Double-Curved Aerodynamic Petals
            const tiers = [
                { count: 12, length: 1.15, width: 0.36, curl: 0.85, wave: 0.25, angle: 0.8, y: 0.0, mat: outerPetalMat },
                { count: 9,  length: 0.92, width: 0.32, curl: 0.65, wave: 0.2, angle: 0.55, y: 0.06, mat: midPetalMat },
                { count: 7,  length: 0.68, width: 0.26, curl: 0.45, wave: 0.15, angle: 0.35, y: 0.12, mat: innerPetalMat }
            ];

            const allPetals = [];
            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsL: 24,
                    segmentsW: 16
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.38);
                    const mesh = new THREE.Mesh(geom, tier.mat);
                    mesh.position.y = tier.y;
                    mesh.rotation.y = angle;
                    mesh.rotation.x = tier.angle;
                    mesh.userData = {
                        origRotX: tier.angle,
                        angle: angle,
                        tier: tIdx,
                        freq: 2.2 + tIdx * 0.6,
                        phase: angle * 2
                    };
                    flower.add(mesh);
                    allPetals.push(mesh);
                }
            });

            // Luminous Meteor Nucleus Core
            const core = FlowerUtils.createGlowingCore(flower, {
                radius: 0.22,
                color: 0xff6600,
                innerColor: 0xfff0aa,
                y: 0.18
            });

            // Chondrule Crystals Core
            const crystalGeom = FlowerUtils.createFacetedCrystalGeometry(0.06, 0.26);
            const crystalMat = new THREE.MeshPhysicalMaterial({
                color: 0xffd277,
                emissive: 0xff4400,
                emissiveIntensity: 1.5,
                metalness: 0.3,
                roughness: 0.05,
                transmission: 0.7,
                ior: 1.8
            });
            for (let i = 0; i < 9; i++) {
                const crystal = new THREE.Mesh(crystalGeom, crystalMat);
                const cAngle = (i / 9) * Math.PI * 2;
                crystal.position.set(Math.cos(cAngle) * 0.09, 0.2, Math.sin(cAngle) * 0.09);
                crystal.rotation.x = 0.25;
                crystal.rotation.y = cAngle;
                crystal.rotation.z = (Math.random() - 0.5) * 0.4;
                crystal.scale.setScalar(0.7 + Math.random() * 0.4);
                flower.add(crystal);
            }

            // Stamen Filaments
            FlowerUtils.createStamenCluster(flower, {
                count: 32,
                radius: 0.14,
                height: 0.32,
                spread: 0.35,
                stemColor: 0xaa3311,
                antherColor: 0xffd555,
                y: 0.15
            });

            // Aerodynamic Meteor Ion Trail
            const trailCount = 180;
            const trailGeom = new THREE.BufferGeometry();
            const trailPositions = new Float32Array(trailCount * 3);
            const trailColors = new Float32Array(trailCount * 3);
            const trailData = [];

            for (let i = 0; i < trailCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const rad = 0.15 + Math.random() * 0.4;
                const speed = 1.0 + Math.random() * 1.5;
                const length = 1.2 + Math.random() * 2.2;
                const yOff = Math.random() * 0.3;

                trailData.push({ theta, rad, speed, length, yOff, progress: Math.random() });

                trailPositions[i * 3] = Math.cos(theta) * rad;
                trailPositions[i * 3 + 1] = 0.2 - yOff;
                trailPositions[i * 3 + 2] = Math.sin(theta) * rad;

                trailColors[i * 3] = 1.0;
                trailColors[i * 3 + 1] = 0.4 + Math.random() * 0.5;
                trailColors[i * 3 + 2] = 0.1 + Math.random() * 0.3;
            }

            trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
            trailGeom.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));

            const trailMat = new THREE.PointsMaterial({
                size: 0.045,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });
            const trailPoints = new THREE.Points(trailGeom, trailMat);
            flower.add(trailPoints);

            // Charred Cosmic Stem & Root Calyx
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0.05, 0),
                new THREE.Vector3(0.04, -0.28, 0.02),
                new THREE.Vector3(-0.03, -0.55, -0.01),
                new THREE.Vector3(0, -0.78, 0)
            ]);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.032, 12, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x110a1a,
                emissive: 0x331105,
                emissiveIntensity: 0.5,
                metalness: 0.8,
                roughness: 0.35,
                clearcoat: 0.6
            });
            const stemMesh = new THREE.Mesh(stemGeom, stemMat);
            flower.add(stemMesh);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Gentle floating breath & cosmic oscillation
                flower.position.y = 0.35 + Math.sin(elapsed * 1.5) * 0.04;
                flower.rotation.z = Math.sin(elapsed * 0.8) * 0.05;
                flower.rotation.x = Math.cos(elapsed * 0.7) * 0.04;

                // Petal aerodynamic flutter
                for (let i = 0; i < allPetals.length; i++) {
                    const p = allPetals[i];
                    const flutter = Math.sin(elapsed * p.userData.freq + p.userData.phase) * 0.045;
                    p.rotation.x = p.userData.origRotX + flutter;
                }

                // Meteor Trail Particles Streaming
                const pos = trailGeom.attributes.position.array;
                for (let i = 0; i < trailCount; i++) {
                    const d = trailData[i];
                    d.progress = (d.progress + 0.012 * d.speed) % 1.0;
                    const spiral = d.theta + elapsed * 1.2;
                    const currentRad = d.rad * (1.0 + d.progress * 1.8);
                    
                    pos[i * 3] = Math.cos(spiral) * currentRad;
                    pos[i * 3 + 1] = 0.2 - (d.progress * d.length) - d.yOff;
                    pos[i * 3 + 2] = Math.sin(spiral) * currentRad;
                }
                trailGeom.attributes.position.needsUpdate = true;

                // Pulse core & lights
                core.pulse(elapsed, 1.4);
                cosmicFill.intensity = 2.0 + Math.sin(elapsed * 3.0) * 0.8;

                // Rotate starfield slowly
                stars.rotation.y = elapsed * 0.015;

                atmosphere.update();
                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
