<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Mythical Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Awakening celestial astral runes...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Mythical Flower</h1>
            <p>A legendary astral bloom forged in obsidian and royal starlight, ringed with revolving celestial astrolabe mandalas</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock, controls } = FlowerUtils.initScene(container, {
                background: 0x05040d,
                cameraPos: [0, 2.2, 5.2],
                enableOrbit: true,
                autoRotate: false
            });

            camera.lookAt(0, 0.4, 0);
            if (controls) {
                controls.target.set(0, 0.4, 0);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                controls.maxDistance = 10;
                controls.minDistance = 2;
                controls.maxPolarAngle = Math.PI / 2 + 0.15;
            }

            // Mystical Celestial Lighting
            const ambient = new THREE.AmbientLight(0x181028, 0.85);
            scene.add(ambient);

            const stellarKeyLight = new THREE.DirectionalLight(0xfff6ea, 1.4);
            stellarKeyLight.position.set(4, 8, 5);
            stellarKeyLight.castShadow = true;
            scene.add(stellarKeyLight);

            const astralFill = new THREE.DirectionalLight(0x818cf8, 0.9);
            astralFill.position.set(-5, 4, -4);
            scene.add(astralFill);

            // Core Supernova Light
            const coreStarLight = new THREE.PointLight(0xf59e0b, 2.5, 8);
            coreStarLight.position.set(0, 0.45, 0);
            scene.add(coreStarLight);

            const runeCyanLight = new THREE.PointLight(0x38bdf8, 1.8, 6);
            runeCyanLight.position.set(0, 1.0, 0);
            scene.add(runeCyanLight);

            // Obsidian Pedestal with Astrolabe Engravings
            const plinthGroup = new THREE.Group();
            const plinthGeom = new THREE.CylinderGeometry(2.3, 2.5, 0.25, 48);
            const plinthMat = new THREE.MeshStandardMaterial({
                color: 0x080612,
                roughness: 0.15,
                metalness: 0.9
            });
            const plinth = new THREE.Mesh(plinthGeom, plinthMat);
            plinth.position.y = -1.2;
            plinthGroup.add(plinth);

            // Inlaid Gold Astrological Ring
            const rimGeom = new THREE.TorusGeometry(2.3, 0.025, 16, 64);
            const goldMat = new THREE.MeshStandardMaterial({
                color: 0xf59e0b,
                metalness: 0.95,
                roughness: 0.2
            });
            const rimMesh = new THREE.Mesh(rimGeom, goldMat);
            rimMesh.rotation.x = Math.PI / 2;
            rimMesh.position.y = -1.07;
            plinthGroup.add(rimMesh);

            // Inner Astrolabe Inlay
            const innerRimGeom = new THREE.TorusGeometry(1.5, 0.015, 16, 48);
            const cyanMat = new THREE.MeshStandardMaterial({
                color: 0x38bdf8,
                emissive: 0x0284c7,
                emissiveIntensity: 0.5,
                metalness: 0.9,
                roughness: 0.2
            });
            const innerRimMesh = new THREE.Mesh(innerRimGeom, cyanMat);
            innerRimMesh.rotation.x = Math.PI / 2;
            innerRimMesh.position.y = -1.07;
            plinthGroup.add(innerRimMesh);

            scene.add(plinthGroup);

            // Flower Main Group (Floating)
            const flowerRoot = new THREE.Group();
            flowerRoot.position.set(0, 0.1, 0);
            scene.add(flowerRoot);

            // Royal Celestial Amethyst & Gold Trim Materials
            const outerMat = new THREE.MeshPhysicalMaterial({
                color: 0x1f1035,
                emissive: 0x0c051a,
                roughness: 0.35,
                metalness: 0.3,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                sheen: new THREE.Color(0xa855f7),
                side: THREE.DoubleSide
            });

            const innerMat = new THREE.MeshPhysicalMaterial({
                color: 0x3b1259,
                emissive: 0x18052b,
                roughness: 0.25,
                metalness: 0.35,
                clearcoat: 1.0,
                sheen: new THREE.Color(0xf472b6),
                side: THREE.DoubleSide
            });

            const coreMat = new THREE.MeshPhysicalMaterial({
                color: 0x581c87,
                emissive: 0x2e0854,
                roughness: 0.2,
                metalness: 0.4,
                clearcoat: 1.0,
                side: THREE.DoubleSide
            });

            // Sculpted Wing-like Petals
            const tiers = [
                { count: 12, width: 0.52, length: 1.45, rotX: 0.78, y: 0.36, mat: outerMat },
                { count: 10, width: 0.44, length: 1.20, rotX: 0.58, y: 0.38, mat: outerMat },
                { count: 8,  width: 0.36, length: 0.95, rotX: 0.42, y: 0.40, mat: innerMat },
                { count: 6,  width: 0.28, length: 0.70, rotX: 0.26, y: 0.42, mat: coreMat }
            ];

            const petalMeshes = [];

            tiers.forEach((tData, tIdx) => {
                const tGroup = new THREE.Group();
                tGroup.position.y = tData.y;

                const geom = FlowerUtils.createCurvedPetalGeometry(tData.width, tData.length, {
                    curl: 0.28,
                    cup: 0.22,
                    flare: 0.18
                });

                for (let i = 0; i < tData.count; i++) {
                    const angle = (i / tData.count) * Math.PI * 2 + (tIdx * 0.3);
                    const pivot = new THREE.Group();
                    pivot.rotation.y = angle;

                    const mesh = new THREE.Mesh(geom, tData.mat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    mesh.rotation.x = tData.rotX;

                    // Glowing Golden Rune on Petal Center Spine
                    const runeMesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.04, tData.length * 0.4),
                        new THREE.MeshBasicMaterial({
                            color: (i % 2 === 0) ? 0xf59e0b : 0x38bdf8,
                            transparent: true,
                            opacity: 0.85,
                            side: THREE.DoubleSide
                        })
                    );
                    runeMesh.position.set(0, tData.length * 0.45, 0.03);
                    mesh.add(runeMesh);

                    pivot.add(mesh);
                    tGroup.add(pivot);

                    petalMeshes.push({
                        mesh: mesh,
                        baseRotX: tData.rotX,
                        phase: i * 0.3 + tIdx * 0.5
                    });
                }
                flowerRoot.add(tGroup);
            });

            // Floating Celestial Astrolabe Rings (Revolving in space around flower)
            const astrolabeGroup = new THREE.Group();
            astrolabeGroup.position.y = 0.5;

            const ring1Geom = new THREE.TorusGeometry(1.65, 0.015, 12, 64);
            const ring1 = new THREE.Mesh(ring1Geom, goldMat);
            ring1.rotation.x = 0.4;
            astrolabeGroup.add(ring1);

            const ring2Geom = new THREE.TorusGeometry(1.35, 0.012, 12, 64);
            const ring2 = new THREE.Mesh(ring2Geom, cyanMat);
            ring2.rotation.y = 0.6;
            ring2.rotation.x = -0.3;
            astrolabeGroup.add(ring2);

            // Orbiting Glyphs on Rings
            for (let i = 0; i < 6; i++) {
                const a = (i / 6) * Math.PI * 2;
                const glyph = new THREE.Mesh(
                    new THREE.OctahedronGeometry(0.045, 0),
                    goldMat
                );
                glyph.position.set(Math.cos(a) * 1.65, Math.sin(a) * 0.4, Math.sin(a) * 1.65);
                astrolabeGroup.add(glyph);
            }

            flowerRoot.add(astrolabeGroup);

            // Central Astral Supernova / Star Core
            const coreGroup = new THREE.Group();
            coreGroup.position.y = 0.45;

            const starGeom = new THREE.OctahedronGeometry(0.20, 2);
            const starMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                emissive: 0xf59e0b,
                emissiveIntensity: 1.2,
                roughness: 0.1,
                metalness: 0.2,
                transmission: 0.8,
                ior: 2.2,
                clearcoat: 1.0
            });
            const starMesh = new THREE.Mesh(starGeom, starMat);
            coreGroup.add(starMesh);

            // Golden Starlight Rays / Anthers
            const rayCount = 24;
            for (let i = 0; i < rayCount; i++) {
                const angle = (i / rayCount) * Math.PI * 2;
                const r = 0.08 + (i % 3) * 0.04;
                const h = 0.22;

                const ray = new THREE.Mesh(
                    new THREE.ConeGeometry(0.01, h, 6),
                    goldMat
                );
                ray.position.set(Math.cos(angle) * r, h * 0.5, Math.sin(angle) * r);
                ray.rotation.x = (Math.random() - 0.5) * 0.3;
                ray.rotation.z = (Math.random() - 0.5) * 0.3;
                coreGroup.add(ray);
            }

            flowerRoot.add(coreGroup);

            // Ornate Astral Obsidian Stem
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0.38, 0),
                new THREE.Vector3(0.03, -0.2, 0.02),
                new THREE.Vector3(-0.02, -0.7, -0.01),
                new THREE.Vector3(0, -1.2, 0)
            ]);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.045, 12, false);
            const stemMat = new THREE.MeshStandardMaterial({
                color: 0x120a1f,
                roughness: 0.4,
                metalness: 0.6
            });
            const stemMesh = new THREE.Mesh(stemGeom, stemMat);
            flowerRoot.add(stemMesh);

            // Celestial Stardust Nebula Particles
            const particleCount = 180;
            const pGeom = new THREE.BufferGeometry();
            const pPos = new Float32Array(particleCount * 3);
            const pColors = new Float32Array(particleCount * 3);
            const pData = [];

            for (let i = 0; i < particleCount; i++) {
                const r = 0.8 + Math.random() * 2.2;
                const theta = Math.random() * Math.PI * 2;
                const y = -0.4 + Math.random() * 2.6;

                pPos[i * 3] = r * Math.cos(theta);
                pPos[i * 3 + 1] = y;
                pPos[i * 3 + 2] = r * Math.sin(theta);

                pData.push({
                    speed: 0.003 + Math.random() * 0.007,
                    radius: r,
                    theta: theta,
                    yBase: y
                });

                const isGold = Math.random() > 0.4;
                const c = isGold ? new THREE.Color(0xf59e0b) : new THREE.Color(0x38bdf8);
                pColors[i * 3] = c.r;
                pColors[i * 3 + 1] = c.g;
                pColors[i * 3 + 2] = c.b;
            }

            pGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            pGeom.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

            const pMat = new THREE.PointsMaterial({
                size: 0.045,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });
            const particles = new THREE.Points(pGeom, pMat);
            scene.add(particles);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Petal breathing wave
                petalMeshes.forEach(pm => {
                    const wave = Math.sin(elapsed * 1.6 + pm.phase) * 0.04;
                    pm.mesh.rotation.x = pm.baseRotX + wave;
                });

                // Astrolabe sacred rings counter-rotation
                ring1.rotation.z = elapsed * 0.15;
                ring2.rotation.z = -elapsed * 0.22;
                astrolabeGroup.rotation.y = elapsed * 0.08;

                // Supernova core spin & scintillation
                starMesh.rotation.y = elapsed * 0.9;
                starMesh.rotation.x = Math.sin(elapsed * 0.7) * 0.3;
                const pulse = 1.0 + Math.sin(elapsed * 3.0) * 0.08;
                coreGroup.scale.set(pulse, pulse, pulse);
                coreStarLight.intensity = 2.4 + Math.sin(elapsed * 3.0) * 0.6;

                // Flower root floating levitation
                flowerRoot.position.y = 0.1 + Math.sin(elapsed * 1.2) * 0.04;
                flowerRoot.rotation.y = Math.sin(elapsed * 0.3) * 0.06;

                // Cosmic stardust vortex
                const posArr = pGeom.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    const p = pData[i];
                    p.theta += p.speed;
                    posArr[i * 3] = Math.cos(p.theta) * p.radius;
                    posArr[i * 3 + 1] = p.yBase + Math.sin(elapsed * 1.4 + i) * 0.12;
                    posArr[i * 3 + 2] = Math.sin(p.theta) * p.radius;
                }
                pGeom.attributes.position.needsUpdate = true;

                if (controls) controls.update();
                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
