<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Aligning magnetic flux dipoles...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Magnetic Flower</h1>
            <p>Neodymium ferrofluid petals aligned to invisible magnetic field loops with streaming flux dipole particles</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x070810,
                antialias: true
            });

            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.45,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x131a30, 0.7);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xe0e7ff, 2.2);
            sunLight.position.set(5, 8, 4);
            scene.add(sunLight);

            const cobaltRim = new THREE.DirectionalLight(0x6366f1, 1.8);
            cobaltRim.position.set(-4, -2, -3);
            scene.add(cobaltRim);

            // Obsidian Pedestal with Magnetic Induction Ring
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x0b0f19,
                rimColor: 0x6366f1,
                marble: true
            });

            // Atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 110,
                color: 0x818cf8,
                size: 0.035,
                spread: 6.5,
                driftSpeed: 0.2
            });

            // Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Ferrofluid Petal Material
            const ferroMat = new THREE.MeshPhysicalMaterial({
                color: 0x1e1e2d,
                metalness: 0.95,
                roughness: 0.15,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                side: THREE.DoubleSide
            });

            // Stem
            const stemPoints = [
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.04, -0.1, 0.02),
                new THREE.Vector3(-0.03, -0.6, -0.02),
                new THREE.Vector3(0.01, -1.25, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.038, 12, false);
            const stemMat = new THREE.MeshStandardMaterial({
                color: 0x272738,
                metalness: 0.9,
                roughness: 0.25
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            flowerGroup.add(stem);

            // Petals
            const tiers = [
                { count: 10, length: 1.25, width: 0.46, curl: 0.65, wave: 0.22, y: 0.38, rotX: 0.95 },
                { count: 8,  length: 1.05, width: 0.40, curl: 0.55, wave: 0.18, y: 0.42, rotX: 0.72 },
                { count: 6,  length: 0.85, width: 0.34, curl: 0.45, wave: 0.15, y: 0.46, rotX: 0.50 }
            ];

            const petalMeshes = [];

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsW: 14,
                    segmentsL: 24
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);
                    const pivot = new THREE.Group();
                    pivot.position.set(0, tier.y, 0);
                    pivot.rotation.y = angle;

                    const mesh = new THREE.Mesh(geom, ferroMat);
                    mesh.rotation.x = tier.rotX;

                    // Luminous magnetic flux vein along petal spine
                    const veinGeom = new THREE.CylinderGeometry(0.008, 0.008, tier.length * 0.8, 6);
                    veinGeom.translate(0, tier.length * 0.45, 0.015);
                    const veinMat = new THREE.MeshBasicMaterial({ color: 0x6366f1 });
                    const vein = new THREE.Mesh(veinGeom, veinMat);
                    mesh.add(vein);

                    pivot.add(mesh);
                    flowerGroup.add(pivot);

                    petalMeshes.push({
                        mesh,
                        pivot,
                        tier: tIdx,
                        baseRotX: tier.rotX,
                        phase: i * 0.5 + tIdx * 1.2
                    });
                }
            });

            // 3D Toroidal Magnetic Flux Loops
            const fluxLoops = [];
            const loopCount = 8;
            const fluxMat = new THREE.LineBasicMaterial({
                color: 0x818cf8,
                transparent: true,
                opacity: 0.4
            });

            for (let i = 0; i < loopCount; i++) {
                const angle = (i / loopCount) * Math.PI * 2;
                const points = [];
                for (let a = 0; a <= 40; a++) {
                    const t = (a / 40) * Math.PI * 2;
                    const r = 1.35 * Math.sin(t * 0.5);
                    const y = 0.5 + Math.cos(t) * 0.9;
                    const x = Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;
                    points.push(new THREE.Vector3(x, y, z));
                }
                const loopGeom = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(loopGeom, fluxMat);
                flowerGroup.add(line);
                fluxLoops.push(line);
            }

            // Magnetic Dipole Streaming Particles
            const particleCount = 80;
            const pGeom = new THREE.BufferGeometry();
            const pPositions = new Float32Array(particleCount * 3);
            const pData = [];

            for (let i = 0; i < particleCount; i++) {
                pData.push({
                    loopIndex: i % loopCount,
                    t: Math.random() * Math.PI * 2,
                    speed: 0.8 + Math.random() * 0.6
                });
            }
            pGeom.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
            const pMat = new THREE.PointsMaterial({
                color: 0xc7d2fe,
                size: 0.05,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });
            const fluxParticles = new THREE.Points(pGeom, pMat);
            flowerGroup.add(fluxParticles);

            // Stamen Cluster & Magnetic Monopole Core
            const stamenCluster = FlowerUtils.createStamenCluster({
                count: 32,
                height: 0.32,
                spread: 0.14,
                antherColor: 0x818cf8,
                filamentColor: 0x475569
            });
            stamenCluster.position.y = 0.48;
            flowerGroup.add(stamenCluster);

            const core = FlowerUtils.createGlowingCore({
                radius: 0.14,
                color: 0x4f46e5,
                glowColor: 0x6366f1,
                emissiveIntensity: 2.2
            });
            core.position.y = 0.52;
            flowerGroup.add(core);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Petal magnetic attraction oscillation
                petalMeshes.forEach(p => {
                    const fluxWave = Math.sin(elapsed * 2.2 + p.phase) * 0.03;
                    p.mesh.rotation.x = p.baseRotX + fluxWave;
                });

                // Update particles along magnetic loops
                const posArr = pGeom.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    const d = pData[i];
                    d.t = (d.t + 0.015 * d.speed) % (Math.PI * 2);
                    const angle = (d.loopIndex / loopCount) * Math.PI * 2;
                    const r = 1.35 * Math.sin(d.t * 0.5);
                    const y = 0.5 + Math.cos(d.t) * 0.9;
                    const x = Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;

                    posArr[i * 3] = x;
                    posArr[i * 3 + 1] = y;
                    posArr[i * 3 + 2] = z;
                }
                pGeom.attributes.position.needsUpdate = true;

                flowerGroup.position.y = Math.sin(elapsed * 0.8) * 0.02;
                flowerGroup.rotation.y = elapsed * 0.1;

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
