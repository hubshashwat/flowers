<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyberpunk Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Booting system...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Neon Cyberpunk Flower</h1>
            <p>Holographic petals with glitch effects and data streams</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock, controls } = FlowerUtils.initScene(container, {
                background: 0x05010a,
                environmentTheme: 'cyberpunk',
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.2,
                    maxDistance: 6.5,
                    autoRotate: true,
                    autoRotateSpeed: 0.4
                }
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.45, 0);

            // Cyberpunk studio lighting
            const ambient = new THREE.AmbientLight(0x220533, 0.5);
            scene.add(ambient);

            const pinkLight = new THREE.PointLight(0xff007f, 2.5, 8);
            pinkLight.position.set(-3, 3, 2.5);
            scene.add(pinkLight);

            const cyanLight = new THREE.PointLight(0x00f0ff, 2.5, 8);
            cyanLight.position.set(3, 2, -2.5);
            scene.add(cyanLight);

            const rimLight = new THREE.DirectionalLight(0xe056fd, 1.4);
            rimLight.position.set(0, 4, -3);
            scene.add(rimLight);

            // Dark cyber pedestal with neon accent
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.7,
                color: 0x0a0512,
                roughness: 0.12,
                metalness: 0.85,
                y: -0.8
            });

            // Glowing neon circuit ring on pedestal
            const ringGeom = new THREE.RingGeometry(1.3, 1.34, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0x00f0ff,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.7
            });
            const ring = new THREE.Mesh(ringGeom, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = -0.79;
            scene.add(ring);

            // Cyber data motes atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 100,
                color: 0x00f0ff,
                spread: 4.5,
                size: 0.028
            });

            // Flower group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Materials
            const cyberDarkMat = new THREE.MeshStandardMaterial({
                color: 0x130a20,
                roughness: 0.25,
                metalness: 0.8,
                side: THREE.DoubleSide
            });

            function createNeonEdgeMat(color = 0xff007f) {
                return new THREE.MeshPhysicalMaterial({
                    color: 0x090312,
                    emissive: new THREE.Color(color),
                    emissiveIntensity: 1.8,
                    roughness: 0.15,
                    metalness: 0.9,
                    side: THREE.DoubleSide
                });
            }

            const petals = [];

            // Outer layer: Grand cyber wings with neon glowing edge curves
            const outerCount = 8;
            for (let i = 0; i < outerCount; i++) {
                const group = new THREE.Group();
                const geom = FlowerUtils.createCurvedPetalGeometry(0.55, 1.2, {
                    curl: 0.26,
                    cup: 0.22,
                    flare: 0.28,
                    ruffle: 0.03,
                    uSegments: 24,
                    vSegments: 32
                });
                const isCyan = i % 2 === 0;
                const petal = new THREE.Mesh(geom, cyberDarkMat);
                group.add(petal);

                // Neon trim edge
                const edgeMat = createNeonEdgeMat(isCyan ? 0x00f0ff : 0xff007f);
                const edgeMesh = new THREE.Mesh(geom, edgeMat);
                edgeMesh.scale.set(1.02, 1.02, 1.02);
                edgeMesh.position.z = -0.005;
                group.add(edgeMesh);

                const angle = (i / outerCount) * Math.PI * 2;
                group.rotation.z = angle;
                group.rotation.x = -Math.PI / 2 + 0.52;
                group.position.y = 0.44;
                group.userData = { phase: i * 0.4, baseRotX: group.rotation.x, edgeMat };
                flowerGroup.add(group);
                petals.push(group);
            }

            // Middle layer: Inner neon petals
            const midCount = 8;
            for (let i = 0; i < midCount; i++) {
                const group = new THREE.Group();
                const geom = FlowerUtils.createCurvedPetalGeometry(0.4, 0.9, {
                    curl: 0.35,
                    cup: 0.26,
                    flare: 0.16,
                    ruffle: 0.02,
                    uSegments: 20,
                    vSegments: 28
                });
                const isCyan = i % 2 !== 0;
                const petal = new THREE.Mesh(geom, cyberDarkMat);
                group.add(petal);

                const edgeMat = createNeonEdgeMat(isCyan ? 0x00f0ff : 0xff007f);
                const edgeMesh = new THREE.Mesh(geom, edgeMat);
                edgeMesh.scale.set(1.02, 1.02, 1.02);
                group.add(edgeMesh);

                const angle = (i / midCount) * Math.PI * 2 + Math.PI / outerCount;
                group.rotation.z = angle;
                group.rotation.x = -Math.PI / 2 + 0.32;
                group.position.y = 0.47;
                group.userData = { phase: i * 0.5 + 2, baseRotX: group.rotation.x, edgeMat };
                flowerGroup.add(group);
                petals.push(group);
            }

            // Glowing Plasma Core
            const cyberCore = FlowerUtils.createGlowingCore({
                radius: 0.14,
                innerColor: 0xffffff,
                glowColor: 0x00f0ff,
                emissiveIntensity: 2.4
            });
            cyberCore.group.position.y = 0.52;
            flowerGroup.add(cyberCore.group);

            // Metallic dark conduit stem
            const stemPoints = [
                new THREE.Vector3(0, 0.44, 0),
                new THREE.Vector3(0.02, 0.2, 0.01),
                new THREE.Vector3(-0.015, -0.1, -0.01),
                new THREE.Vector3(0.01, -0.45, 0.005),
                new THREE.Vector3(0, -0.78, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.035, 16, false);
            const stem = new THREE.Mesh(stemGeom, cyberDarkMat);
            flowerGroup.add(stem);

            // Neon conduit rings running down the stem
            [-0.05, -0.22, -0.45].forEach((y, i) => {
                const ringC = new THREE.Mesh(
                    new THREE.TorusGeometry(0.045, 0.008, 12, 24),
                    new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xff007f : 0x00f0ff })
                );
                ringC.position.y = y;
                ringC.rotation.x = Math.PI / 2;
                flowerGroup.add(ringC);
            });

            function animate() {
                requestAnimationFrame(animate);
                const delta = clock.getDelta();
                const elapsed = clock.getElapsedTime();

                // Gentle cyber breathing
                const pulse = Math.sin(elapsed * 3) * 0.5 + 0.5;
                petals.forEach(p => {
                    const breathe = Math.sin(elapsed * 0.8 + p.userData.phase) * 0.02;
                    p.rotation.x = p.userData.baseRotX + breathe;
                    p.userData.edgeMat.emissiveIntensity = 1.6 + pulse * 0.8;
                });

                // Core pulse & atmosphere
                cyberCore.update(elapsed);
                atmosphere.update(elapsed, delta);
                if (controls) controls.update(delta);

                renderer.render(scene, camera);
            }

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
