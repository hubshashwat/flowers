<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn Fabric Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Weaving frayed silk filaments...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Torn Fabric Flower</h1>
            <p>Raw mulberry silk and chiffon petals with frayed organic thread fringes undulating with cloth flutter dynamics</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x0f0b0e,
                antialias: true
            });

            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.45,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x281822, 0.7);
            scene.add(ambient);

            const keyLight = new THREE.DirectionalLight(0xfff0f5, 2.2);
            keyLight.position.set(5, 8, 4);
            scene.add(keyLight);

            const silkRim = new THREE.DirectionalLight(0xf472b6, 1.8);
            silkRim.position.set(-4, -2, -3);
            scene.add(silkRim);

            // Tailor's Pedestal with Spun Gold Rim
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x140c12,
                rimColor: 0xf472b6,
                marble: true
            });

            // Silk dust motes
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 110,
                color: 0xfbcfe8,
                size: 0.035,
                spread: 6.5,
                driftSpeed: 0.2
            });

            // Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Mulberry Raw Silk Physical Material
            const silkMat = new THREE.MeshPhysicalMaterial({
                color: 0xf472b6,
                roughness: 0.65,
                metalness: 0.05,
                transmission: 0.35,
                thickness: 0.5,
                clearcoat: 0.4,
                side: THREE.DoubleSide
            });

            // Stem
            const stemPoints = [
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.04, -0.1, 0.02),
                new THREE.Vector3(-0.03, -0.6, -0.02),
                new THREE.Vector3(0.01, -1.25, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.038, 12, false);
            const stemMat = new THREE.MeshStandardMaterial({
                color: 0x3d6645,
                roughness: 0.75
            });
            const stem = new THREE.Mesh(stemGeom, stemMat);
            flowerGroup.add(stem);

            // Petals
            const tiers = [
                { count: 9, length: 1.25, width: 0.52, curl: 0.65, wave: 0.32, y: 0.38, rotX: 0.95 },
                { count: 8, length: 1.05, width: 0.45, curl: 0.55, wave: 0.26, y: 0.42, rotX: 0.72 },
                { count: 6, length: 0.85, width: 0.38, curl: 0.45, wave: 0.22, y: 0.46, rotX: 0.48 }
            ];

            const petalMeshes = [];
            const frayedThreads = [];

            const threadMat = new THREE.LineBasicMaterial({
                color: 0xfce7f3,
                transparent: true,
                opacity: 0.65
            });

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsW: 14,
                    segmentsL: 24
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);
                    const pivot = new THREE.Group();
                    pivot.position.set(0, tier.y, 0);
                    pivot.rotation.y = angle;

                    const mesh = new THREE.Mesh(geom, silkMat);
                    mesh.rotation.x = tier.rotX;

                    // Frayed silk threads extending from petal edge
                    for (let th = 0; th < 3; th++) {
                        const thPoints = [];
                        const startY = tier.length * (0.6 + th * 0.15);
                        const startX = (th % 2 === 0 ? 1 : -1) * tier.width * 0.45;
                        for (let p = 0; p <= 6; p++) {
                            thPoints.push(new THREE.Vector3(
                                startX + (p * 0.03 * (th % 2 === 0 ? 1 : -1)),
                                startY + p * 0.02,
                                0.01 + p * 0.015
                            ));
                        }
                        const thGeom = new THREE.BufferGeometry().setFromPoints(thPoints);
                        const thLine = new THREE.Line(thGeom, threadMat);
                        mesh.add(thLine);
                        frayedThreads.push({ line: thLine, phase: i + th * 2 });
                    }

                    pivot.add(mesh);
                    flowerGroup.add(pivot);

                    petalMeshes.push({
                        mesh,
                        pivot,
                        tier: tIdx,
                        baseRotX: tier.rotX,
                        phase: i * 0.5 + tIdx * 1.2
                    });
                }
            });

            // Center Stamen Cluster
            const stamenCluster = FlowerUtils.createStamenCluster({
                count: 32,
                height: 0.32,
                spread: 0.14,
                antherColor: 0xfbbf24,
                filamentColor: 0xfef08a
            });
            stamenCluster.position.y = 0.48;
            flowerGroup.add(stamenCluster);

            // Core
            const core = FlowerUtils.createGlowingCore({
                radius: 0.13,
                color: 0xf472b6,
                glowColor: 0xdb2777,
                emissiveIntensity: 1.8
            });
            core.position.y = 0.52;
            flowerGroup.add(core);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Realistic silk cloth flutter
                petalMeshes.forEach(p => {
                    const clothFlutter = Math.sin(elapsed * 2.2 + p.phase) * 0.035 +
                                         Math.sin(elapsed * 4.5 + p.phase) * 0.015;
                    p.mesh.rotation.x = p.baseRotX + clothFlutter;
                    p.mesh.rotation.z = Math.cos(elapsed * 1.8 + p.phase) * 0.02;
                });

                flowerGroup.position.y = Math.sin(elapsed * 0.8) * 0.02;
                flowerGroup.rotation.y = elapsed * 0.1;

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
