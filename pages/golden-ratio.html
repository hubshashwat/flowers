<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Ratio Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Calculating spirals...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Golden Ratio Flower</h1>
            <p>Petals arranged using Fibonacci spiral and the golden angle (137.5°)</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x07050a,
                cameraPos: [0, 1.4, 3.8],
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.0,
                    maxDistance: 7.0,
                    autoRotate: true,
                    autoRotateSpeed: 0.35
                }
            });

            // Studio Environment & Lighting
            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');

            const ambientLight = new THREE.AmbientLight(0x20150a, 1.2);
            scene.add(ambientLight);

            const goldKeyLight = new THREE.DirectionalLight(0xffecd2, 2.5);
            goldKeyLight.position.set(4, 6, 3);
            scene.add(goldKeyLight);

            const warmRimLight = new THREE.DirectionalLight(0xffa500, 2.2);
            warmRimLight.position.set(-4, 2, -3);
            scene.add(warmRimLight);

            const coreGoldLight = new THREE.PointLight(0xffd700, 3.2, 6);
            coreGoldLight.position.set(0, 0.6, 0);
            scene.add(coreGoldLight);

            // Luxury Polished Black Gold Pedestal
            const pedestal = FlowerUtils.createPedestal({
                radius: 1.85,
                height: 0.16,
                y: -0.78,
                color: 0x0c0906,
                metalness: 0.95,
                roughness: 0.1,
                rimColor: 0xffd700
            });
            scene.add(pedestal);

            // Golden Stardust Atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 140,
                color: 0xffd700,
                size: 0.026,
                spread: 5.0,
                ySpread: 3.5
            });

            // Flower Group
            const flower = new THREE.Group();
            flower.position.y = 0.35;
            scene.add(flower);

            // Golden Angle: 137.507764 degrees in radians
            const GOLDEN_ANGLE = 2.39996323;

            // 21 Fibonacci Outer Petals (in 2 tiers: 13 outer, 8 inner)
            const outerMat = new THREE.MeshPhysicalMaterial({
                color: 0x1f1206,
                emissive: 0x804a00,
                emissiveIntensity: 0.7,
                metalness: 0.85,
                roughness: 0.22,
                clearcoat: 0.95,
                clearcoatRoughness: 0.15,
                side: THREE.DoubleSide
            });

            const midMat = new THREE.MeshPhysicalMaterial({
                color: 0xd4af37, // Metallic Gold
                emissive: 0xaa7000,
                emissiveIntensity: 0.8,
                metalness: 0.92,
                roughness: 0.15,
                clearcoat: 1.0,
                side: THREE.DoubleSide
            });

            const petalTiers = [
                { count: 13, length: 1.15, width: 0.38, curl: 0.8, wave: 0.25, angle: 0.8, y: 0.0, mat: outerMat },
                { count: 8,  length: 0.9,  width: 0.32, curl: 0.6, wave: 0.2,  angle: 0.55, y: 0.06, mat: midMat }
            ];

            const allPetals = [];

            petalTiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsL: 24,
                    segmentsW: 16
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = i * GOLDEN_ANGLE + (tIdx * 0.4);
                    const mesh = new THREE.Mesh(geom, tier.mat);
                    mesh.position.y = tier.y;
                    mesh.rotation.y = angle;
                    mesh.rotation.x = tier.angle;
                    mesh.userData = {
                        origRotX: tier.angle,
                        angle,
                        freq: 1.8 + tIdx * 0.5
                    };
                    flower.add(mesh);
                    allPetals.push(mesh);
                }
            });

            // Center Florets: 220 Spherical Golden Nodes arranged by Vogel's Phyllotaxis Model
            const floretCount = 220;
            const floretSphereGeom = new THREE.SphereGeometry(0.024, 16, 16);
            const floretMat = new THREE.MeshPhysicalMaterial({
                color: 0xffd700,
                emissive: 0xcc8800,
                emissiveIntensity: 0.9,
                metalness: 0.95,
                roughness: 0.12,
                clearcoat: 1.0
            });

            const floretsInstanced = new THREE.InstancedMesh(floretSphereGeom, floretMat, floretCount);
            const dummy = new THREE.Object3D();

            for (let i = 0; i < floretCount; i++) {
                const theta = i * GOLDEN_ANGLE;
                const r = 0.042 * Math.sqrt(i);
                const y = 0.18 + Math.cos(r * 3.5) * 0.035;

                dummy.position.set(Math.cos(theta) * r, y, Math.sin(theta) * r);
                const s = 0.7 + (i / floretCount) * 0.55;
                dummy.scale.set(s, s, s);
                dummy.updateMatrix();
                floretsInstanced.setMatrixAt(i, dummy.matrix);
            }
            floretsInstanced.instanceMatrix.needsUpdate = true;
            flower.add(floretsInstanced);

            // Sacred 3D Golden Logarithmic Spiral Tube
            const spiralPoints = [];
            for (let t = 0; t < 12; t += 0.08) {
                const angle = t * 2.2;
                const r = 0.06 * Math.exp(0.18 * t);
                const y = 0.18 + t * 0.012;
                spiralPoints.push(new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r));
            }
            const spiralCurve = new THREE.CatmullRomCurve3(spiralPoints);
            const spiralGeom = new THREE.TubeGeometry(spiralCurve, 120, 0.007, 8, false);
            const spiralMat = new THREE.MeshBasicMaterial({
                color: 0xffe066,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });
            const spiralMesh = new THREE.Mesh(spiralGeom, spiralMat);
            flower.add(spiralMesh);

            // Radiant Core
            const core = FlowerUtils.createGlowingCore(flower, {
                radius: 0.22,
                color: 0xffaa00,
                innerColor: 0xffffff,
                y: 0.18
            });

            // Golden Stem
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0.05, 0),
                new THREE.Vector3(0.03, -0.28, 0.02),
                new THREE.Vector3(-0.02, -0.55, -0.01),
                new THREE.Vector3(0, -0.78, 0)
            ]);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.032, 12, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x1f180a,
                emissive: 0x3d2806,
                emissiveIntensity: 0.5,
                metalness: 0.85,
                roughness: 0.25,
                clearcoat: 0.8
            });
            const stemMesh = new THREE.Mesh(stemGeom, stemMat);
            flower.add(stemMesh);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Gentle floating breath
                flower.position.y = 0.35 + Math.sin(elapsed * 1.5) * 0.035;

                // Petal breathing
                for (let i = 0; i < allPetals.length; i++) {
                    const p = allPetals[i];
                    const wave = Math.sin(elapsed * p.userData.freq + p.userData.angle) * 0.03;
                    p.rotation.x = p.userData.origRotX + wave;
                }

                // Logarithmic spiral pulse and rotation
                spiralMesh.rotation.y = elapsed * 0.4;
                spiralMat.opacity = 0.6 + Math.sin(elapsed * 2.5) * 0.25;

                core.pulse(elapsed, 1.8);
                coreGoldLight.intensity = 3.0 + Math.sin(elapsed * 4.0) * 1.0;

                atmosphere.update();
                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
