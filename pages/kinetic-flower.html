<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Engaging kinetic linkages...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Kinetic Flower</h1>
            <p>Counter-rotating concentric tiers of polished brass and copper petal fins undulating in reciprocal geometric harmony</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x0c0906,
                antialias: true
            });

            FlowerUtils.createStudioEnvironment(renderer, 'warm_sunset');
            const controls = FlowerUtils.setupOrbitControls(camera, renderer.domElement, {
                autoRotateSpeed: 0.45,
                minDistance: 2.2,
                maxDistance: 8.5
            });

            camera.position.set(0, 1.4, 3.6);
            camera.lookAt(0, 0.35, 0);

            // Lighting
            const ambient = new THREE.AmbientLight(0x28190e, 0.7);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xffedd5, 2.2);
            sunLight.position.set(5, 8, 4);
            scene.add(sunLight);

            const copperRim = new THREE.DirectionalLight(0xf97316, 1.8);
            copperRim.position.set(-4, -2, -3);
            scene.add(copperRim);

            // Luxury Pedestal
            const pedestal = FlowerUtils.createPedestal(scene, {
                radius: 1.8,
                height: 0.16,
                y: -1.3,
                baseColor: 0x140e0a,
                rimColor: 0xf97316,
                marble: true
            });

            // Atmosphere
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 110,
                color: 0xfdba74,
                size: 0.035,
                spread: 6.5,
                driftSpeed: 0.2
            });

            // Flower Group
            const flowerGroup = new THREE.Group();
            scene.add(flowerGroup);

            // Materials
            const brassMat = new THREE.MeshPhysicalMaterial({
                color: 0xd4af37,
                metalness: 0.92,
                roughness: 0.2,
                clearcoat: 0.8,
                side: THREE.DoubleSide
            });

            const copperMat = new THREE.MeshPhysicalMaterial({
                color: 0xdd6b3b,
                metalness: 0.95,
                roughness: 0.22,
                clearcoat: 0.8,
                side: THREE.DoubleSide
            });

            const darkSteelMat = new THREE.MeshStandardMaterial({
                color: 0x1f2937,
                metalness: 0.9,
                roughness: 0.3
            });

            // Articulated Stem with Mechanical Universal Joints
            const stemPoints = [
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.04, -0.1, 0.02),
                new THREE.Vector3(-0.03, -0.6, -0.02),
                new THREE.Vector3(0.01, -1.25, 0)
            ];
            const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.038, 12, false);
            const stem = new THREE.Mesh(stemGeom, darkSteelMat);
            flowerGroup.add(stem);

            // Central Kinetic Hub
            const hubGeom = new THREE.CylinderGeometry(0.24, 0.2, 0.22, 24);
            const hub = new THREE.Mesh(hubGeom, brassMat);
            hub.position.y = 0.38;
            flowerGroup.add(hub);

            // Kinetic Tier Rings
            const tierGroups = [];
            const tierConfigs = [
                { count: 12, length: 1.25, width: 0.44, curl: 0.65, wave: 0.22, y: 0.38, rotX: 0.95, mat: brassMat, speed: 0.4, waveSpeed: 2.2, phaseOffset: 0 },
                { count: 10, length: 1.05, width: 0.38, curl: 0.55, wave: 0.20, y: 0.42, rotX: 0.72, mat: copperMat, speed: -0.5, waveSpeed: 2.6, phaseOffset: 1.5 },
                { count: 8,  length: 0.85, width: 0.32, curl: 0.45, wave: 0.16, y: 0.46, rotX: 0.50, mat: brassMat, speed: 0.65, waveSpeed: 3.0, phaseOffset: 3.0 }
            ];

            tierConfigs.forEach((tier, tIdx) => {
                const group = new THREE.Group();
                group.position.y = tier.y;
                flowerGroup.add(group);

                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsW: 14,
                    segmentsL: 24
                });

                const meshes = [];
                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2;
                    const pivot = new THREE.Group();
                    pivot.rotation.y = angle;

                    const mesh = new THREE.Mesh(geom, tier.mat);
                    mesh.rotation.x = tier.rotX;

                    // Counterbalance weight on petal base
                    const weightGeom = new THREE.SphereGeometry(0.024, 8, 8);
                    const weight = new THREE.Mesh(weightGeom, darkSteelMat);
                    weight.position.set(0, 0.04, 0.02);
                    mesh.add(weight);

                    pivot.add(mesh);
                    group.add(pivot);

                    meshes.push({
                        mesh,
                        baseRotX: tier.rotX,
                        phase: i * (Math.PI * 2 / tier.count)
                    });
                }

                tierGroups.push({
                    group,
                    meshes,
                    speed: tier.speed,
                    waveSpeed: tier.waveSpeed,
                    phaseOffset: tier.phaseOffset
                });
            });

            // Center Stamen Radiators
            const stamenCluster = FlowerUtils.createStamenCluster({
                count: 32,
                height: 0.28,
                spread: 0.12,
                antherColor: 0xf97316,
                filamentColor: 0xd4af37
            });
            stamenCluster.position.y = 0.48;
            flowerGroup.add(stamenCluster);

            // Core Pulse
            const core = FlowerUtils.createGlowingCore({
                radius: 0.13,
                color: 0xf97316,
                glowColor: 0xea580c,
                emissiveIntensity: 2.0
            });
            core.position.y = 0.52;
            flowerGroup.add(core);

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Reciprocal wave motions across concentric counter-rotating tiers
                tierGroups.forEach(tg => {
                    tg.group.rotation.y = elapsed * tg.speed;

                    tg.meshes.forEach(m => {
                        const harmonic = Math.sin(elapsed * tg.waveSpeed + m.phase + tg.phaseOffset) * 0.14;
                        m.mesh.rotation.x = m.baseRotX + harmonic;
                    });
                });

                flowerGroup.position.y = Math.sin(elapsed * 0.8) * 0.02;

                core.update(elapsed);
                atmosphere.update();
                controls.update();

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
