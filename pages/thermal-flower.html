<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Flower | Flowers For You 🌸</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="loading-overlay">
        <div class="loading-flower"></div>
        <p class="loading-text">Scanning heat...</p>
    </div>

    <div class="flower-page">
        <nav class="page-nav">
            <a href="../index.html" class="back-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Garden
            </a>
        </nav>
        <div id="canvas-container" class="flower-canvas"></div>
        <div class="flower-info">
            <h1>Thermal Flower</h1>
            <p>Infrared visualization with radiating heat gradients</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        (function () {
            const container = document.getElementById('canvas-container');
            const { scene, camera, renderer, clock } = FlowerUtils.initScene(container, {
                background: 0x05040a,
                cameraPos: [0, 1.4, 3.8],
                controls: {
                    target: new THREE.Vector3(0, 0.45, 0),
                    minDistance: 2.0,
                    maxDistance: 7.0,
                    autoRotate: true,
                    autoRotateSpeed: 0.35
                }
            });

            // Studio Environment & Lighting
            FlowerUtils.createStudioEnvironment(renderer, 'dark_luxury');

            const ambientLight = new THREE.AmbientLight(0x120824, 1.2);
            scene.add(ambientLight);

            const thermalLight = new THREE.DirectionalLight(0xff6622, 2.5);
            thermalLight.position.set(4, 5, 3);
            scene.add(thermalLight);

            const coldFillLight = new THREE.DirectionalLight(0x0066ff, 1.8);
            coldFillLight.position.set(-4, 2, -3);
            scene.add(coldFillLight);

            const coreHeatLight = new THREE.PointLight(0xffeedd, 3.5, 6);
            coreHeatLight.position.set(0, 0.6, 0);
            scene.add(coreHeatLight);

            // Thermal Calibration Pedestal
            const pedestal = FlowerUtils.createPedestal({
                radius: 1.85,
                height: 0.16,
                y: -0.78,
                color: 0x090514,
                metalness: 0.9,
                roughness: 0.15,
                rimColor: 0xff3300
            });
            scene.add(pedestal);

            // Thermal Floating Heat Particulates
            const atmosphere = FlowerUtils.createAtmosphere(scene, {
                count: 130,
                color: 0xff6622,
                size: 0.026,
                spread: 5.0,
                ySpread: 3.5
            });

            // FLIR Thermal Color Ramp Interpolator
            function getThermalColor(t, target = new THREE.Color()) {
                const clamped = THREE.MathUtils.clamp(t, 0, 1);
                if (clamped < 0.25) {
                    const f = clamped / 0.25;
                    target.setRGB(THREE.MathUtils.lerp(0.05, 0.0, f), THREE.MathUtils.lerp(0.0, 0.25, f), THREE.MathUtils.lerp(0.35, 0.95, f));
                } else if (clamped < 0.5) {
                    const f = (clamped - 0.25) / 0.25;
                    target.setRGB(THREE.MathUtils.lerp(0.0, 0.85, f), THREE.MathUtils.lerp(0.25, 0.05, f), THREE.MathUtils.lerp(0.95, 0.4, f));
                } else if (clamped < 0.75) {
                    const f = (clamped - 0.5) / 0.25;
                    target.setRGB(THREE.MathUtils.lerp(0.85, 1.0, f), THREE.MathUtils.lerp(0.05, 0.65, f), THREE.MathUtils.lerp(0.4, 0.05, f));
                } else {
                    const f = (clamped - 0.75) / 0.25;
                    target.setRGB(1.0, THREE.MathUtils.lerp(0.65, 0.98, f), THREE.MathUtils.lerp(0.05, 0.92, f));
                }
                return target;
            }

            // Flower Group
            const flower = new THREE.Group();
            flower.position.y = 0.35;
            scene.add(flower);

            // 3 Tiers of Double-Curved Petals
            const tiers = [
                { count: 12, length: 1.15, width: 0.38, curl: 0.8, wave: 0.25, angle: 0.8, y: 0.0, baseTemp: 0.45 },
                { count: 9,  length: 0.92, width: 0.34, curl: 0.6, wave: 0.2, angle: 0.55, y: 0.06, baseTemp: 0.65 },
                { count: 7,  length: 0.68, width: 0.28, curl: 0.4, wave: 0.15, angle: 0.35, y: 0.12, baseTemp: 0.85 }
            ];

            const allPetals = [];

            tiers.forEach((tier, tIdx) => {
                const geom = FlowerUtils.createCurvedPetalGeometry({
                    length: tier.length,
                    width: tier.width,
                    curl: tier.curl,
                    wave: tier.wave,
                    segmentsL: 24,
                    segmentsW: 16
                });

                for (let i = 0; i < tier.count; i++) {
                    const angle = (i / tier.count) * Math.PI * 2 + (tIdx * 0.4);
                    const initialCol = getThermalColor(tier.baseTemp);

                    const mat = new THREE.MeshPhysicalMaterial({
                        color: initialCol.clone(),
                        emissive: initialCol.clone(),
                        emissiveIntensity: 0.75 + tIdx * 0.4,
                        metalness: 0.6,
                        roughness: 0.25,
                        clearcoat: 0.9,
                        clearcoatRoughness: 0.15,
                        side: THREE.DoubleSide
                    });

                    const mesh = new THREE.Mesh(geom, mat);
                    mesh.position.y = tier.y;
                    mesh.rotation.y = angle;
                    mesh.rotation.x = tier.angle;
                    mesh.userData = {
                        origRotX: tier.angle,
                        angle,
                        baseTemp: tier.baseTemp,
                        freq: 1.8 + tIdx * 0.6,
                        phase: angle * 2
                    };
                    flower.add(mesh);
                    allPetals.push(mesh);
                }
            });

            // Incandescent Core & Superheated Stamens
            const core = FlowerUtils.createGlowingCore(flower, {
                radius: 0.22,
                color: 0xff3300,
                innerColor: 0xffffff,
                y: 0.18
            });

            FlowerUtils.createStamenCluster(flower, {
                count: 36,
                radius: 0.14,
                height: 0.34,
                spread: 0.38,
                stemColor: 0xff5500,
                antherColor: 0xffffff,
                y: 0.15
            });

            // Radiating Heat Wave Rings
            const heatRingCount = 6;
            const heatRings = [];
            for (let r = 0; r < heatRingCount; r++) {
                const ringGeom = new THREE.RingGeometry(0.25, 0.32, 48);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0xff4400,
                    transparent: true,
                    opacity: 0.6,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(ringGeom, ringMat);
                ring.rotation.x = -Math.PI / 2;
                ring.position.y = 0.2;
                ring.userData = { phase: (r / heatRingCount) };
                flower.add(ring);
                heatRings.push(ring);
            }

            // Thermal Stem (Cooling conduit)
            const stemCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, 0.05, 0),
                new THREE.Vector3(0.03, -0.28, 0.02),
                new THREE.Vector3(-0.02, -0.55, -0.01),
                new THREE.Vector3(0, -0.78, 0)
            ]);
            const stemGeom = new THREE.TubeGeometry(stemCurve, 32, 0.032, 12, false);
            const stemMat = new THREE.MeshPhysicalMaterial({
                color: 0x060c28,
                emissive: 0x002266,
                emissiveIntensity: 0.5,
                metalness: 0.8,
                roughness: 0.3,
                clearcoat: 0.8
            });
            const stemMesh = new THREE.Mesh(stemGeom, stemMat);
            flower.add(stemMesh);

            const tempColHelper = new THREE.Color();

            function animate() {
                requestAnimationFrame(animate);
                const elapsed = clock.getElapsedTime();

                // Gentle thermal breath
                flower.position.y = 0.35 + Math.sin(elapsed * 1.6) * 0.035;

                // Pulsing heat across petals
                for (let i = 0; i < allPetals.length; i++) {
                    const p = allPetals[i];
                    const wave = Math.sin(elapsed * p.userData.freq + p.userData.phase);
                    const temp = p.userData.baseTemp + wave * 0.14;
                    getThermalColor(temp, tempColHelper);

                    p.material.color.copy(tempColHelper);
                    p.material.emissive.copy(tempColHelper);

                    p.rotation.x = p.userData.origRotX + wave * 0.035;
                }

                // Heat wave rings radiating outward
                for (let r = 0; r < heatRingCount; r++) {
                    const ring = heatRings[r];
                    const progress = (elapsed * 0.45 + ring.userData.phase) % 1.0;
                    const scale = 1.0 + progress * 5.0;
                    ring.scale.set(scale, scale, 1);
                    ring.material.opacity = (1.0 - progress) * 0.45;
                    getThermalColor(1.0 - progress * 0.8, ring.material.color);
                }

                // Pulse core and lights
                core.pulse(elapsed, 1.8);
                coreHeatLight.intensity = 3.0 + Math.sin(elapsed * 4.0) * 1.2;

                atmosphere.update();
                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
            FlowerUtils.hideLoading();
        })();
    </script>
</body>

</html>
